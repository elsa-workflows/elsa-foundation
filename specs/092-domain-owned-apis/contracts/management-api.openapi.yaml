openapi: 3.1.0
info:
  title: Elsa Domain-Owned Management API
  version: 1.0.0-draft
  description: |
    Supported management-client API assembled from shell-scoped domain modules.
    Paths are relative to the active shell. Capability contracts, rather than
    internal feature names, tell clients which optional API areas are available.
    This contract replaces the Elsa.Server /_elsa/workflow-management facade.
servers:
  - url: /
    description: Active shell route base
security:
  - bearerAuth: []
tags:
  - name: Capabilities
  - name: Workflow Design
  - name: Activity Design
  - name: Expressions
  - name: Publishing
  - name: Runtime

paths:
  /capabilities:
    get:
      tags: [Capabilities]
      operationId: getApiCapabilities
      summary: Discover the active shell's supported management capabilities
      responses:
        '200':
          description: Caller-neutral capability document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /design/workflows/definitions:
    get:
      tags: [Workflow Design]
      operationId: listWorkflowDefinitions
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/DefinitionListState'
      responses:
        '200':
          description: Definition summaries including draft, version, and deletion facts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowDefinitionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Workflow Design]
      operationId: createWorkflowDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowDefinitionRequest'
      responses:
        '201':
          description: Definition and editable draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /design/workflows/definitions/{definitionId}:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
    get:
      tags: [Workflow Design]
      operationId: getWorkflowDefinition
      responses:
        '200':
          description: Definition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionDetails'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workflow Design]
      operationId: updateWorkflowDefinitionMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowDefinitionMetadataRequest'
      responses:
        '200':
          description: Updated definition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workflow Design]
      operationId: softDeleteWorkflowDefinition
      responses:
        '204':
          description: Definition soft-deleted; publications are unchanged
        '404':
          $ref: '#/components/responses/NotFound'

  /design/workflows/definitions/{definitionId}/restore:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
    post:
      tags: [Workflow Design]
      operationId: restoreWorkflowDefinition
      responses:
        '204':
          description: Definition restored; publications are unchanged
        '404':
          $ref: '#/components/responses/NotFound'

  /design/workflows/definitions/{definitionId}/permanent:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
    delete:
      tags: [Workflow Design]
      operationId: permanentlyDeleteWorkflowDefinition
      summary: Permanently delete an already soft-deleted definition
      responses:
        '204':
          description: Definition permanently deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: >-
            This host composes no publication check (design-only deployment shape), so it cannot verify that no
            live publication still references the definition, and refuses permanent deletion. Soft deletion remains
            available here; permanent deletion requires a host that composes the publishing vertical. Retrying
            against this host will never succeed.

  /design/workflows/drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      tags: [Workflow Design]
      operationId: getWorkflowDraft
      responses:
        '200':
          description: Editable workflow draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDraft'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Workflow Design]
      operationId: replaceWorkflowDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWorkflowDraftRequest'
      responses:
        '200':
          description: Replaced draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workflow Design]
      operationId: discardWorkflowDraft
      responses:
        '204':
          description: Draft discarded
        '404':
          $ref: '#/components/responses/NotFound'

  /design/workflows/drafts/{draftId}/promote:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [Workflow Design]
      operationId: promoteWorkflowDraft
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteWorkflowDraftRequest'
      responses:
        '201':
          description: Immutable Design version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionVersion'
        '400':
          description: Requested version is malformed or not forward
        '409':
          $ref: '#/components/responses/Conflict'

  /design/workflows/drafts/{draftId}/promotion-preflight:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [Workflow Design]
      operationId: preflightWorkflowDraftPromotion
      description: Non-mutating authoritative assessment of the current automatic or exact version candidate. It does not reserve a version; promotion rechecks under lock.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionVersionSelection'
      responses:
        '200':
          description: Current readiness and version candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionPreflightAssessment'
        '404':
          $ref: '#/components/responses/NotFound'

  /design/workflows/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Workflow Design]
      operationId: getWorkflowDefinitionVersion
      description: Resolves only persisted Design versions; synthetic draft identifiers are invalid.
      responses:
        '200':
          description: Persisted immutable version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /design/workflows/scoped-variables/analyze:
    post:
      tags: [Workflow Design]
      operationId: analyzeScopedVariables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopedVariableAnalysisRequest'
      responses:
        '200':
          description: Variables visible at the selected node and shadowing diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedVariableAnalysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /design/workflows/activities/{activityVersionId}/inputs/{inputName}/options:
    parameters:
      - name: activityVersionId
        in: path
        required: true
        schema:
          type: string
      - name: inputName
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Workflow Design]
      operationId: resolveActivityInputOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInputOptionsRequest'
      responses:
        '200':
          description: Context-sensitive options
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [options]
                properties:
                  options:
                    type: array
                    items: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /design/activities/catalog:
    get:
      tags: [Activity Design]
      operationId: getActivityAuthoringCatalog
      parameters:
        - name: availability
          in: query
          description: Privileged callers may request unavailable entries with diagnostics.
          schema:
            type: string
            enum: [addable, all]
            default: addable
      responses:
        '200':
          description: Normalized authoring catalog
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityAuthoringDescriptor'

  /design/activities/availability/settings:
    get:
      tags: [Activity Design]
      operationId: getActivityAvailabilitySettings
      responses:
        '200':
          description: Effective persisted availability settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAvailabilitySettings'
    put:
      tags: [Activity Design]
      operationId: saveActivityAvailabilitySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityAvailabilitySettings'
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAvailabilitySettings'

  /design/activities/availability/diagnostics:
    get:
      tags: [Activity Design]
      operationId: listActivityAvailabilityDiagnostics
      responses:
        '200':
          description: Installed activity availability decisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityAvailabilityDiagnostic'

  /design/activities/drafts/{draftId}/publication-preflight:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [Publishing]
      operationId: preflightActivityDraftPublication
      description: >-
        Non-mutating exact draft/head-bound readiness assessment: diff, impact-first changes, dependency
        evidence, and provider/storage/runtime capability readiness. Returns the review token publish must
        echo back. Requires the workflow-publishing.read permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision]
              properties:
                expectedDraftRevision: { type: integer, format: int64 }
                expectedDefinitionHeadVersionId: { type: [string, 'null'] }
                version: { type: [string, 'null'] }
      responses:
        '200':
          description: Draft publication readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPublicationPreflight'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /design/activities/drafts/{draftId}/publish:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [Publishing]
      operationId: publishActivityDraft
      description: >-
        Rechecks readiness and atomically applies an idempotent reviewed activity publication. Requires the
        review token from publication-preflight, one exact offered version, and a caller-stable idempotency
        key; replaying the same operation identity returns the recorded receipt without another publication.
        Requires the workflow-publishing.manage permission.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision, version, reviewToken, idempotencyKey]
              properties:
                expectedDraftRevision: { type: integer, format: int64 }
                expectedDefinitionHeadVersionId: { type: [string, 'null'] }
                version: { type: string }
                reviewToken: { type: string }
                idempotencyKey: { type: string }
      responses:
        '200':
          description: Existing receipt for a replayed idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPublicationReceipt'
        '201':
          description: Activity publication applied; the Location header names the receipt
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPublicationReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /design/activities/publications/{idempotencyKey}:
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      tags: [Publishing]
      operationId: getActivityPublicationReceipt
      description: >-
        Reads the durable activity publication receipt and its terminal outcome. Requires the
        workflow-publishing.read permission.
      responses:
        '200':
          description: Activity publication receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPublicationReceipt'
        '404':
          $ref: '#/components/responses/NotFound'

  /expressions/descriptors:
    get:
      tags: [Expressions]
      operationId: listExpressionDescriptors
      responses:
        '200':
          description: Expression descriptors contributed by active expression features
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpressionDescriptor'

  /expressions/variable-types:
    get:
      tags: [Expressions]
      operationId: listVariableTypeDescriptors
      responses:
        '200':
          description: Supported workflow variable type descriptors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VariableTypeDescriptor'

  /publishing/activities:
    get:
      tags: [Publishing]
      operationId: listConstructableActivities
      description: >-
        Lists catalog rows the publishing surface can construct, optionally filtered by stable Runtime
        consumer key. Requires the workflow-publishing.read permission.
      parameters:
        - name: consumerKey
          in: query
          schema:
            type: [string, 'null']
      responses:
        '200':
          description: Constructable activity catalog rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConstructableActivity'

  /publishing/activities/{activityId}/construct:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags: [Publishing]
      operationId: constructActivity
      description: >-
        Projects the persisted authored contract used to configure an activity node, without runtime
        activation. Requires the workflow-publishing.read permission.
      responses:
        '200':
          description: Constructed activity contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructedActivity'
        '404':
          $ref: '#/components/responses/NotFound'

  /publishing/activity-drafts/{draftId}/test-runs:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [Publishing]
      operationId: startActivityDraftTestRun
      description: Starts a test run of an activity draft. Requires the workflow-publishing.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartActivityDraftTestRunRequest'
      responses:
        '202':
          description: Test run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDraftTestRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /publishing/activity-drafts/{draftId}/test-runs/idempotency/{idempotencyKey}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      tags: [Publishing]
      operationId: getActivityDraftTestRunByIdempotencyKey
      description: >-
        Resolves an activity draft test run by its draft-scoped idempotency key. Requires the
        workflow-publishing.manage permission.
      responses:
        '200':
          description: Activity draft test run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDraftTestRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /publishing/activity-test-runs/{testRunId}:
    parameters:
      - $ref: '#/components/parameters/TestRunId'
    get:
      tags: [Publishing]
      operationId: getActivityDraftTestRun
      description: Reads an activity draft test run. Requires the workflow-publishing.manage permission.
      responses:
        '200':
          description: Activity draft test run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDraftTestRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /publishing/activity-test-runs/{testRunId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TestRunId'
    post:
      tags: [Publishing]
      operationId: cancelActivityDraftTestRun
      description: >-
        Requests cancellation of an activity draft test run. Requires the workflow-publishing.manage
        permission.
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDraftTestRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /publishing/incident-strategies:
    get:
      tags: [Publishing]
      operationId: listIncidentStrategies
      description: >-
        Lists safe incident-strategy descriptors and the effective publishing default (see also the
        Incident Strategy Discovery contract, specs/140-incident-strategies). Requires the
        workflow-publishing.read permission.
      responses:
        '200':
          description: Deterministically ordered descriptor catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentStrategiesResponse'

  /publishing/preflight:
    post:
      tags: [Publishing]
      operationId: runRuntimeRequirementPreflight
      description: >-
        Validates Runtime Evidence requirements for supplied executable artifacts. Requires the
        workflow-publishing.read permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string }
                artifactIds:
                  type: [array, 'null']
                  items: { type: string }
      responses:
        '200':
          description: Runtime requirement readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRequirementPreflight'

  /publishing/publications/{publicationId}:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    get:
      tags: [Publishing]
      operationId: getPublicationRecord
      responses:
        '200':
          description: The publication journal record, including the design version it published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '404':
          $ref: '#/components/responses/NotFound'

  /publishing/value-conversion/profiles:
    get:
      tags: [Publishing]
      operationId: listValueConversionProfiles
      description: >-
        Projects the active shell's registered conversion profiles for visual authoring pickers. Requires
        the workflow-publishing.read permission.
      responses:
        '200':
          description: Registered conversion profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueConversionProfilesResponse'

  /publishing/workflows/{versionId}/executable-export:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Publishing]
      operationId: exportWorkflowExecutableClosure
      description: >-
        Downloads the published executable closure for the named workflow definition version as an
        attachment. This is a plain Minimal API operation that streams the target's inline payload bytes
        rather than a typed response object, so the body is an opaque JSON envelope rather than a documented
        schema. Requires the workflow-publishing.read permission.
      responses:
        '200':
          description: Executable closure envelope, served as a downloadable attachment
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="<definitionId>-<artifactVersion>-closure.json"'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /publishing/workflows/{versionId}/preflight:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Publishing]
      operationId: preflightWorkflowPublication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationIntent'
      responses:
        '200':
          description: Resolved action, slot, trigger changes, and conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPreflight'
        '400':
          $ref: '#/components/responses/PublicationBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PublicationConflict'

  /publishing/workflows/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Publishing]
      operationId: publishWorkflowVersion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishWorkflowRequest'
      responses:
        '200':
          description: Existing identical publication remains authoritative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '201':
          description: Publication activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '202':
          description: Authority recorded; projection reconciliation is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          $ref: '#/components/responses/PublicationBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PublicationConflict'

  /publishing/workflows/{definitionId}/slots/{slotName}:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
      - $ref: '#/components/parameters/SlotName'
    delete:
      tags: [Publishing]
      operationId: retireWorkflowPublicationSlot
      responses:
        '202':
          description: Slot retired or trigger reconciliation pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationSlot'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PublicationConflict'

  /publishing/workflows/{definitionId}/slots/{slotName}/restore:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
      - $ref: '#/components/parameters/SlotName'
    post:
      tags: [Publishing]
      operationId: restoreWorkflowPublicationSlot
      responses:
        '200':
          description: Slot restored and authoritative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationSlot'
        '202':
          description: Restore accepted; trigger reconciliation pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationSlot'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PublicationConflict'

  /publishing/workflows/{definitionId}/policy:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
    get:
      tags: [Publishing]
      operationId: getWorkflowPublicationPolicy
      responses:
        '200':
          description: Workflow policy and resolved host fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPolicy'
    put:
      tags: [Publishing]
      operationId: setWorkflowPublicationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPublicationPolicyRequest'
      responses:
        '200':
          description: Saved workflow publication policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPolicy'
        '409':
          $ref: '#/components/responses/PublicationConflict'

  /publishing/workflows/{versionId}/test-runs:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Publishing]
      operationId: startWorkflowVersionTestRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: true
                acknowledgeUnavailableExpressionValidation:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Test-run source reference and execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'

  /publishing/workflows/drafts/test-runs:
    post:
      tags: [Publishing]
      operationId: startWorkflowDraftTestRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definitionId, snapshotId, state]
              properties:
                definitionId: { type: string }
                snapshotId: { type: string }
                state:
                  $ref: '#/components/schemas/WorkflowDefinitionState'
                artifactVersion: { type: [string, 'null'] }
                inputs:
                  type: object
                  additionalProperties: true
                activityPresentation:
                  type: array
                  items:
                    type: object
                    required: [nodeId]
                    properties:
                      nodeId: { type: string }
                      displayName: { type: [string, 'null'] }
                      description: { type: [string, 'null'] }
                acknowledgeUnavailableExpressionValidation:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Draft snapshot, test-run source reference, and execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'

  /publishing/workflows/preflight:
    post:
      tags: [Publishing]
      operationId: preflightWorkflowPublicationSnapshot
      description: >-
        Preflights a supplied workflow snapshot (not yet a persisted Design version) and issues a review
        token bound to the candidate hash. Requires the workflow-publishing.read permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PublicationIntent'
                - type: object
                  required: [definitionId, state]
                  properties:
                    definitionId: { type: string }
                    state:
                      $ref: '#/components/schemas/WorkflowDefinitionState'
                    layout:
                      type: array
                      items:
                        $ref: '#/components/schemas/DesignMetadata'
      responses:
        '200':
          description: Resolved action, slot, claims, trigger changes, and conflicts for the snapshot candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationSnapshotPreflight'
        '400':
          $ref: '#/components/responses/PublicationBadRequest'
        '409':
          $ref: '#/components/responses/PublicationConflict'

  /runtime/workflows/executables:
    get:
      tags: [Runtime]
      operationId: listWorkflowExecutables
      parameters:
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/SourceReferenceScope'
        - name: includeRetired
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Runtime-owned executable artifacts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowExecutableSummary'

  /runtime/workflows/activation-slots/{definitionId}:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
    get:
      tags: [Runtime]
      operationId: listWorkflowActivationSlots
      responses:
        '200':
          description: Activation slots for a definition
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowActivationSlot'

  /runtime/workflows/activation-slots/{definitionId}/{slotName}:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
      - $ref: '#/components/parameters/SlotName'
    get:
      tags: [Runtime]
      operationId: getWorkflowActivationSlot
      responses:
        '200':
          description: The live activation for one named slot and the source that owns it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowActivationSlot'
        '404':
          $ref: '#/components/responses/NotFound'

  /runtime/workflows/executables/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Runtime]
      operationId: getWorkflowExecutable
      responses:
        '200':
          description: Executable artifact inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutableDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /runtime/workflows/executables/{artifactId}/provenance:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Runtime]
      operationId: getWorkflowExecutableProvenance
      description: Read-only source provenance. Publishing owns lifecycle mutation.
      responses:
        '200':
          description: Source references and retained-execution protection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutableProvenance'
        '404':
          $ref: '#/components/responses/NotFound'

  /runtime/workflows/executables/{artifactId}/execute:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [Runtime]
      operationId: executeWorkflowExecutable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: >-
            Workflow started and drained to quiescence. The call is synchronous to quiescence (ADR 0031): the run has
            already reached completion, a fault, or its first durable suspension. The body's commandDispatchStatus
            reports the drain outcome (Accepted, AcceptedButFaulted, Duplicate, or Deferred); AcceptedButFaulted still
            returns 200 with a body describing the fault. GET /runtime/workflows/instances/{workflowExecutionId}
            remains the polling surface for later state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionDispatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /runtime/workflows/instances:
    get:
      tags: [Runtime]
      operationId: listWorkflowInstances
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Workflow execution instances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowInstanceSummary'

  /runtime/workflows/instances/{workflowExecutionId}:
    parameters:
      - $ref: '#/components/parameters/WorkflowExecutionId'
    get:
      tags: [Runtime]
      operationId: getWorkflowInstance
      responses:
        '200':
          description: Workflow execution pinned to its executable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstanceDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /runtime/workflows/instances/{workflowExecutionId}/activity-executions/{activityExecutionId}:
    parameters:
      - $ref: '#/components/parameters/WorkflowExecutionId'
      - name: activityExecutionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Runtime]
      operationId: getActivityExecution
      responses:
        '200':
          description: Activity execution details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'

  /runtime/workflows/instances/{workflowExecutionId}/incidents:
    parameters:
      - $ref: '#/components/parameters/WorkflowExecutionId'
    get:
      tags: [Runtime]
      operationId: listWorkflowIncidents
      responses:
        '200':
          description: Runtime incidents for the workflow execution
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /runtime/workflows/diagnostics/settings:
    get:
      tags: [Runtime]
      operationId: getRuntimeDiagnosticsSettings
      responses:
        '200':
          description: Runtime diagnostics settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeDiagnosticsSettings'
    put:
      tags: [Runtime]
      operationId: saveRuntimeDiagnosticsSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeDiagnosticsSettings'
      responses:
        '200':
          description: Saved runtime diagnostics settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeDiagnosticsSettings'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^(?!draft:).+'
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    SlotName:
      name: slotName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    WorkflowExecutionId:
      name: workflowExecutionId
      in: path
      required: true
      schema:
        type: string
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: idempotencyKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TestRunId:
      name: testRunId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Caller lacks the domain permission
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Current lifecycle state or trigger authority conflicts with the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    PublicationConflict:
      description: >-
        A publication lifecycle, trigger authority, or policy revision conflict (issue #1699).
        errorCode carries the machine-readable PublicationFailureCodes value.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicationProblem'
    PublicationBadRequest:
      description: >-
        The publication policy or request intent could not be resolved (issue #1699). errorCode
        carries the machine-readable PublicationFailureCodes value.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicationProblem'
    ServiceUnavailable:
      description: Optional operational capability is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CapabilityDocument:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ApiCapability'
    ApiCapability:
      type: object
      required: [id, contractVersion, links]
      properties:
        id:
          type: string
          enum:
            - elsa.api.workflow-design
            - elsa.api.activity-design
            - elsa.api.expressions
            - elsa.api.publishing
            - elsa.api.runtime
        contractVersion:
          type: string
          pattern: '^[1-9][0-9]*$'
          examples: ['1']
        links:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityLink'
    CapabilityLink:
      type: object
      required: [rel, href]
      properties:
        rel:
          type: string
          description: |
            Stable relation such as workflow-definitions, workflow-drafts,
            workflow-versions, scoped-variable-analysis, activity-input-options,
            activity-catalog, activity-availability, expression-descriptors,
            variable-types, publication-preflight, workflow-activation-slots,
            publication-policy, workflow-test-runs, workflow-executables,
            workflow-executable-provenance, workflow-execute, workflow-instances,
            or runtime-diagnostics.
        href:
          type: string
          description: URI relative to the active shell route base
        templated:
          type: boolean
          default: false

    Problem:
      type: object
      required: [message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PublicationProblem:
      description: >-
        The Publishing API's problem shape (RFC 7807 fields plus the FastEndpoints-era traceId and
        errors extensions). errorCode is additive and present only for the coded Publishing failures
        listed in its enum; every other Publishing problem (404s, uncoded 400s) omits it entirely
        rather than sending null (issue #1699). See the Publishing API README "Problem codes" section.
      type: object
      required: [type, title, status, detail, instance, traceId, errors]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errorCode:
          type: string
          enum:
            - slot_owner_conflict
            - slot_revision_conflict
            - activation_compensation_failed
            - projection_preparation_failed
            - projection_activation_failed
            - publication_activation_failed
            - trigger_conflict
            - publication_snapshot_stale
            - policy_revision_conflict
            - expected_publication_mismatch
            - workflow_policy_mismatch
            - invalid_host_policy
            - explicit_slot_required
            - invalid_default_slot
            - unsupported_action
            - named_slot_required
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name: { type: string }
              reason: { type: string }
    DefinitionListState:
      type: string
      enum: [active, deleted, all]
      default: active
    WorkflowDefinitionSummary:
      type: object
      required: [id, name, createdAt, lastModifiedAt, versionCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastModifiedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
        draftId: { type: [string, 'null'] }
        latestVersionId: { type: [string, 'null'] }
        latestVersion: { type: [string, 'null'] }
        versionCount: { type: integer, minimum: 0 }
    WorkflowDefinitionDetails:
      allOf:
        - $ref: '#/components/schemas/WorkflowDefinitionSummary'
        - type: object
          properties:
            draft:
              oneOf:
                - $ref: '#/components/schemas/WorkflowDraft'
                - type: 'null'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowDefinitionVersionSummary'
    CreateWorkflowDefinitionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        initialState:
          oneOf:
            - $ref: '#/components/schemas/WorkflowDefinitionState'
            - type: 'null'
        layout:
          type: array
          items:
            $ref: '#/components/schemas/DesignMetadata'
    UpdateWorkflowDefinitionMetadataRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
    WorkflowDraft:
      type: object
      required: [id, definitionId, state, layout]
      properties:
        id: { type: string }
        definitionId: { type: string }
        sourceVersionId: { type: [string, 'null'] }
        state:
          $ref: '#/components/schemas/WorkflowDefinitionState'
        layout:
          type: array
          items:
            $ref: '#/components/schemas/DesignMetadata'
    ReplaceWorkflowDraftRequest:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/WorkflowDefinitionState'
        layout:
          type: array
          items:
            $ref: '#/components/schemas/DesignMetadata'
    PromotionVersionSelection:
      type: object
      additionalProperties: false
      properties:
        requestedVersion:
          type: string
          description: Optional exact SemVer label. Surrounding whitespace is trimmed; omit for automatic next-major assignment.
    PromoteWorkflowDraftRequest:
      type: object
      additionalProperties: false
      properties:
        requestedVersion:
          type: string
          description: Optional exact SemVer label. Surrounding whitespace is trimmed; omit for automatic next-major assignment.
        operationKey:
          type: string
          minLength: 1
          description: Retry identity. Reuse only with identical normalized version-selection material.
    PromotionPreflightAssessment:
      type: object
      required: [isReady, assignmentMode, issues]
      properties:
        isReady: { type: boolean }
        assignmentMode: { type: string, enum: [automatic, exact] }
        requestedVersion: { type: [string, 'null'] }
        resolvedVersion: { type: [string, 'null'] }
        latestVersion: { type: [string, 'null'] }
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [draft-validation, invalid-version, not-forward, version-conflict] }
              message: { type: string }
              path: { type: [string, 'null'] }
    WorkflowDefinitionVersionSummary:
      type: object
      required: [id, definitionId, version]
      properties:
        id: { type: string }
        definitionId: { type: string }
        version: { type: string }
        createdAt: { type: string, format: date-time }
    WorkflowDefinitionVersion:
      type: object
      required: [id, version, definition, state, layout]
      properties:
        id: { type: string }
        version: { type: string }
        definition:
          type: object
          required: [id, name, createdAt, lastModifiedAt]
          properties:
            id: { type: string }
            name: { type: string }
            description: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            lastModifiedAt: { type: string, format: date-time }
            deletedAt: { type: [string, 'null'], format: date-time }
        state:
          $ref: '#/components/schemas/WorkflowDefinitionState'
        layout:
          type: array
          items:
            $ref: '#/components/schemas/DesignMetadata'
    WorkflowDefinitionState:
      type: object
      properties:
        variables:
          type: array
          items:
            type: object
            additionalProperties: true
        rootActivity:
          oneOf:
            - $ref: '#/components/schemas/AuthoredActivity'
            - type: 'null'
        inputs:
          type: array
          items:
            type: object
            additionalProperties: true
        outputs:
          type: array
          items:
            type: object
            additionalProperties: true
    AuthoredActivity:
      type: object
      required: [nodeId, activityVersionId]
      properties:
        nodeId: { type: string }
        activityVersionId: { type: string }
        inputs:
          type: object
          additionalProperties: true
        outputs:
          type: object
          additionalProperties: true
        structure:
          type: object
          additionalProperties: true
    DesignMetadata:
      type: object
      additionalProperties: true
    ScopedVariableAnalysisRequest:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/WorkflowDefinitionState'
        nodeId: { type: [string, 'null'] }
    ScopedVariableAnalysis:
      type: object
      required: [visibleVariables, shadowingWarnings]
      properties:
        visibleVariables:
          type: array
          items:
            type: object
            additionalProperties: true
        shadowingWarnings:
          type: array
          items:
            type: object
            additionalProperties: true
    ActivityInputOptionsRequest:
      type: object
      required: [nodeId, workflowState]
      properties:
        nodeId: { type: string }
        workflowState:
          $ref: '#/components/schemas/WorkflowDefinitionState'

    ActivityAuthoringDescriptor:
      type: object
      required: [activityVersionId, activityTypeKey, version, displayName, inputs, outputs, ports, authoringTemplate]
      properties:
        activityVersionId: { type: string }
        activityTypeKey: { type: string }
        version: { type: string }
        displayName: { type: string }
        category: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        executionType: { type: string }
        available: { type: boolean }
        availabilityReason: { type: [string, 'null'] }
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ActivityInputDescriptor'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/ActivityOutputDescriptor'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPortDescriptor'
        containerStructure:
          type: object
          additionalProperties: true
        authoringTemplate:
          $ref: '#/components/schemas/AuthoredActivity'
    ActivityInputDescriptor:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        displayName: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        order: { type: integer }
        category: { type: [string, 'null'] }
        isBrowsable: { type: boolean }
        isRequired: { type: boolean }
        uiHint: { type: [string, 'null'] }
        defaultValue: {}
        defaultSyntax: { type: [string, 'null'] }
        uiSpecifications:
          type: object
          additionalProperties: true
    ActivityOutputDescriptor:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        displayName: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        isBrowsable: { type: boolean }
    ActivityPortDescriptor:
      type: object
      required: [name]
      properties:
        name: { type: string }
        displayName: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        isBrowsable: { type: boolean }
    ActivityAvailabilitySettings:
      type: object
      required: [scope, mode, rules]
      properties:
        scope: { type: string, default: host }
        mode: { type: string }
        rules:
          type: object
          properties:
            activityTypes:
              type: array
              items: { type: string }
            sets:
              type: array
              items: { type: string }
    ActivityAvailabilityDiagnostic:
      type: object
      required: [activityTypeKey, available]
      properties:
        activityTypeKey: { type: string }
        available: { type: boolean }
        reason: { type: [string, 'null'] }

    ExpressionDescriptor:
      type: object
      required: [type, displayName, editingMode]
      properties:
        type: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        editingMode:
          type: string
          enum: [literal, text, structured, reference]
    VariableTypeDescriptor:
      type: object
      required: [alias, displayName]
      properties:
        alias: { type: string }
        displayName: { type: string }
        category: { type: [string, 'null'] }
        defaultEditor: { type: [string, 'null'] }

    PublicationIntent:
      type: object
      properties:
        slotName:
          type: string
          default: default
        action:
          type: string
          enum: [replace, sideBySide]
        expectedPublicationId:
          type: [string, 'null']
          description: Optional optimistic-concurrency token for the occupied slot
    PublishWorkflowRequest:
      allOf:
        - $ref: '#/components/schemas/PublicationIntent'
        - type: object
          properties:
            preflightToken:
              type: [string, 'null']
              description: Opaque token returned by a snapshot preflight (POST publishing/workflows/preflight)
    PublicationPreflight:
      type: object
      required: [definitionId, versionId, slotName, resolvedAction, triggers, canActivate]
      properties:
        definitionId: { type: string }
        versionId: { type: string }
        slotName: { type: string }
        resolvedAction: { type: string, enum: [replace, sideBySide] }
        policySource: { type: string, enum: [request, workflow, host] }
        canActivate: { type: boolean }
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/TriggerChange'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/TriggerConflict'
        targetSlotOwner:
          description: >-
            The activation source that owns the resolved slot when it is not publishing, for example an
            imported or mounted artifact; null when the slot is empty, unpublished, or publishing-owned.
            canActivate is false while it is set, and publish refuses the slot with 409 because ownership
            transfer is an operator action.
          oneOf:
            - $ref: '#/components/schemas/PublicationSlotOwner'
            - type: 'null'
    PublicationSlotOwner:
      type: object
      required: [sourceKind]
      properties:
        sourceKind: { type: string }
        sourceId: { type: [string, 'null'] }
    TriggerChange:
      type: object
      required: [change, key, cardinality]
      properties:
        change: { type: string, enum: [added, removed, retained] }
        key: { type: string }
        cardinality: { type: string, enum: [exclusive, fanOut] }
    TriggerConflict:
      type: object
      required: [key, cardinality, publicationId, slotName]
      properties:
        key: { type: string }
        cardinality: { type: string, enum: [exclusive, fanOut] }
        publicationId: { type: string }
        slotName: { type: string }
    TriggerClaim:
      type: object
      required: [key, cardinality]
      properties:
        key: { type: string }
        cardinality: { type: string, enum: [exclusive, fanOut] }
    PublicationSnapshotPreflight:
      type: object
      required: [preflightToken, candidateHash, definitionId, slotName, resolvedAction, canActivate, claims, triggers, conflicts]
      properties:
        preflightToken: { type: string }
        candidateHash: { type: string }
        definitionId: { type: string }
        versionId: { type: [string, 'null'] }
        slotName: { type: string }
        resolvedAction: { type: string, enum: [replace, sideBySide] }
        policySource: { type: string, enum: [request, workflow, host] }
        canActivate: { type: boolean }
        claims:
          type: array
          items:
            $ref: '#/components/schemas/TriggerClaim'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/TriggerChange'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/TriggerConflict'
        targetSlotOwner:
          oneOf:
            - $ref: '#/components/schemas/PublicationSlotOwner'
            - type: 'null'
    Publication:
      type: object
      required: [publicationId, definitionId, versionId, artifactId, slotName, status, createdAt]
      properties:
        publicationId: { type: string }
        definitionId: { type: string }
        versionId: { type: string }
        artifactId: { type: string }
        slotName: { type: string }
        sourceReferenceId: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/PublicationStatus'
        createdAt: { type: string, format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
        retiredAt: { type: [string, 'null'], format: date-time }
        failure:
          oneOf:
            - $ref: '#/components/schemas/PublicationFailure'
            - type: 'null'
    PublicationFailure:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    PublicationSlot:
      type: object
      required: [slotId, definitionId, slotName, revision, updatedAt]
      properties:
        slotId: { type: string }
        definitionId: { type: string }
        slotName: { type: string }
        activePublicationId: { type: [string, 'null'] }
        revision: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        status:
          oneOf:
            - $ref: '#/components/schemas/PublicationStatus'
            - type: 'null'
        publication:
          oneOf:
            - $ref: '#/components/schemas/Publication'
            - type: 'null'
    WorkflowActivationSlot:
      type: object
      required: [slotId, definitionId, slotName, revision, updatedAt]
      properties:
        slotId: { type: string }
        definitionId: { type: string }
        slotName: { type: string }
        activeActivationId: { type: [string, 'null'] }
        sourceKind: { type: [string, 'null'] }
        sourceId: { type: [string, 'null'] }
        revision: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    PublicationStatus:
      type: string
      enum: [preparing, pending, active, retiring, retired, failed]
    PublicationPolicy:
      type: object
      required: [definitionId, defaultAction, defaultSlotName, source, revision, updatedAt]
      properties:
        definitionId: { type: string }
        defaultAction: { type: string, enum: [replace, requireExplicitSlot] }
        defaultSlotName: { type: string, default: default }
        source: { type: string, enum: [workflow, host] }
        revision: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    SetPublicationPolicyRequest:
      type: object
      properties:
        defaultAction: { type: string, enum: [replace, requireExplicitSlot] }
        defaultSlotName: { type: string, default: default }
        expectedRevision: { type: integer, format: int64, default: 0 }
    TestRun:
      type: object
      required: [testRunId, definitionId, definitionVersionId, status, metadata]
      properties:
        testRunId: { type: string }
        definitionId: { type: string }
        definitionVersionId: { type: string }
        artifactId: { type: [string, 'null'] }
        workflowExecutionId: { type: [string, 'null'] }
        status: { type: string }
        commandDispatchStatus: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        metadata:
          type: object
          additionalProperties: { type: string }

    ConstructableActivity:
      type: object
      required: [activityVersionId, definitionId, version, providerKey, providerSchemaVersion, consumerKey, consumerSchemaVersion]
      properties:
        activityVersionId: { type: string }
        definitionId: { type: string }
        version: { type: string }
        providerKey: { type: string }
        providerSchemaVersion: { type: string }
        consumerKey: { type: string }
        consumerSchemaVersion: { type: string }
    ConstructedActivity:
      type: object
      required: [activityVersionId, descriptorType, descriptorPayload, inputs, outputs]
      properties:
        activityVersionId: { type: string }
        descriptorType: { type: string }
        descriptorPayload:
          type: object
          additionalProperties: true
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Argument'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/Argument'
    Argument:
      description: >-
        A bound argument of a constructed activity instance, as distinct from the authoring-time
        ActivityInputDescriptor/ActivityOutputDescriptor schemas.
      type: object
      required: [referenceKey, name, typeName]
      properties:
        referenceKey: { type: string }
        name: { type: string }
        typeName: { type: string }

    IncidentStrategyReference:
      type: object
      required: [alias, version]
      properties:
        alias: { type: string }
        version: { type: string }
    IncidentStrategyDescriptor:
      type: object
      required: [alias, version, displayName]
      properties:
        alias: { type: string }
        version: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
    IncidentStrategiesResponse:
      type: object
      required: [items, defaultStrategy]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentStrategyDescriptor'
        defaultStrategy:
          $ref: '#/components/schemas/IncidentStrategyReference'

    ValueRepresentation:
      type: string
      enum: [typedValue, structuredValue, textValue, formattedContent, binaryContent, durableReference, transientResource]
    ValueConversionProfileReference:
      type: object
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: string }
    ValueConversionProfile:
      type: object
      required: [profile, supportedSourceRepresentations, supportedTargetAliases]
      properties:
        profile:
          $ref: '#/components/schemas/ValueConversionProfileReference'
        supportedSourceRepresentations:
          type: array
          items:
            $ref: '#/components/schemas/ValueRepresentation'
        supportedTargetAliases:
          type: array
          items: { type: string }
    ValueConversionProfilesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValueConversionProfile'

    RuntimeRequirementPreflightItem:
      type: object
      required: [consumerKey, schemaVersion, status, affectedArtifactCount]
      properties:
        consumerKey: { type: string }
        schemaVersion: { type: string }
        status: { type: string }
        affectedArtifactCount: { type: integer, minimum: 0 }
    RuntimeRequirementPreflight:
      type: object
      required: [checkedArtifactCount, isReady, requirements, diagnostics]
      properties:
        checkedArtifactCount: { type: integer, minimum: 0 }
        isReady: { type: boolean }
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeRequirementPreflightItem'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDiagnostic'

    ActivityDiagnosticSubject:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string }
        id: { type: string }
        definitionId: { type: [string, 'null'] }
        versionId: { type: [string, 'null'] }
        revision: { type: [integer, 'null'], format: int64 }
    ActivityDiagnostic:
      type: object
      required: [code, severity, message, subject, metadata]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string }
        subject:
          $ref: '#/components/schemas/ActivityDiagnosticSubject'
        location:
          type: [object, 'null']
          additionalProperties: true
          description: Optional provider/JSON-pointer/reference-key/dependency-path location detail
        remediation: { type: [string, 'null'] }
        metadata:
          type: object
          additionalProperties: { type: string }

    ActivityPublicationDependencyEvidence:
      type: object
      required: [definitionId, versionId, version, templateHash, occurrenceId]
      properties:
        definitionId: { type: string }
        versionId: { type: string }
        version: { type: string }
        templateHash: { type: string }
        occurrenceId: { type: string }
    ActivityPublicationCapabilityReadiness:
      type: object
      required: [kind, key, status, supportedSchemaVersions]
      properties:
        kind: { type: string }
        key: { type: string }
        schemaVersion: { type: [string, 'null'] }
        status: { type: string }
        supportedSchemaVersions:
          type: array
          items: { type: string }
    ActivityPublicationPreflight:
      type: object
      required:
        - draftId
        - draftRevision
        - definitionId
        - hasBaseline
        - reviewToken
        - isPublishable
        - minimumVersion
        - validVersions
        - impactFirstChanges
        - dependencies
        - provider
        - storage
        - runtime
        - diagnostics
        - reviewedVersion
      properties:
        draftId: { type: string }
        draftRevision: { type: integer, format: int64 }
        definitionId: { type: string }
        definitionHeadVersionId: { type: [string, 'null'] }
        hasBaseline: { type: boolean }
        reviewToken: { type: string }
        isPublishable: { type: boolean }
        minimumVersion: { type: string }
        validVersions:
          type: array
          items: { type: string }
        diff:
          type: [object, 'null']
          additionalProperties: true
          description: Activity version diff summary (Activity Design domain shape)
        impactFirstChanges:
          type: array
          items:
            type: object
            additionalProperties: true
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPublicationDependencyEvidence'
        provider:
          $ref: '#/components/schemas/ActivityPublicationCapabilityReadiness'
        storage:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPublicationCapabilityReadiness'
        runtime:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPublicationCapabilityReadiness'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDiagnostic'
        reviewedVersion: { type: string }
    ActivityPublicationOutcome:
      type: object
      required: [definitionId, definitionVersionId, draftId, version, templateId, templateHash, sourceReferenceId, publishedAt]
      properties:
        definitionId: { type: string }
        definitionVersionId: { type: string }
        draftId: { type: string }
        version: { type: string }
        templateId: { type: string }
        templateHash: { type: string }
        sourceReferenceId: { type: string }
        publishedAt: { type: string, format: date-time }
    ActivityPublicationReceipt:
      type: object
      required: [idempotencyKey, status, draftId, expectedDraftRevision, reviewToken, requestedVersion, diagnostics, updatedAt]
      properties:
        idempotencyKey: { type: string }
        status: { type: string, enum: [applied, rejected, stale, failed, outcomeUnknown] }
        draftId: { type: string }
        expectedDraftRevision: { type: integer, format: int64 }
        expectedDefinitionHeadVersionId: { type: [string, 'null'] }
        reviewToken: { type: string }
        requestedVersion: { type: string }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/ActivityPublicationOutcome'
            - type: 'null'
        errorCode: { type: [string, 'null'] }
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDiagnostic'
        updatedAt: { type: string, format: date-time }

    ActivityDraftTestRunInput:
      type: object
      required: [state]
      properties:
        state: { type: string }
        value: {}
    StartActivityDraftTestRunRequest:
      type: object
      required: [expectedRevision, idempotencyKey]
      properties:
        expectedRevision: { type: integer, format: int64 }
        idempotencyKey: { type: string }
        inputs:
          type: [object, 'null']
          additionalProperties:
            $ref: '#/components/schemas/ActivityDraftTestRunInput'
        correlationId: { type: [string, 'null'] }
    ActivityDraftTestRunFailure:
      type: object
      required: [kind, code, message, diagnostics]
      properties:
        kind: { type: string }
        code: { type: string }
        message: { type: string }
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDiagnostic'
    ActivityDraftTestRunExpiration:
      type: object
      required:
        - sourceReferenceExpiresAt
        - sourceReferenceExpired
        - sourceReferenceRetained
        - evidenceRetention
        - evidenceRetained
        - runStillActive
        - receiptExpiresAt
      properties:
        sourceReferenceExpiresAt: { type: string, format: date-time }
        sourceReferenceExpired: { type: boolean }
        sourceReferenceRetained: { type: boolean }
        evidenceRetention: { type: string }
        evidenceExpiresAt: { type: [string, 'null'], format: date-time }
        evidenceRetained: { type: boolean }
        runExpiresAt: { type: [string, 'null'], format: date-time }
        runStillActive: { type: boolean }
        receiptExpiresAt: { type: string, format: date-time }
    ActivityDraftTestRunCancellation:
      type: object
      required: [capabilityAdvertised, available, status]
      properties:
        capabilityAdvertised: { type: boolean }
        available: { type: boolean }
        status: { type: string }
        reason: { type: [string, 'null'] }
    ActivityDraftTestRun:
      type: object
      required: [testRunId, draftId, draftRevision, workflowExecutionId, status, expiration, cancellation, requestedAt, updatedAt]
      properties:
        testRunId: { type: string }
        draftId: { type: string }
        draftRevision: { type: integer, format: int64 }
        artifactId: { type: [string, 'null'] }
        sourceReferenceId: { type: [string, 'null'] }
        workflowExecutionId: { type: string }
        outerActivityExecutionId: { type: [string, 'null'] }
        status: { type: string }
        commandDispatchStatus: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        failure:
          oneOf:
            - $ref: '#/components/schemas/ActivityDraftTestRunFailure'
            - type: 'null'
        expiration:
          $ref: '#/components/schemas/ActivityDraftTestRunExpiration'
        cancellation:
          $ref: '#/components/schemas/ActivityDraftTestRunCancellation'
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SourceReferenceScope:
      type: string
      enum: [Published, TestRun]
    ExecutableSourceReference:
      type: object
      required: [sourceReferenceId, artifactId, scope, sourceType, sourceId, createdAt]
      properties:
        sourceReferenceId: { type: string }
        artifactId: { type: string }
        scope:
          $ref: '#/components/schemas/SourceReferenceScope'
        sourceType:
          type: string
          enum: [WorkflowDefinitionVersion, WorkflowDraftSnapshot]
        sourceId: { type: string }
        publicationId: { type: [string, 'null'] }
        slotName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
        live: { type: boolean }
    WorkflowExecutableSummary:
      type: object
      required: [artifactId, createdAt, liveSourceReferenceCount, retainedExecutionCount]
      properties:
        artifactId: { type: string }
        createdAt: { type: string, format: date-time }
        liveSourceReferenceCount: { type: integer, minimum: 0 }
        retainedExecutionCount: { type: integer, minimum: 0 }
    WorkflowExecutableDetails:
      allOf:
        - $ref: '#/components/schemas/WorkflowExecutableSummary'
        - type: object
          required: [rootActivity]
          properties:
            rootActivity:
              type: object
              additionalProperties: true
            metadata:
              type: object
              additionalProperties: true
    ExecutableProvenance:
      type: object
      required: [artifactId, sourceReferences, retainedExecutionCount, protectedFromCollection]
      properties:
        artifactId: { type: string }
        sourceReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExecutableSourceReference'
        retainedExecutionCount: { type: integer, minimum: 0 }
        protectedFromCollection: { type: boolean }
    WorkflowExecutionDispatch:
      type: object
      required: [workflowExecutionId, artifactId, status]
      properties:
        workflowExecutionId: { type: string }
        artifactId: { type: string }
        status: { type: string }
    WorkflowInstanceSummary:
      type: object
      required: [workflowExecutionId, artifactId, status, createdAt]
      properties:
        workflowExecutionId: { type: string }
        artifactId: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    WorkflowInstanceDetails:
      allOf:
        - $ref: '#/components/schemas/WorkflowInstanceSummary'
        - type: object
          properties:
            state:
              type: object
              additionalProperties: true
            # Host-configuration-derived checkpoint cadence + implied inspection granularity (ADR 0032 R3).
            checkpointCadence: { type: string, enum: [Immediate, Coalesced] }
            maxSegmentCheckpoints: { type: [integer, 'null'], minimum: 1 }
            inspectionGranularity: { type: string, enum: [activity-level, boundary-level] }
    RuntimeDiagnosticsSettings:
      type: object
      additionalProperties: true
