    ports:
      - "13000:8080"
    volumes:
      # Nuplane directory feed: drop .nupkg activity/extension packages here to load them.
      # (A subfolder mount — do NOT mount a volume over /app, that would shadow the app binaries.)
      - server-packages:/app/packages

  elsa-studio:
    image: elsaworkflows/elsa-studio:latest
    depends_on:
      elsa-workbench:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Consumed by the Studio client IN THE BROWSER, so it must be the server's
      # host-reachable URL — NOT the compose service name (http://elsa-workbench:8080),
      # which only resolves inside the Docker network.
      Studio__BackendBaseUrl: "http://localhost:13000"
      # Elsa host management key used server-side by the Studio management bridge
      # when calling elsa-workbench. Never sent to the browser.
      # MUST match elsa-workbench's Elsa__ModuleManagement__ApiKey.
      Studio__BackendModuleManagementApiKey: elsa-docker-demo-key
    ports:
      - "14000:8080"

volumes:
  server-packages:
