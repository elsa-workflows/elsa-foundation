# =============================================================================
# Elsa published-image stack: Elsa.Workbench + Elsa Studio — no clone, no build.
#
# Runs the images published to Docker Hub by CI (elsaworkflows/elsa-workbench and
# elsaworkflows/elsa-studio). Download just this file and start it:
#
#   docker compose -f docker-compose.images.yml up
#
# URLs (host):
#   Elsa.Workbench : http://localhost:13000   (root returns Healthy JSON)
#   Elsa Studio : http://localhost:14000
#
# Persistence: the server image's baked-in default composition is SQLite, written
# under the content root (/app). It is EPHEMERAL here — removing the elsa-workbench
# container discards it. For durable, Postgres-backed persistence (or to build from
# source), use the reference stack in docker-compose.yml instead.
#
# Pin for reproducible runs. Published tags are latest, 4.0.0-preview.<n> and
# sha-<short-commit> — there are no 4 / 4.0 / 4.0.0 release tags yet, e.g.
# elsaworkflows/elsa-workbench:4.0.0-preview.471 or :sha-2e7dbf0. The two images
# are built by separate pipelines, so their run numbers do not line up.
# =============================================================================

name: elsa-stack

services:
  elsa-workbench:
    image: elsaworkflows/elsa-workbench:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Elsa host management key accepted on the server's module-management API.
      # Server-side only. MUST match Studio's Studio__BackendModuleManagementApiKey.
      Elsa__ModuleManagement__ApiKey: elsa-docker-demo-key
      # CORS: allow the browser origin Studio is served from (its host-published port).
      Cors__AllowedOrigins__0: "http://localhost:14000"
      # HMAC key for durable recovery continuations (at least 32 UTF-8 bytes, identical on every node). The
      # default shell refuses to activate without it, and the image's shells.Production.json blanks the
      # development value baked into shells.json. Demo-only; change it for anything beyond local use.
      CShells__Shells__default__Features__GroundworkWorkflowRuntime__RecoveryContinuationSigningKey: elsa-docker-demo-recovery-continuation-key
      # Identity secrets. The image's shells.Production.json turns off development mode for both identity
      # features and blanks the seed password, so these must be env vars. Without the password the default
      # shell fails activation; without the key every request returns 500. Demo-only values; change both for
      # anything beyond local use.
      # Password for the seeded "admin" account (the overlay supplies the username) you sign in to Studio with.
      CShells__Shells__default__Features__FoundationIdentityAspNetCoreIdentityGroundwork__SeedAdminPassword: "Password123!"
      # Base64 PKCS#8 RSA private key that signs access tokens; line breaks are ignored. Generate your own with:
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkcs8 -topk8 -nocrypt -outform DER | base64
