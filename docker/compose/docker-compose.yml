      - "13000:8080"
    volumes:
      # Curated demo composition (explicit Postgres provider and lanes). Read-only.
      - ./elsa-workbench.shells.json:/app/shells.json:ro
      # Nuplane directory feed: drop .nupkg activity/extension packages here to load them.
      - server-packages:/app/packages

  # ---------------------------------------------------------------------------
  # Elsa Studio (management UI).
  #
  # The image is NOT built from this repository. Build it once from the sibling
  # repo elsa-foundation-studio (main), whose
  # Dockerfile also uses its repo root as build context:
  #
  #   cd ../elsa-foundation-studio          # sibling checkout
  #   git checkout main
  #   docker build -f src/Elsa.Studio.Web/Dockerfile -t elsa-studio-web:local .
  #
  # Then start it with the 'studio' profile:
  #   docker compose --profile studio up
  #
  # If the sibling repo is checked out next to this one you can instead let compose
  # build it by uncommenting the build: block below (adjust the relative path).
  # ---------------------------------------------------------------------------
  elsa-studio:
    image: elsa-studio-web:local
    profiles: ["studio"]
    # build:
    #   context: ../../../elsa-foundation-studio
    #   dockerfile: src/Elsa.Studio.Web/Dockerfile
    depends_on:
      elsa-workbench:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # BackendBaseUrl is consumed by the Blazor WebAssembly client IN THE BROWSER
      # (surfaced via /studio-runtime.js), so it must be reachable from the host,
      # NOT the compose service name. Use the server's published host port.
      Studio__BackendBaseUrl: "http://localhost:13000"
      # Elsa host management key used server-side by the Studio management bridge
      # when calling elsa-workbench. Never sent to the browser.
      # MUST match elsa-workbench's Elsa__ModuleManagement__ApiKey.
      Studio__BackendModuleManagementApiKey: elsa-docker-demo-key
    ports:
      - "14000:8080"

volumes:
  pgdata:
  server-packages:
