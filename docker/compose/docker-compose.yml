# =============================================================================
# Elsa reference stack: PostgreSQL + Elsa.Workbench + Elsa Studio
#
# This is THE reference example for running the full stack with Postgres-backed
# persistence. Bring it up from this directory:
#
#   docker compose up --build            # postgres + elsa-workbench
#   docker compose --profile studio up   # also start Elsa Studio (see notes below)
#
# URLs (host):
#   Elsa.Workbench : http://localhost:13000   (root returns Healthy JSON)
#   Elsa Studio : http://localhost:14000
#
# Persistence: elsa-workbench is composed with an explicit Groundwork PostgreSQL
# provider and lane features via the mounted ./elsa-workbench.shells.json, so
# runtime + workflows-design + activities-design all live in the Postgres target.
#
# Verify Postgres is actually used:
#   docker compose exec postgres psql -U elsa -d elsa -c '\dt'
# =============================================================================

name: elsa-reference-stack

services:
  postgres:
    image: postgres:17
    environment:
      # Demo-only credentials. Change for anything beyond local experimentation.
      POSTGRES_USER: elsa
      POSTGRES_PASSWORD: elsa
      POSTGRES_DB: elsa
    ports:
      # Exposed for local inspection (psql/GUI). Not required by the other services.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elsa -d elsa"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  elsa-workbench:
    build:
      # Build context MUST be the repository root (two levels up from docker/compose).
      context: ../..
      dockerfile: src/Apps/Elsa.Workbench/Dockerfile
    image: elsa-workbench:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Elsa host management key accepted on the server's module-management API.
      # Server-side only. MUST match Studio's Studio__BackendModuleManagementApiKey.
      Elsa__ModuleManagement__ApiKey: elsa-docker-demo-key
      # CORS: allow the browser origin the Studio app is served from (host-published port).
      Cors__AllowedOrigins__0: "http://localhost:14000"
      # HMAC key for durable recovery continuations (at least 32 UTF-8 bytes, identical on every node). The
      # default shell refuses to activate without it. It must be an env var: the image's shells.Production.json
      # blanks any value in the mounted shells.json. Demo-only; change it for anything beyond local use.
      CShells__Shells__default__Features__GroundworkWorkflowRuntime__RecoveryContinuationSigningKey: elsa-docker-demo-recovery-continuation-key
      # Identity secrets. The image's shells.Production.json turns off development mode for both identity
      # features and blanks the seed password, and it sits above the mounted shells.json, so the password must be
      # an env var; the signing key is supplied the same way to keep secrets out of that file. Without either one
      # the default shell fails activation. Demo-only values; change both for anything beyond local use.
      # Password for the seeded "admin" account (the overlay supplies the username) you sign in to Studio with.
      CShells__Shells__default__Features__FoundationIdentityAspNetCoreIdentityGroundwork__SeedAdminPassword: "Password123!"
      # Base64 PKCS#8 RSA private key that signs access tokens; line breaks are ignored. Generate your own with:
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkcs8 -topk8 -nocrypt -outform DER | base64
      CShells__Shells__default__Features__FoundationIdentityOpenIddict__SigningKey: >-
