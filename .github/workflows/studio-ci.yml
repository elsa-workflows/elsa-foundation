name: Studio CI

# Active root-level validation for Studio after its source was imported beneath Studio/
# and its extension UIs beneath Extensions/*/studio/. The preserved nested .github copy
# is source history only; this workflow owns validation in the consolidated repository.
#
# Pull requests run it only when they change Studio, a Studio extension, the Weaver extension the Studio solution
# references, the two shared Modularity libraries it compiles, shared build configuration, or this workflow and its
# tooling (spec 263, FR-026). None of its checks is a
# required status check, so the path filter cannot leave a required check waiting. Every push to main runs it in full.
# That a backend change can still break the Studio API clients is tracked separately (#3177).
on:
  pull_request:
    branches: [main]
    paths:
      - 'Studio/**'
      - 'Extensions/*/studio/**'
      - 'Extensions/Weaver/**'
      - 'Essentials/src/Modularity/Core/**'
      - 'Essentials/src/Modularity/Nuplane/**'
      - 'Essentials/build/Analyzers/**'
      - 'VersionLines.props'
      - 'PackageVersioning.props'
      - 'PackageRanges.targets'
      - 'NuGet.config'
      - '.dockerignore'
      - 'global.json'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.editorconfig'
      - '.github/workflows/studio-ci.yml'
      - 'tools/ci/verify-studio-assets.py'
      - 'tools/ci/verify_studio_nuget_packages.py'
      - 'tools/studio/**'
      - 'tools/ci/qualify_studio_consumers.py'
      - 'tools/ci/studio*'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Studio frontend lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Studio/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Studio

      - name: Lint
        run: pnpm lint
        working-directory: Studio

      - name: Typecheck
        run: pnpm typecheck
        working-directory: Studio

      - name: Unit tests
        # Run one workspace at a time so these tests stay deterministic under the hosted runner.
        run: pnpm --recursive --workspace-concurrency=1 test
        working-directory: Studio

      - name: Check Workflows bundle budget
        run: pnpm check:bundle:workflows
        working-directory: Studio

  browser-tests:
    name: Studio browser tests (Chromium ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Keep the complete inventory within the budget as it grows; no cases are omitted.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Studio/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Studio

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: Studio

      - name: Run browser tests
        run: pnpm test:browser --shard=${{ matrix.shard }}/2
        working-directory: Studio

  dotnet-build-and-test:
    name: Studio .NET build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Local CI artifacts share one prerelease version, including their Modularity project dependencies.
      STUDIO_PACKAGE_VERSION: 4.0.0-studio-ci.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Studio/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Studio/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Studio

      - name: Build Studio host and RCL frontend assets
        run: pnpm build
        working-directory: Studio

      - name: Verify generated Studio host and RCL assets
        run: python3 ../tools/ci/verify-studio-assets.py --root ..
        working-directory: Studio

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-studio-nuget-${{ hashFiles('Studio/Directory.Packages.props', 'Extensions/**/studio/**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-studio-nuget-

      - name: Restore
        run: dotnet restore Elsa.Studio.slnx --locked-mode -p:WarningsNotAsErrors=NU1603
        working-directory: Studio

      - name: Build
        run: dotnet build Elsa.Studio.slnx -c Release --no-restore -p:WarningsNotAsErrors=NU1603 "-p:Version=$STUDIO_PACKAGE_VERSION" "-p:SourceRevisionId=$GITHUB_SHA"
        working-directory: Studio

      - name: Test
        run: dotnet test Elsa.Studio.slnx -c Release --no-build -p:WarningsNotAsErrors=NU1603 "-p:Version=$STUDIO_PACKAGE_VERSION"
        working-directory: Studio

      - name: Pack Studio NuGet projects without publishing
        run: >-
          dotnet pack Elsa.Studio.slnx -c Release --no-build
          -p:WarningsNotAsErrors=NU1603
          "-p:Version=$STUDIO_PACKAGE_VERSION"
          "-p:SourceRevisionId=$GITHUB_SHA"
          "-p:PackageOutputPath=$RUNNER_TEMP/studio-nuget"
        working-directory: Studio

      - name: Verify complete Studio NuGet artifact
        run: |
          python3 tools/ci/verify_studio_nuget_packages.py --self-test
          python3 tools/ci/verify_studio_nuget_packages.py --packages "$RUNNER_TEMP/studio-nuget" --version "$STUDIO_PACKAGE_VERSION" --report "$RUNNER_TEMP/studio-archive-verification.json"

      - name: Pack matching governed Preferences dependency without publishing
        run: >-
          dotnet pack Essentials/src/Studio/Preferences/Core/Elsa.Studio.Preferences.Core.csproj -c Release
          -p:RestoreLockedMode=true "-p:Version=$STUDIO_PACKAGE_VERSION" "-p:SourceRevisionId=$GITHUB_SHA"
          -o "$RUNNER_TEMP/studio-modularity-nuget"

      - name: Pack matching lightweight Modularity candidates without publishing
        run: |
          for module in Core Nuplane; do
            dotnet pack "Essentials/src/Modularity/$module/Elsa.Modularity.$module.csproj" -c Release -p:RestoreLockedMode=true \
              "-p:Version=$STUDIO_PACKAGE_VERSION" "-p:SourceRevisionId=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/studio-modularity-nuget"
          done

      - name: Publish the matching actual reference Studio
        run: >-
          dotnet publish Studio/src/apps/Elsa.Studio.Web/Elsa.Studio.Web.csproj -c Release --no-build --no-restore
          "-p:Version=$STUDIO_PACKAGE_VERSION" "-p:SourceRevisionId=$GITHUB_SHA"
          -o "$RUNNER_TEMP/studio-reference-web"

      - name: Install Chromium for package consumer qualification
        run: pnpm exec playwright install --with-deps chromium
        working-directory: Studio

      - name: Qualify actual Studio packages and causal controls
        run: |
          python3 tools/ci/qualify_studio_consumers.py --self-test
          python3 tools/ci/qualify_studio_consumers.py \
            --packages "$RUNNER_TEMP/studio-nuget" \
            --modularity-packages "$RUNNER_TEMP/studio-modularity-nuget" \
            --reference-web "$RUNNER_TEMP/studio-reference-web" \
            --expected-producer-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/studio-consumer-qualification"

      - name: Retain package candidates and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-package-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/studio-nuget/*.nupkg
            ${{ runner.temp }}/studio-modularity-nuget/*.nupkg
            ${{ runner.temp }}/studio-archive-verification.json
            ${{ runner.temp }}/studio-consumer-qualification/report.json
            ${{ runner.temp }}/studio-consumer-qualification/**/*.log
            ${{ runner.temp }}/studio-consumer-qualification/archive-controls/*.json
            ${{ runner.temp }}/studio-consumer-qualification/evidence/**

      - name: Build standalone Studio image without publishing
        run: docker build --file Studio/src/apps/Elsa.Studio.Web/Dockerfile --build-arg "STUDIO_VERSION=$STUDIO_PACKAGE_VERSION" --tag "elsa-studio:ci-${{ github.sha }}" .
