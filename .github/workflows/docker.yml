name: Docker Images

# Builds and pushes three Elsa 4 host images to Docker Hub:
#   - elsaworkflows/elsa-workbench       — development and demo host
#   - elsaworkflows/elsa-foundation-host — minimal Nuplane + CShells server host
#   - elsaworkflows/elsa-essentials-host — Nuplane + CShells host with the curated workflow essentials compiled in
# A manual profile build produces the matching Foundation host, SDK builder and three package-based
# server profiles. See docker/profiles/README.md for artifact and publication options.
# The workbench is a development and demo host, not the shipped product; the
# elsaworkflows/elsa-server name is reserved for the clean host once it exists.
# The Elsa major version (4) is encoded in the image tags:
#   - pushes to main produce latest + 4.0.0-preview.<run_number>
# That tag is a build number and names no package version. The Elsa assemblies in every image
# carry the versions the Packages workflow computes for the same commit (the versions job below).
# Images are built only after a merge into main (once the Packages workflow completes for it) and on
# manual dispatch for a commit on main (#2751). Pull requests build no image; until #2751 a PR that
# changed a Dockerfile or another image input built both images without pushing. The cost is known:
# a change that breaks an image build (a Dockerfile, Directory.Build.props, Directory.Packages.props,
# the analyzers under essentials/build/Analyzers) is caught only by the post-merge build. #2087 is the
# precedent: it added a root props file the Dockerfiles did not copy, and main stayed red for three
# merges before anyone saw it.
# Docker's maintained builder fans the platforms out to native x64 and ARM64
# GitHub-hosted runners, then assembles the multi-platform manifest.
#
# MAIN BUILDS TAKE THE PACKAGES WORKFLOW'S OWN COMPUTATION (#2084, spec 150 FR-020). A push to
# main used to make this workflow compute its own plan against publish-state's tip, racing the
# Packages workflow's plan and write-back for the same commit: two independent reads of a record
# one of them was about to change. Joining Packages' `publish-state` concurrency group does not fix
# this - GitHub keeps only one PENDING run per group and cancels the older pending one, so a queued
# image build could silently drop a queued publish run. Instead, a main build is triggered by
# `workflow_run` once Packages completes. An admission job accepts only successful runs sourced
# from push or workflow_dispatch; release completions stop before version resolution, and their
# isolated concurrency group cannot cancel an admitted image build. The versions job then downloads
# the exact run's `elsa-foundation-nuget-packages` artifact (uploaded by the pack job in packages.yml)
# for `package-versions.props`, rather than planning again. Its Elsa package
# versions are then exactly what Packages just computed (and, on a publish, exactly what it wrote to
# the feed) for that commit - never a plan raced against the write-back.
#
# docker/github-builder always builds the git context at the calling run's own commit (GITHUB_SHA),
# which for `workflow_run` and `workflow_dispatch` is the ref's current tip, not an input the
# reusable workflow lets a caller override to an arbitrary historical commit. So the versions job
# also refuses outright, rather than building silently against the wrong tree, if main has moved
# past the commit the Packages run (or the dispatch input) named - see the "Refuse to build a commit
# main has moved past" step.
#
# POLICY DEPENDENCY: the job below calls a reusable workflow from another
# organization, so elsa-workflows must allow-list it under
# Settings -> Actions -> General -> "Allow specified actions and reusable
# workflows" (the list is set at the org level, so a repository admin cannot
# change it here):
#
#   docker/github-builder/.github/workflows/*@*
#
# The directory glob is deliberate: build.yml calls a second workflow,
# setup-registry-identities.yml, at a ref that moves with upstream releases,
# and both must match. Without the entry every run ends in startup_failure
# with no jobs and no logs -- `gh run view` only reports the generic
# "workflow file issue", and the real message is on the run's web page.
# Allowing Marketplace verified creators does NOT cover this: that setting
# applies to actions, not to reusable workflows.

on:
  workflow_run:
    workflows: [Packages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Commit SHA on main to build. Uses the latest successful push or manual Packages run for that
          commit and refuses if there is none. Also refuses if main has since moved past that
          commit, because the builder can only build the branch's current tip (see the header
          comment above).
        required: true
        type: string
      build_profiles:
        description: Export the profile builder and three verified Dockerfile-based server profiles.
        required: false
        type: boolean
        default: false
      publish_profiles:
        description: Publish a matching Foundation host, profile builder and three verified multi-platform profiles.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Isolate manual profile releases so a newer main build cannot cancel a partially published release.
  # These runs only publish release-specific tags. Ineligible events also have their own group.
  group: docker-image-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || (github.event.workflow_run.event != 'push' && github.event.workflow_run.event != 'workflow_dispatch')) && format('ineligible-{0}', github.run_id) || (inputs.build_profiles || inputs.publish_profiles) && format('profiles-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: Admit source event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.admit.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: admit
        env:
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python3 tools/contributor-checkpoints/workflow_guards.py docker-admission

  versions:
    name: Compute package versions
    needs: admission
    # Every image is built with computed package versions (ADR 0067, spec 150, #2084, #2126), so each deps.json
    # records every Elsa package at the version the feed carries, and each production configuration declares its
    # Elsa shares host-provided: Nuplane then refuses a feed package that needs a newer one than the image carries.
    # The versions come from the Packages workflow run for the commit being built - never a plan this job computes
    # itself - because that is the run whose plan may have just been written back to publish-state (see the header
    # comment: spec 150 FR-020, #2084). They reach each image build as one build arg, the pack-properties file
    # gzipped and base64-encoded, because the builder takes build args one per line and checks out the commit itself.
    if: needs.admission.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package-versions: ${{ steps.encode.outputs.package-versions }}
      # Retain this release identity when only failed downstream jobs are re-run.
      profile-version: 4.0.0-preview.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Checkout workflow guards for manual run selection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Find the Packages run to take the computation from, rather than planning again - the run that triggered this
      # one, or for a manual dispatch, the newest successful push/manual Packages run for the requested commit.
      # Metadata-only release runs do not carry a computation artifact.
      - name: Resolve the Packages run to build from
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGES_RUN_ID: ${{ github.event.workflow_run.id }}
          PACKAGES_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            run_id="$PACKAGES_RUN_ID"
            commit="$PACKAGES_HEAD_SHA"
          else
            commit="$REQUESTED_COMMIT"
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Invalid commit SHA::Dispatch requires a full lowercase commit SHA on main."
              exit 1
            fi
            push_runs=$(gh api "repos/$REPOSITORY/actions/workflows/packages.yml/runs?branch=main&status=success&event=push&head_sha=$commit&per_page=100" \
              --jq '.workflow_runs')
            manual_runs=$(gh api "repos/$REPOSITORY/actions/workflows/packages.yml/runs?branch=main&status=success&event=workflow_dispatch&head_sha=$commit&per_page=100" \
              --jq '.workflow_runs')
            runs=$(jq -cn --argjson push "$push_runs" --argjson manual "$manual_runs" '$push + $manual')
            if ! run_id=$(REQUESTED_COMMIT="$commit" python3 tools/contributor-checkpoints/workflow_guards.py resolve-packages-run <<< "$runs"); then
              echo "::error title=No successful Packages run::No successful Packages workflow run found on main for commit $commit. Push it and wait for Packages to succeed before dispatching an image build for it."
              exit 1
            fi
          fi
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ || ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid Packages run::The selected Packages run did not identify a full commit SHA and run id."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # docker/github-builder builds the git context at this run's own commit, not an arbitrary one this job
      # names, so a resolved commit main has since moved past would be built silently wrong. Refuse instead.
      - name: Refuse to build a commit main has moved past
        run: |
          if [ "$GITHUB_SHA" != "${{ steps.resolve.outputs.commit }}" ]; then
            echo "::error title=Commit drift::main is at $GITHUB_SHA, past the requested commit ${{ steps.resolve.outputs.commit }}. Refusing rather than building the wrong commit."
            exit 1
          fi

      - name: Download the Packages run's computation
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-nuget-packages
          path: ${{ runner.temp }}/versions
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.run-id }}

      - name: Encode
        id: encode
        run: echo "package-versions=$(gzip -9n < "$RUNNER_TEMP/versions/package-versions.props" | base64 -w0)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push elsa-workbench
    if: github.event_name != 'workflow_dispatch' || !(inputs.build_profiles || inputs.publish_profiles)
    needs: versions
    # Pinned to an exact release, not the floating @v1. This workflow pins the
    # BuildKit and Buildx versions the build runs on, and a frontend older than
    # that BuildKit fails the build outright -- see the `# syntax=` pin in
    # apps/Elsa.Workbench.Host/Dockerfile. On the floating tag an upstream
    # release moves BuildKit under us and breaks main with no change of ours;
    # pinned, that becomes a deliberate bump where both pins move together.
    uses: docker/github-builder/.github/workflows/build.yml@v1.16.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: apps/Elsa.Workbench.Host/Dockerfile
      # An empty value fails the build rather than falling back to a source build (see the Dockerfile).
      build-args: |
        ELSA_PACKAGE_VERSIONS=${{ needs.versions.outputs.package-versions }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-workbench
      meta-images: elsaworkflows/elsa-workbench
      meta-tags: |
        type=sha
        type=raw,value=latest
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Workbench
        org.opencontainers.image.description=Elsa 4 development and demo workbench host
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-and-push-foundation-host:
    name: Build & push elsa-foundation-host
    needs: versions
    # Same pinned reusable builder as the workbench job above (see the pinning note there):
    # the BuildKit/Buildx versions must match the `# syntax=` pin in
    # apps/Elsa.Foundation.Host/Dockerfile.
    uses: docker/github-builder/.github/workflows/build.yml@v1.16.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: apps/Elsa.Foundation.Host/Dockerfile
      # An empty value fails the build rather than falling back to a source build (see the Dockerfile).
      build-args: |
        ELSA_PACKAGE_VERSIONS=${{ needs.versions.outputs.package-versions }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-foundation-host
      meta-images: elsaworkflows/elsa-foundation-host
      meta-tags: |
        type=sha,enable=${{ !(inputs.build_profiles || inputs.publish_profiles) }}
        type=raw,value=latest,enable=${{ !(inputs.build_profiles || inputs.publish_profiles) }}
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Foundation Host
        org.opencontainers.image.description=Minimal Nuplane + CShells Elsa 4 server host
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-and-push-essentials-host:
    name: Build & push elsa-essentials-host
    if: github.event_name != 'workflow_dispatch' || !(inputs.build_profiles || inputs.publish_profiles)
    needs: versions
    # Same pinned reusable builder as the workbench job above (see the pinning note there):
    # the BuildKit/Buildx versions must match the `# syntax=` pin in
    # apps/Elsa.Essentials.Host/Dockerfile.
    uses: docker/github-builder/.github/workflows/build.yml@v1.16.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: apps/Elsa.Essentials.Host/Dockerfile
      # An empty value fails the build rather than falling back to a source build (see the Dockerfile).
      build-args: |
        ELSA_PACKAGE_VERSIONS=${{ needs.versions.outputs.package-versions }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-essentials-host
      meta-images: elsaworkflows/elsa-essentials-host
      meta-tags: |
        type=sha
        type=raw,value=latest
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Essentials Host
        org.opencontainers.image.description=Elsa 4 server host with the curated workflow essentials compiled in
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  profile-builder:
    name: Build profile tooling (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && (inputs.build_profiles || inputs.publish_profiles)
    needs: [versions, build-and-push-foundation-host]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PLATFORM: linux/${{ matrix.arch }}
      FOUNDATION_IMAGE: elsaworkflows/elsa-foundation-host@${{ needs.build-and-push-foundation-host.outputs.digest }}
      PROFILE_BUILDER_IMAGE: elsa-profile-builder:4.0.0-preview.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the release-matched profile builder
        shell: bash
        env:
          PACKAGE_VERSIONS: ${{ needs.versions.outputs.package-versions }}
        run: |
          mkdir -p "$RUNNER_TEMP/versions"
          printf '%s' "$PACKAGE_VERSIONS" | base64 -d | gunzip > "$RUNNER_TEMP/versions/package-versions.props"
          docker build --platform "$PLATFORM" --build-arg FOUNDATION_IMAGE \
            --build-context versions="$RUNNER_TEMP/versions" -f docker/profiles/builder.Dockerfile \
            -t "$PROFILE_BUILDER_IMAGE" .
      - name: Resolve one pair of release locks per profile
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          for profile in essentials elsa3-import full; do
            docker build --platform "$PLATFORM" --build-arg FOUNDATION_IMAGE --build-arg PROFILE_BUILDER_IMAGE \
              --target locks --output "type=local,dest=$RUNNER_TEMP/locks/$profile" "docker/profiles/$profile"
          done
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: elsa-profile-locks-${{ github.run_number }}
          path: ${{ runner.temp }}/locks/
          overwrite: true
          retention-days: 7
      - name: Export the native builder
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/builder"
          docker save "$PROFILE_BUILDER_IMAGE" | gzip -1 > "$RUNNER_TEMP/builder/image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: elsa-profile-builder-${{ matrix.arch }}-${{ github.run_number }}
          path: ${{ runner.temp }}/builder/
          compression-level: 0
          overwrite: true
          retention-days: 7

  package-profiles:
    name: Verify and export ${{ matrix.profile }} (${{ matrix.arch }})
    needs: [versions, build-and-push-foundation-host, profile-builder]
    strategy:
      fail-fast: false
      matrix:
        profile: [essentials, elsa3-import, full]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PROFILE: ${{ matrix.profile }}
      PLATFORM: linux/${{ matrix.arch }}
      FOUNDATION_IMAGE: elsaworkflows/elsa-foundation-host@${{ needs.build-and-push-foundation-host.outputs.digest }}
      PROFILE_BUILDER_IMAGE: elsa-profile-builder:4.0.0-preview.${{ github.run_number }}
      IMAGE: elsa-server-${{ matrix.profile }}:4.0.0-preview.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: elsa-profile-builder-${{ matrix.arch }}-${{ github.run_number }}
          path: ${{ runner.temp }}/builder
      - uses: actions/download-artifact@v4
        with:
          name: elsa-profile-locks-${{ github.run_number }}
          path: ${{ runner.temp }}/locks
      - name: Build the locked profile and verify offline startup
        run: |
          docker load -i "$RUNNER_TEMP/builder/image.tar.gz"
          cp "$RUNNER_TEMP/locks/$PROFILE/"*.lock.json "docker/profiles/$PROFILE/"
          docker build --platform "$PLATFORM" --build-arg FOUNDATION_IMAGE --build-arg PROFILE_BUILDER_IMAGE \
            -t "$IMAGE" "docker/profiles/$PROFILE"
          python3 tools/docker-profiles/smoke.py "$IMAGE" --variant "$PROFILE" --timeout 300
      - name: Export the tested image and its build inputs
        shell: bash
        env:
          PACKAGE_VERSIONS: ${{ needs.versions.outputs.package-versions }}
        run: |
          bundle="$RUNNER_TEMP/profile-image"
          mkdir "$bundle"
          docker save "$IMAGE" | gzip -1 > "$bundle/image.tar.gz"
          cp "docker/profiles/$PROFILE/"{Dockerfile,packages.txt,packages.lock.json,nuplane.lock.json,shells.json} "$bundle/"
          printf '%s' "$PACKAGE_VERSIONS" | base64 -d | gunzip > "$bundle/package-versions.props"
          builder_id=$(docker image inspect --format '{{.Id}}' "$PROFILE_BUILDER_IMAGE")
          jq -n --arg profile "$PROFILE" --arg image "$IMAGE" --arg base "$FOUNDATION_IMAGE" \
            --arg builder "$PROFILE_BUILDER_IMAGE" --arg builderId "$builder_id" \
            --arg platform "$PLATFORM" --arg commit "$GITHUB_SHA" \
            '{profile: $profile, image: $image, foundationImage: $base, builderImage: $builder, builderId: $builderId, platform: $platform, commit: $commit}' \
            > "$bundle/build.json"
      - uses: actions/upload-artifact@v4
        with:
          name: elsa-server-${{ matrix.profile }}-${{ matrix.arch }}-${{ github.run_number }}
          path: ${{ runner.temp }}/profile-image/
          compression-level: 0
          overwrite: true
          retention-days: 7

  stage-profile-images:
    name: Stage tested ${{ matrix.image }} images
    needs: [versions, package-profiles, build-and-push-foundation-host]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: elsa-profile-builder
            destination: elsaworkflows/elsa-foundation-host:builder-
          - image: elsa-server-essentials
            destination: elsaworkflows/elsa-foundation-host:essentials-
          - image: elsa-server-elsa3-import
            destination: elsaworkflows/elsa-foundation-host:elsa3-import-
          - image: elsa-server-full
            destination: elsaworkflows/elsa-foundation-host:full-
    env:
      ARTIFACT: ${{ matrix.image }}
      IMAGE: ${{ matrix.image }}:4.0.0-preview.${{ github.run_number }}
      TARGET: ${{ matrix.destination }}${{ needs.versions.outputs.profile-version }}
      FOUNDATION_IMAGE: elsaworkflows/elsa-foundation-host@${{ needs.build-and-push-foundation-host.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.image }}-*-${{ github.run_number }}
          path: ${{ runner.temp }}/artifacts
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push the tested native images under architecture-specific tags
        run: |
          foundation_label='org.opencontainers.image.base.name'
          if [ "$ARTIFACT" = elsa-profile-builder ]; then foundation_label='io.elsaworkflows.profile.foundation-image'; fi
          for arch in amd64 arm64; do
            archive="$RUNNER_TEMP/artifacts/$ARTIFACT-$arch-$GITHUB_RUN_NUMBER/image.tar.gz"
            docker load -i "$archive"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/$arch"
            test "$(docker image inspect "$IMAGE" | jq -r --arg label "$foundation_label" '.[0].Config.Labels[$label]')" = "$FOUNDATION_IMAGE"
            docker tag "$IMAGE" "$TARGET-$arch"
            docker push "$TARGET-$arch"
            docker image rm "$IMAGE"
          done

  publish-profile-release:
    name: Publish the matched profile release
    needs: [versions, stage-profile-images, build-and-push-foundation-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FOUNDATION: elsaworkflows/elsa-foundation-host
      DIGEST: ${{ needs.build-and-push-foundation-host.outputs.digest }}
      VERSION: ${{ needs.versions.outputs.profile-version }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish Foundation and its builder before exposing profile tags
        shell: bash
        run: |
          docker buildx imagetools create -t "$FOUNDATION:$VERSION" "$FOUNDATION@$DIGEST"
          actual=$(docker buildx imagetools inspect "$FOUNDATION:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          test "$actual" = "$DIGEST"
          for target in "$FOUNDATION:builder-$VERSION" \
            "$FOUNDATION:essentials-$VERSION" "$FOUNDATION:elsa3-import-$VERSION" "$FOUNDATION:full-$VERSION"; do
            docker buildx imagetools create -t "$target" "$target-amd64" "$target-arm64"
            manifest=$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}')
            jq -e '([.manifests[].platform | select(.os=="linux") | .architecture] | sort) == ["amd64","arm64"]' <<< "$manifest"
            printf '%s@%s\n' "$target" "$(jq -r .digest <<< "$manifest")" >> "$GITHUB_STEP_SUMMARY"
          done
