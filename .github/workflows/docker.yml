name: Docker Image

# Builds and pushes the Elsa 4 server image to Docker Hub as elsaworkflows/elsa-server.
# The Elsa major version (4) is encoded in the image tags:
#   - pushes to main produce latest + 4.0.0-preview.<run_number>
# Docker's maintained builder fans the platforms out to native x64 and ARM64
# GitHub-hosted runners, then assembles the multi-platform manifest.

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/docker.yml
      - Directory.Build.props
      - Directory.Packages.props
      - Elsa.Server.slnx
      - NuGet.config
      - src/**

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push elsa-server
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: src/Apps/Elsa.Server/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-server
      meta-images: elsaworkflows/elsa-server
      meta-tags: |
        type=sha
        type=raw,value=latest
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Server
        org.opencontainers.image.description=Elsa 4 workflow server
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
