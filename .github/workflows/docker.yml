name: Docker Images

# Builds and pushes two Elsa 4 host images to Docker Hub:
#   - elsaworkflows/elsa-workbench       — development and demo host
#   - elsaworkflows/elsa-foundation-host — minimal Nuplane + CShells server host
# The workbench is a development and demo host, not the shipped product; the
# elsaworkflows/elsa-server name is reserved for the clean host once it exists.
# The Elsa major version (4) is encoded in the image tags:
#   - pushes to main produce latest + 4.0.0-preview.<run_number>
# That tag is a build number and names no package version. The Elsa assemblies in both images
# carry the versions the Packages workflow computes for the same commit (the versions job below).
# Pull requests touching the same paths build both images for both platforms
# but push nothing, so a Dockerfile that no longer builds fails on the PR, not
# on main. Without this, #2087 added a root props file the Dockerfiles did not
# copy and main stayed red for three merges before anyone saw it. A PR's run
# checks its merge with main as of when it ran, not as of when it merges, so a
# root file that lands on main in between still reaches main untested (#2114's PackageRanges.targets). With push off
# the builder skips registry login and signing, so fork PRs need no secrets.
# Docker's maintained builder fans the platforms out to native x64 and ARM64
# GitHub-hosted runners, then assembles the multi-platform manifest.
#
# MAIN BUILDS TAKE THE PACKAGES WORKFLOW'S OWN COMPUTATION (#2084, spec 150 FR-020). A push to
# main used to make this workflow compute its own plan against publish-state's tip, racing the
# Packages workflow's plan and write-back for the same commit: two independent reads of a record
# one of them was about to change. Joining Packages' `publish-state` concurrency group does not fix
# this - GitHub keeps only one PENDING run per group and cancels the older pending one, so a queued
# image build could silently drop a queued publish run. Instead, a main build is triggered by
# `workflow_run` once Packages completes, and only when it concluded `success`; the versions job
# then downloads that exact run's `elsa-foundation-nuget-packages` artifact (uploaded by the pack
# job in packages.yml) for `package-versions.props`, rather than planning again. Its Elsa package
# versions are then exactly what Packages just computed (and, on a publish, exactly what it wrote to
# the feed) for that commit - never a plan raced against the write-back.
#
# docker/github-builder always builds the git context at the calling run's own commit (GITHUB_SHA),
# which for `workflow_run` and `workflow_dispatch` is the ref's current tip, not an input the
# reusable workflow lets a caller override to an arbitrary historical commit. So the versions job
# also refuses outright, rather than building silently against the wrong tree, if main has moved
# past the commit the Packages run (or the dispatch input) named - see the "Refuse to build a commit
# main has moved past" step. PR and non-main branch builds are unaffected: they still compute their
# own plan on `pull_request`, exactly as before, and never write to publish-state, so there is no
# race to avoid.
#
# POLICY DEPENDENCY: the job below calls a reusable workflow from another
# organization, so elsa-workflows must allow-list it under
# Settings -> Actions -> General -> "Allow specified actions and reusable
# workflows" (the list is set at the org level, so a repository admin cannot
# change it here):
#
#   docker/github-builder/.github/workflows/*@*
#
# The directory glob is deliberate: build.yml calls a second workflow,
# setup-registry-identities.yml, at a ref that moves with upstream releases,
# and both must match. Without the entry every run ends in startup_failure
# with no jobs and no logs -- `gh run view` only reports the generic
# "workflow file issue", and the real message is on the run's web page.
# Allowing Marketplace verified creators does NOT cover this: that setting
# applies to actions, not to reusable workflows.

on:
  workflow_run:
    workflows: [Packages]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/docker.yml
      - '*.props'
      - '*.targets'
      - Elsa.Server.slnx
      - NuGet.config
      - src/**
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Commit SHA on main to build. Uses the latest successful Packages workflow run for that
          commit and refuses if there is none. Also refuses if main has since moved past that
          commit, because the builder can only build the branch's current tip (see the header
          comment above).
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Compute package versions
    # Both images are built with computed package versions (ADR 0067, spec 150, #2084, #2126), so each deps.json
    # records every Elsa package at the version the feed carries, and each production configuration declares its
    # Elsa shares host-provided: Nuplane then refuses a feed package that needs a newer one than the image carries.
    # For a pull request the versions come from this job's own plan, exactly as the Packages workflow computes them
    # for the same ref and commit, at branch-scoped versions (PRs never touch publish-state, so there is nothing to
    # race). For a push to main the versions come from the Packages workflow run that triggered this one instead -
    # never a plan this job computes itself - because that is the run whose plan may have just been written back to
    # publish-state (see the header comment: spec 150 FR-020, #2084). Either way the versions reach each image build
    # as one build arg, the pack-properties file gzipped and base64-encoded, because the builder takes build args
    # one per line and checks out the commit itself.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package-versions: ${{ steps.encode.outputs.package-versions }}
    steps:
      # main (workflow_run, workflow_dispatch): find the Packages run to take the computation from, rather than
      # planning again - the run that triggered this one, or for a manual dispatch, the latest successful Packages
      # run for the requested commit.
      - name: Resolve the Packages run to build from
        id: resolve
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            commit="${{ github.event.workflow_run.head_sha }}"
          else
            commit="${{ inputs.commit }}"
            run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/packages.yml/runs?branch=main&status=success&head_sha=$commit" \
              --jq '.workflow_runs | sort_by(.run_started_at) | last | .id // empty')
            if [ -z "$run_id" ]; then
              echo "::error title=No successful Packages run::No successful Packages workflow run found on main for commit $commit. Push it and wait for Packages to succeed before dispatching an image build for it."
              exit 1
            fi
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # docker/github-builder builds the git context at this run's own commit, not an arbitrary one this job
      # names, so a resolved commit main has since moved past would be built silently wrong. Refuse instead.
      - name: Refuse to build a commit main has moved past
        if: github.event_name != 'pull_request'
        run: |
          if [ "$GITHUB_SHA" != "${{ steps.resolve.outputs.commit }}" ]; then
            echo "::error title=Commit drift::main is at $GITHUB_SHA, past the requested commit ${{ steps.resolve.outputs.commit }}. Refusing rather than building the wrong commit."
            exit 1
          fi

      - name: Download the Packages run's computation
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-nuget-packages
          path: ${{ runner.temp }}/versions
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.run-id }}

      # pull_request: no Packages run to take a computation from - branch-scoped versions, planned here.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          # The calculator compares trees at the commits the record names and proves ancestry (FR-021).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        if: github.event_name == 'pull_request'
        with:
          dotnet-version: 10.x

      - name: Build the publisher
        if: github.event_name == 'pull_request'
        run: dotnet build tools/versioning/Elsa.Versioning.Publisher -c Release

      - name: Plan
        if: github.event_name == 'pull_request'
        env:
          REF: refs/heads/${{ github.head_ref }}
        run: >-
          dotnet run --project tools/versioning/Elsa.Versioning.Publisher -c Release --no-build --
          plan --ref "$REF" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/versions"

      - name: Encode
        id: encode
        run: echo "package-versions=$(gzip -9n < "$RUNNER_TEMP/versions/package-versions.props" | base64 -w0)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push elsa-workbench
    needs: versions
    # Pinned to an exact release, not the floating @v1. This workflow pins the
    # BuildKit and Buildx versions the build runs on, and a frontend older than
    # that BuildKit fails the build outright -- see the `# syntax=` pin in
    # src/apps/Elsa.Workbench/Dockerfile. On the floating tag an upstream
    # release moves BuildKit under us and breaks main with no change of ours;
    # pinned, that becomes a deliberate bump where both pins move together.
    uses: docker/github-builder/.github/workflows/build.yml@v1.16.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: .
      file: src/apps/Elsa.Workbench/Dockerfile
      # An empty value fails the build rather than falling back to a source build (see the Dockerfile).
      build-args: |
        ELSA_PACKAGE_VERSIONS=${{ needs.versions.outputs.package-versions }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-workbench
      meta-images: elsaworkflows/elsa-workbench
      meta-tags: |
        type=sha
        type=raw,value=latest
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Workbench
        org.opencontainers.image.description=Elsa 4 development and demo workbench host
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-and-push-foundation-host:
    name: Build & push elsa-foundation-host
    needs: versions
    # Same pinned reusable builder as the workbench job above (see the pinning note there):
    # the BuildKit/Buildx versions must match the `# syntax=` pin in
    # src/apps/Elsa.Foundation.Host/Dockerfile.
    uses: docker/github-builder/.github/workflows/build.yml@v1.16.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: .
      file: src/apps/Elsa.Foundation.Host/Dockerfile
      # An empty value fails the build rather than falling back to a source build (see the Dockerfile).
      build-args: |
        ELSA_PACKAGE_VERSIONS=${{ needs.versions.outputs.package-versions }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-foundation-host
      meta-images: elsaworkflows/elsa-foundation-host
      meta-tags: |
        type=sha
        type=raw,value=latest
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Foundation Host
        org.opencontainers.image.description=Minimal Nuplane + CShells Elsa 4 server host
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
