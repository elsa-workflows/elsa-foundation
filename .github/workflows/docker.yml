name: Docker Images

# Builds and pushes two Elsa 4 host images to Docker Hub:
#   - elsaworkflows/elsa-workbench       — development and demo host
#   - elsaworkflows/elsa-foundation-host — minimal Nuplane + CShells server host
# The workbench is a development and demo host, not the shipped product; the
# elsaworkflows/elsa-server name is reserved for the clean host once it exists.
# The Elsa major version (4) is encoded in the image tags:
#   - pushes to main produce latest + 4.0.0-preview.<run_number>
# That tag is a build number and names no package version. The Elsa assemblies in the
# workbench image carry the versions the Packages workflow computes for the same commit
# (the versions job below); the foundation host is built from source.
# Pull requests touching the same paths build both images for both platforms
# but push nothing, so a Dockerfile that no longer builds fails on the PR, not
# on main. Without this, #2087 added a root props file the Dockerfiles did not
# copy and main stayed red for three merges before anyone saw it. A PR's run
# checks its merge with main as of when it ran, not as of when it merges, so a
# root file that lands on main in between still reaches main untested (#2114's PackageRanges.targets). With push off
# the builder skips registry login and signing, so fork PRs need no secrets.
# Docker's maintained builder fans the platforms out to native x64 and ARM64
# GitHub-hosted runners, then assembles the multi-platform manifest.
#
# POLICY DEPENDENCY: the job below calls a reusable workflow from another
# organization, so elsa-workflows must allow-list it under
# Settings -> Actions -> General -> "Allow specified actions and reusable
# workflows" (the list is set at the org level, so a repository admin cannot
# change it here):
#
#   docker/github-builder/.github/workflows/*@*
#
# The directory glob is deliberate: build.yml calls a second workflow,
# setup-registry-identities.yml, at a ref that moves with upstream releases,
# and both must match. Without the entry every run ends in startup_failure
# with no jobs and no logs -- `gh run view` only reports the generic
# "workflow file issue", and the real message is on the run's web page.
# Allowing Marketplace verified creators does NOT cover this: that setting
# applies to actions, not to reusable workflows.

on:
  push:
    branches: [main]
    paths: &image-inputs
      - .dockerignore
      - .github/workflows/docker.yml
      - '*.props'
      - '*.targets'
      - Elsa.Server.slnx
      - NuGet.config
      - src/**
  pull_request:
    branches: [main]
    paths: *image-inputs

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Compute package versions
    # The Workbench image is built with computed package versions (ADR 0067, spec 150, #2084), so its deps.json
    # records every Elsa package at the version the feed carries, and its production configuration declares the
    # Elsa shares host-provided: Nuplane then refuses a feed package that needs a newer one than the image carries.
    # The versions come from the publisher's plan, exactly as the Packages workflow computes them for the same ref
    # and commit - against publish-state's tip on main, against an empty record while publish-state does not exist,
    # and at branch-scoped versions for anything else - and reach the image build as one build arg, the
    # pack-properties file gzipped and base64-encoded, because the builder takes build args one per line and checks
    # out the commit itself. A pull request is computed as its head branch, since the plan only knows branch refs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package-versions: ${{ steps.encode.outputs.package-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The calculator compares trees at the commits the record names and proves ancestry (FR-021).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build the publisher
        run: dotnet build tools/versioning/Elsa.Versioning.Publisher -c Release

      - name: Plan
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
        run: >-
          dotnet run --project tools/versioning/Elsa.Versioning.Publisher -c Release --no-build --
          plan --ref "$REF" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/versions"

      - name: Encode
        id: encode
        run: echo "package-versions=$(gzip -9n < "$RUNNER_TEMP/versions/package-versions.props" | base64 -w0)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push elsa-workbench
    needs: versions
    # Pinned to an exact release, not the floating @v1. This workflow pins the
    # BuildKit and Buildx versions the build runs on, and a frontend older than
    # that BuildKit fails the build outright -- see the `# syntax=` pin in
    # src/apps/Elsa.Workbench/Dockerfile. On the floating tag an upstream
    # release moves BuildKit under us and breaks main with no change of ours;
    # pinned, that becomes a deliberate bump where both pins move together.
    uses: docker/github-builder/.github/workflows/build.yml@v1.16.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: .
      file: src/apps/Elsa.Workbench/Dockerfile
      # An empty value fails the build rather than falling back to a source build (see the Dockerfile).
      build-args: |
        ELSA_PACKAGE_VERSIONS=${{ needs.versions.outputs.package-versions }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-workbench
      meta-images: elsaworkflows/elsa-workbench
      meta-tags: |
        type=sha
        type=raw,value=latest
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Workbench
        org.opencontainers.image.description=Elsa 4 development and demo workbench host
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-and-push-foundation-host:
    name: Build & push elsa-foundation-host
    # Same pinned reusable builder as the workbench job above (see the pinning note there):
    # the BuildKit/Buildx versions must match the `# syntax=` pin in
    # src/apps/Elsa.Foundation.Host/Dockerfile.
    uses: docker/github-builder/.github/workflows/build.yml@v1.16.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: .
      file: src/apps/Elsa.Foundation.Host/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: elsa-foundation-host
      meta-images: elsaworkflows/elsa-foundation-host
      meta-tags: |
        type=sha
        type=raw,value=latest
        type=raw,value=4.0.0-preview.${{ github.run_number }}
      labels: |
        org.opencontainers.image.title=Elsa Foundation Host
        org.opencontainers.image.description=Minimal Nuplane + CShells Elsa 4 server host
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
