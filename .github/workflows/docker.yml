name: Docker Image

# Builds and pushes the Elsa 4 server image to Docker Hub as elsaworkflows/elsa-server.
# The Elsa major version (4) is encoded in the image tags:
#   - pushes to main produce latest + 4.0.0-preview.<run_number>

on:
  push:
    branches: [main]

env:
  IMAGE: elsaworkflows/elsa-server
  BASE_VERSION: '4.0.0'

jobs:
  build-and-push:
    name: Build & push elsa-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Elsa Server
            org.opencontainers.image.description=Elsa 4 workflow server
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.BASE_VERSION }}-preview.${{ github.run_number }},enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Apps/Elsa.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
