name: Repository maintenance

# Trusted flake recording, daily CodeQL scanning, daily stale processing and the weekly branch sweep.
# CodeQL runs on a schedule and on demand, not on every push to main: four language jobs per merge cost far more
# than a daily scan of main finds later.
# The jobs retain separate event filters, permissions and concurrency groups.
# Policy and thresholds: docs/contributing/repository-hygiene.md
#
# Scheduled runs only report until the repository variable HYGIENE_ENFORCE is 'true'. A manual run
# chooses its own mode. Enforce tags each swept branch tip as archive/<branch> before deleting it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 6 * * 1'
    - cron: '23 5 * * *'
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance to run
        type: choice
        options: [hygiene, stale, codeql]
        default: hygiene
      mode:
        description: 'report changes nothing; enforce archives and deletes swept branches'
        type: choice
        options: [report, enforce]
        default: report

permissions:
  contents: read

jobs:
  hygiene:
    if: github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1' || github.event_name == 'workflow_dispatch' && inputs.task == 'hygiene'
    concurrency:
      group: repo-hygiene
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sweep branches and report
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || (vars.HYGIENE_ENFORCE == 'true' && 'enforce' || 'report') }}
          POST_REPORT: 'true'
        run: bash tools/repo-hygiene/hygiene.sh "$MODE"

  stale:
    if: github.event_name == 'schedule' && github.event.schedule == '23 5 * * *' || github.event_name == 'workflow_dispatch' && inputs.task == 'stale'
    concurrency:
      group: stale
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/stale@v9
        with:
          debug-only: ${{ vars.HYGIENE_ENFORCE != 'true' }}
          operations-per-run: 200
          stale-issue-label: stale
          stale-pr-label: stale

          # Issues: only intake states go stale; planned and structural work does not.
          any-of-issue-labels: needs-triage,needs-info
          exempt-issue-labels: type:program,type:epic,security,bug,keep-open
          days-before-issue-stale: 30
          days-before-issue-close: 14
          close-issue-reason: not_planned
          stale-issue-message: >
            No activity for 30 days while waiting for triage or information. This closes as not
            planned in 14 days unless someone comments or a maintainer triages it. Reopening is
            always fine. Policy: docs/contributing/repository-hygiene.md
          close-issue-message: >
            Closed as not planned after 44 days without triage or activity. Reopen with context if
            it is still relevant.

          # Pull requests: any open PR without activity, drafts included.
          days-before-pr-stale: 21
          days-before-pr-close: 7
          exempt-pr-labels: keep-open
          delete-branch: true
          stale-pr-message: >
            No activity for 21 days. This closes in 7 days unless it is updated or labelled
            keep-open. The branch is deleted on close; use Restore branch on this PR to pick it up again.
          close-pr-message: >
            Closed after 28 days without activity. Restore the branch and reopen to continue.

  # Artifact contents may originate in fork PRs: check out default-branch code only,
  # treat outcomes as data and retain the recorder's strict validation before commenting.
  record:
    concurrency:
      group: ci-flake-record
      cancel-in-progress: false
    name: Record retried tests
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # download the triggering run's artifacts
      issues: write   # comment on the flake-tracking issue
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the shard outcomes
        # A documentation-only run uploads no outcomes; nothing to record is not a failure.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: test-outcomes-*
          path: ${{ runner.temp }}/outcomes

      - name: Comment on the flake tracker
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          issue=$(python3 -c 'import json; print(int(json.load(open("tools/ci/test-tiers.json"))["flakeTrackerIssue"]))')
          python3 tools/ci/test_results.py record-flakes "$RUNNER_TEMP/outcomes" --run-url "$RUN_URL" --body "$RUNNER_TEMP/comment.md"
          if [[ -s "$RUNNER_TEMP/comment.md" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi

  analyze:
    if: github.event_name == 'schedule' && github.event.schedule == '23 4 * * *' || github.event_name == 'workflow_dispatch' && inputs.task == 'codeql'
    concurrency:
      group: codeql-${{ matrix.language }}
      cancel-in-progress: false
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
