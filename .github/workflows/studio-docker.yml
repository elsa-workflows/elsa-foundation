name: Studio Docker (consolidated gated)

# Main merges publish the exact source commit only after Studio CI succeeds.
# NuGet/npm publication stays manual: the automatic image is built from source.
# Manual package-backed qualification/release builds retain their provenance gates.
on:
  workflow_run:
    workflows: [Studio CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      packages_run_id:
        description: 'Successful run ID from Studio Packages (consolidated gated).'
        required: true
        type: string
      publish:
        description: 'Push the verified image after package publishing has succeeded. Leave false for build-only qualification.'
        required: true
        type: boolean
        default: false
      preview_image_tag:
        description: 'Required for a main image push. Check Docker Hub first and enter a strictly higher 4.0.0-preview.N tag.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build & optionally publish elsaworkflows/elsa-studio
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.path == '.github/workflows/studio-ci.yml' ||
         startsWith(github.event.workflow_run.path, '.github/workflows/studio-ci.yml@'))))
    concurrency:
      # A failed/PR/fork completion never enters this shared writer queue. Manual
      # image pushes share it; build-only qualification cannot displace a publisher.
      group: studio-docker-${{ (github.event_name == 'workflow_run' || inputs.publish == true) && 'publisher' || format('validation-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'workflow_run' && 'studio-images' || inputs.publish == true && 'studio-publish' || 'studio-validation' }}
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify the triggering main CI run
        if: github.event_name == 'workflow_run'
        id: ci_source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" |
            python3 tools/ci/studio_docker_publish.py validate-source

      - name: Verify the selected Studio Packages run
        if: github.event_name == 'workflow_dispatch'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.packages_run_id }}
          PUBLISH_IMAGE: ${{ inputs.publish }}
          PUBLISHING_ENABLED: ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::packages_run_id must be a numeric Actions run ID."
            exit 1
          fi
          if [[ "$PUBLISH_IMAGE" == "true" && "$PUBLISHING_ENABLED" != "true" ]]; then
            echo "::error::Image publishing was requested, but ELSA_STUDIO_CONSOLIDATED_PUBLISHING is not true."
            exit 1
          fi

          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          name=$(jq -r '.name // ""' <<< "$run")
          path=$(jq -r '.path // ""' <<< "$run")
          path=${path%%@*}
          event=$(jq -r '.event // ""' <<< "$run")
          status=$(jq -r '.status // ""' <<< "$run")
          conclusion=$(jq -r '.conclusion // ""' <<< "$run")
          head_repository=$(jq -r '.head_repository.full_name // ""' <<< "$run")
          head_branch=$(jq -r '.head_branch // ""' <<< "$run")
          head_sha=$(jq -r '.head_sha // ""' <<< "$run")
          run_number=$(jq -r '.run_number // ""' <<< "$run")

          if [[ "$name" != "Studio Packages (consolidated gated)" || "$path" != ".github/workflows/studio-packages.yml" ]]; then
            echo "::error::The selected run is not the consolidated Studio Packages workflow."
            exit 1
          fi
          if [[ "$event" != "workflow_dispatch" || "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "::error::The selected Studio Packages run must be a successful completed manual dispatch."
            exit 1
          fi
          if [[ "$head_repository" != "$GITHUB_REPOSITORY" || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The selected run must belong to this repository and identify a full commit SHA."
            exit 1
          fi
          if [[ "$PUBLISH_IMAGE" == "true" && "$head_branch" != "main" && ! "$head_branch" =~ ^v?4\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Image publication requires a Studio Packages run dispatched from main or a 4.x release tag."
            exit 1
          fi
          {
            echo "run_id=$SOURCE_RUN_ID"
            echo "head_branch=$head_branch"
            echo "sha=$head_sha"
            echo "run_number=$run_number"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the verified source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci_source.outputs.source_sha || steps.source.outputs.sha }}
          persist-credentials: false

      - name: Reject a stale main image source
        if: github.event_name == 'workflow_run' || (inputs.publish == true && steps.source.outputs.head_branch == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          SOURCE_SHA=$(git rev-parse HEAD)
          export MAIN_SHA SOURCE_SHA
          python3 tools/ci/studio_docker_publish.py is-current

      - name: Download that run's Studio package artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-studio-nuget-packages
          path: Studio/packages/nuget
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify Studio artifact provenance and derive image tags
        if: github.event_name == 'workflow_dispatch'
        id: manifest
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_RUN_NUMBER: ${{ steps.source.outputs.run_number }}
          EXPECTED_HEAD_BRANCH: ${{ steps.source.outputs.head_branch }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          PUBLISH_IMAGE: ${{ inputs.publish }}
          PREVIEW_IMAGE_TAG: ${{ inputs.preview_image_tag }}
          PUBLISHING_ENABLED: ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/ci")
          from studio_image_tags import derive_tags
          from verify_studio_nuget_packages import verify_packages

          artifact = Path("Studio/packages/nuget")
          manifest_path = artifact / "studio-package-build.json"
          if not manifest_path.is_file():
              raise SystemExit("Studio package provenance manifest is missing from the selected artifact.")
          manifest = json.loads(manifest_path.read_text())
          expected = {
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "workflow": "Studio Packages (consolidated gated)",
              "run_id": os.environ["EXPECTED_RUN_ID"],
              "run_number": int(os.environ["EXPECTED_RUN_NUMBER"]),
              "commit": os.environ["EXPECTED_SHA"],
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Studio artifact provenance mismatch for {key}.")
          source_branch = os.environ["EXPECTED_HEAD_BRANCH"]
          expected_ref = "refs/heads/main" if source_branch == "main" else f"refs/tags/{source_branch}"
          if os.environ["PUBLISH_IMAGE"] == "true" and manifest.get("ref") != expected_ref:
              raise SystemExit("Studio artifact ref does not match the selected Actions run ref.")

          package_ids = verify_packages(Path.cwd(), artifact, manifest["version"])

          target = manifest.get("publish_target")
          gate_enabled = manifest.get("publisher_gate_enabled") is True
          publish_requested = os.environ["PUBLISH_IMAGE"] == "true"
          if publish_requested and (target not in {"feedz-preview", "public-release"} or not gate_enabled or os.environ["PUBLISHING_ENABLED"] != "true"):
              raise SystemExit("Image publishing requires a successful package publication with the repository gate enabled.")

          sha = manifest["commit"]
          version = manifest["version"]
          ref = manifest["ref"]
          tags = derive_tags(ref, version, sha, publish_requested, os.environ["PREVIEW_IMAGE_TAG"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish_image={'true' if publish_requested else 'false'}\n")
              output.write(f"studio_version={version}\n")
              output.write("image_tags<<TAGS\n" + "\n".join(tag for tag in tags if tag != "elsaworkflows/elsa-studio:latest") + "\nTAGS\n")
          print(f"Verified the exact {len(package_ids)} Studio package IDs at version {version} from {sha}.")
          PY

      - name: Allocate the next automatic preview image tag
        if: github.event_name == 'workflow_run'
        id: automatic
        env:
          SOURCE_SHA: ${{ steps.ci_source.outputs.source_sha }}
        run: python3 tools/ci/studio_docker_publish.py preview-version

      - name: Resolve image build settings
        id: image
        env:
          AUTO_VERSION: ${{ steps.automatic.outputs.studio_version }}
          MANUAL_VERSION: ${{ steps.manifest.outputs.studio_version }}
          AUTO_TAGS: ${{ steps.automatic.outputs.image_tags }}
          MANUAL_TAGS: ${{ steps.manifest.outputs.image_tags }}
          MANUAL_PUBLISH: ${{ steps.manifest.outputs.publish_image }}
        run: |
          {
            echo "version=${AUTO_VERSION:-$MANUAL_VERSION}"
            echo "publish=$([[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]] && echo true || echo "$MANUAL_PUBLISH")"
            echo 'tags<<TAGS'
            printf '%s\n' "${AUTO_TAGS:-$MANUAL_TAGS}"
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Studio/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Studio/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Studio

      - name: Build frontend assets
        run: pnpm build
        working-directory: Studio

      - name: Verify Studio frontend assets
        run: python3 tools/ci/verify-studio-assets.py

      - name: Set up QEMU for the multi-platform publisher
        if: ${{ steps.image.outputs.publish == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ steps.image.outputs.publish == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and optionally publish versioned image tags
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Studio/src/apps/Elsa.Studio.Web/Dockerfile
          platforms: ${{ steps.image.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: STUDIO_VERSION=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.title=Elsa Studio
            org.opencontainers.image.description=Elsa 4 workflow studio
            org.opencontainers.image.revision=${{ steps.ci_source.outputs.source_sha || steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.elsa.build.source-run=${{ steps.ci_source.outputs.source_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, steps.source.outputs.run_id) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote the verified main digest to latest
        if: steps.image.outputs.publish == 'true' && (github.event_name == 'workflow_run' || steps.source.outputs.head_branch == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          SOURCE_SHA=$(git rev-parse HEAD)
          export MAIN_SHA SOURCE_SHA
          current_status=0
          python3 tools/ci/studio_docker_publish.py is-current || current_status=$?
          if [[ "$current_status" == 1 ]]; then
            echo "Main advanced while building. Versioned tags were published; latest remains unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$current_status" != 0 ]]; then exit "$current_status"; fi
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag elsaworkflows/elsa-studio:latest "elsaworkflows/elsa-studio@$IMAGE_DIGEST"
          echo "Published Studio latest from $SOURCE_SHA ($IMAGE_DIGEST)." >> "$GITHUB_STEP_SUMMARY"
