name: Hosted stable restore and maps qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-and-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/foundation-qualification
      NUGET_PACKAGES: ${{ runner.temp }}/foundation-stable-nuget-packages

    steps:
      - name: Prepare fresh runner-local directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [ -e "$NUGET_PACKAGES" ]; then
            echo "Expected a fresh runner-local NuGet package directory: $NUGET_PACKAGES" >&2
            exit 1
          fi
          mkdir -p "$NUGET_PACKAGES"
          printf 'runner=%s\nnugetPackages=%s\n' "$RUNNER_NAME" "$NUGET_PACKAGES" \
            > "$EVIDENCE_DIR/runner.txt"

      - name: Checkout exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Capture checkout and input provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show -s --format='commit=%H%ntree=%T%nparents=%P%ncommitterDate=%cI' HEAD \
            > "$EVIDENCE_DIR/checkout.txt"
          printf 'githubSha=%s\nworkflowRef=%s\nworkflowSha=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_WORKFLOW_SHA" \
            >> "$EVIDENCE_DIR/checkout.txt"
          git ls-tree -r --full-tree HEAD > "$EVIDENCE_DIR/source-tree.txt"
          git status --porcelain=v1 -z > "$EVIDENCE_DIR/status-before.nul"
          if [ -s "$EVIDENCE_DIR/status-before.nul" ]; then
            echo "Checkout is not clean before qualification." >&2
            exit 1
          fi
          git ls-files -z -- \
            ':(glob)**/packages.lock.json' \
            ':(glob)**/*.csproj' \
            Directory.Build.props Directory.Packages.props PackageVersioning.props \
            VersionLines.props NuGet.config global.json Elsa.Server.slnx \
            tools/maps/Elsa.Maps.Generator docs/maps docs/reports \
            > "$EVIDENCE_DIR/input-files.nul"
          while IFS= read -r -d '' file; do
            sha256sum -- "$file"
          done < "$EVIDENCE_DIR/input-files.nul" > "$EVIDENCE_DIR/input-sha256.txt"
          dotnet --info 2>&1 | tee "$EVIDENCE_DIR/dotnet-info.log"

      - name: Restore solution packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Elsa.Server.slnx --no-http-cache --disable-parallel -m:1 -p:WarningsNotAsErrors=NU1603 \
            2>&1 | tee "$EVIDENCE_DIR/restore.log"

      - name: Build Maps generator
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/maps/Elsa.Maps.Generator/Elsa.Maps.Generator.csproj \
            -c Release --no-restore -m:1 \
            2>&1 | tee "$EVIDENCE_DIR/maps-build.log"

      - name: Regenerate all maps
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/maps/Elsa.Maps.Generator/Elsa.Maps.Generator.csproj \
            -c Release --no-build --no-restore -- all \
            2>&1 | tee "$EVIDENCE_DIR/maps-all.log"

      - name: Check generated maps
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/maps/Elsa.Maps.Generator/Elsa.Maps.Generator.csproj \
            -c Release --no-build --no-restore -- check \
            2>&1 | tee "$EVIDENCE_DIR/maps-check.log"

      - name: Capture generated outputs and diff provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if ! git rev-parse --show-toplevel >/dev/null 2>&1; then
            printf 'Checkout unavailable; no repository output capture was possible.\n' \
              > "$EVIDENCE_DIR/output-capture.txt"
            exit 0
          fi

          printf 'head=%s\n' "$(git rev-parse HEAD)" > "$EVIDENCE_DIR/output-capture.txt"
          git status --porcelain=v1 --untracked-files=all \
            > "$EVIDENCE_DIR/status-after.txt"
          git diff --binary HEAD -- \
            ':(glob)**/packages.lock.json' docs/maps docs/reports \
            > "$EVIDENCE_DIR/generated.diff"

          {
            git diff --name-only -z HEAD -- \
              ':(glob)**/packages.lock.json' docs/maps docs/reports
            git ls-files --others --exclude-standard -z -- \
              ':(glob)**/packages.lock.json' docs/maps docs/reports
          } > "$EVIDENCE_DIR/generated-files.nul"

          : > "$EVIDENCE_DIR/generated-existing-files.nul"
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              printf '%s\0' "$file" >> "$EVIDENCE_DIR/generated-existing-files.nul"
            fi
          done < "$EVIDENCE_DIR/generated-files.nul"

          if [ -s "$EVIDENCE_DIR/generated-files.nul" ]; then
            if [ -s "$EVIDENCE_DIR/generated-existing-files.nul" ]; then
              tar --create --gzip \
                --file="$EVIDENCE_DIR/generated-files.tar.gz" \
                --null --files-from="$EVIDENCE_DIR/generated-existing-files.nul"
            fi
            while IFS= read -r -d '' file; do
              sha256sum -- "$file"
            done < "$EVIDENCE_DIR/generated-existing-files.nul" \
              > "$EVIDENCE_DIR/generated-sha256.txt"
          else
            printf 'No package lock, docs/maps, or docs/reports files changed.\n' \
              > "$EVIDENCE_DIR/generated-sha256.txt"
          fi

      - name: Upload restore and maps evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-hosted-restore-maps-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-qualification/
          if-no-files-found: warn
          retention-days: 14

