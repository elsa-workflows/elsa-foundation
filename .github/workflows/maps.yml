name: Hosted extraction closeout map refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78c8142ff82abf394dd0f478c267084b14233437
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Generate and verify maps for exact closeout source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closeout-maps"
          git rev-parse HEAD > "$RUNNER_TEMP/closeout-maps/source.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/closeout-maps/source-tree.txt"
          dotnet run --project tools/maps/Elsa.Maps.Generator -c Release -p:RestoreLockedMode=true -- all > "$RUNNER_TEMP/closeout-maps/maps-all.log" 2>&1
          git diff --binary > "$RUNNER_TEMP/closeout-maps/generated.diff"
          python3 - <<'VERIFY'
          import subprocess,pathlib
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed==['docs/maps/spec-status-map.md'],changed
          pathlib.Path('docs/maps/spec-status-map.md').read_text()
          VERIFY
          git diff --check
          dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- check > "$RUNNER_TEMP/closeout-maps/maps-check.log" 2>&1
          cp docs/maps/spec-status-map.md "$RUNNER_TEMP/closeout-maps/spec-status-map.md"
          sha256sum "$RUNNER_TEMP/closeout-maps/spec-status-map.md" > "$RUNNER_TEMP/closeout-maps/map-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-closeout-maps-${{ github.run_id }}
          path: ${{ runner.temp }}/closeout-maps/
          if-no-files-found: error
