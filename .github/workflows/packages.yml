name: Packages

# Packs the Elsa 4 (Elsa.*) libraries at the versions spec 150 computes, and publishes from main only the packages
# whose inputs changed since their last publish, recording each on the publish-state branch. The logic lives in
# tools/versioning/Elsa.Versioning.Publisher (tools/versioning/README.md, Publishing); this workflow only runs it.
# Every run starts with the publisher's plan, which takes one of four modes:
#
#   - branch     a push to any branch below but main, or a manual run from one: packs the affected set at
#                branch-scoped versions for the run's artifact, and never pushes to a feed (spec 150 FR-008).
#   - dry-run    a push to main, or a manual run from it, while publish-state does not exist: packs every package at
#                the version the bootstrap would publish, uploads them, and publishes nothing. The job summary says the
#                bootstrap is pending.
#   - bootstrap  a manual run from main with bootstrap: true, the one-off first publish (#2081). It refuses if
#                publish-state exists, or if the feed holds any version of these packages that does not sort below the
#                one it would push, such as the old 4.0.0-preview.N and branch builds; otherwise it pushes every package
#                and creates publish-state as an orphan branch holding only published-versions.json.
#   - publish    a push to main, or a manual run from it, once publish-state exists: packs and pushes only the
#                affected set (FR-006), with no global /p:Version (FR-005) and no --skip-duplicate (FR-011), settles a
#                push the feed rejects by the input fingerprint of the feed's copy (FR-018), and writes the record back
#                with this workflow's GITHUB_TOKEN (FR-017). A manual run can force-advance named packages (FR-003).
#
# A GitHub Release publishes nothing until the 4.0 release cut, #2085: the release job fails and says so.
#
# The full test suite is intentionally NOT run here (it includes Testcontainers-based integration tests); testing
# belongs in CI. Packing only compiles the libraries, so no containers are started.

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'One-off first publish, from main only: push every package and create publish-state. Refuses if publish-state exists or the feed still holds any 4.0.0-* prerelease.'
        type: boolean
        default: false
      force_advance:
        description: 'Package ids to advance although none of their inputs changed, comma-separated (spec 150 FR-003). Needs force_reason.'
        type: string
        default: ''
      force_reason:
        description: 'Why the force_advance packages advance; recorded in the computation.'
        type: string
        default: ''
  push:
    branches:
      - 'main'
      - 'feat/*'
      - 'fix/*'
      - 'bug/*'
      - 'enh/*'
      - 'perf/*'
      - 'patch/*'
      - 'rc/*'
      - 'release/*'
      - 'develop/*'
  release:
    types: [prereleased, published]

# FR-020: every run from main - each push, each manual run, the bootstrap - is serialized on one group from its plan to
# its write-back, so no two runs compute against the same record. A run in progress is never cancelled. GitHub drops a
# queued run when a newer one queues, which FR-020 allows: the newer run publishes every change the dropped one would
# have. publish-repair.yml writes publish-state too, and joins this same group. Every other run has its own.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'publish-state' || format('packages-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  feedz_feed_source: 'https://f.feedz.io/elsa-workflows/elsa-4/nuget/index.json'

jobs:
  pack:
    name: Build packages
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      affected: ${{ steps.plan.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The calculator compares trees at the commits the record names and proves ancestry (FR-021).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the publisher
        run: dotnet build tools/versioning/Elsa.Versioning.Publisher -c Release

      - name: Plan
        # Writes plan.json, computation.json, package-versions.props and packages.slnf (the affected set) under
        # $RUNNER_TEMP/versions, the step outputs mode and affected, and the job summary.
        id: plan
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          FORCE_ADVANCE: ${{ inputs.force_advance }}
          FORCE_REASON: ${{ inputs.force_reason }}
        run: >-
          dotnet run --project tools/versioning/Elsa.Versioning.Publisher -c Release --no-build --
          plan --ref "$GITHUB_REF" --commit "$GITHUB_SHA" --bootstrap "${BOOTSTRAP:-false}"
          --force-advance "$FORCE_ADVANCE" --force-reason "$FORCE_REASON"
          --output "$RUNNER_TEMP/versions" --solution Elsa.Server.slnx
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      # Restore, build and pack the affected set alone (FR-006a), each through the computed pack-properties file, which
      # PackageVersioning.props reads for every package's version and input fingerprint. No global /p:Version (FR-005).
      - name: Restore
        if: ${{ steps.plan.outputs.affected != '0' }}
        run: >-
          dotnet restore "$RUNNER_TEMP/versions/packages.slnf"
          -p:CustomBeforeDirectoryBuildProps="$RUNNER_TEMP/versions/package-versions.props" -p:WarningsNotAsErrors=NU1603

      - name: Build
        if: ${{ steps.plan.outputs.affected != '0' }}
        run: >-
          dotnet build "$RUNNER_TEMP/versions/packages.slnf" -c Release --no-restore
          -p:CustomBeforeDirectoryBuildProps="$RUNNER_TEMP/versions/package-versions.props" -p:WarningsNotAsErrors=NU1603

      - name: Pack
        if: ${{ steps.plan.outputs.affected != '0' }}
        run: >-
          dotnet pack "$RUNNER_TEMP/versions/packages.slnf" -c Release --no-build
          -p:CustomBeforeDirectoryBuildProps="$RUNNER_TEMP/versions/package-versions.props" -p:WarningsNotAsErrors=NU1603
          -p:PackageOutputPath="$RUNNER_TEMP/versions/nuget"

      - name: Upload artifact
        # The packages under nuget/, with the plan and computation the publish job checks them against.
        uses: actions/upload-artifact@v4
        with:
          name: elsa-foundation-nuget-packages
          path: ${{ runner.temp }}/versions
          if-no-files-found: error

  publish:
    name: Publish to feedz.io
    needs: pack
    # Only a build of main that planned a publish or the bootstrap gets here; the publisher refuses anything else again.
    if: >-
      ${{ github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (needs.pack.outputs.mode == 'publish' || needs.pack.outputs.mode == 'bootstrap')
      && needs.pack.outputs.affected != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # FR-017: the write-back to publish-state is pushed with this job's GITHUB_TOKEN, which actions/checkout persists
      # for origin. Pushes made with it start no workflow run.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build the publisher
        run: dotnet build tools/versioning/Elsa.Versioning.Publisher -c Release

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-nuget-packages
          path: ${{ runner.temp }}/versions

      - name: Publish
        # Refuses unless publish-state is where the plan found it (or, for the bootstrap, absent) and the versions
        # recompute to the same bytes; then pushes in dependency order, stopping at the first failure, and writes back
        # whatever landed.
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
        run: >-
          dotnet run --project tools/versioning/Elsa.Versioning.Publisher -c Release --no-build --
          publish --ref "$GITHUB_REF" --commit "$GITHUB_SHA" --plan-dir "$RUNNER_TEMP/versions"
          --feed "$feedz_feed_source" --api-key-env FEEDZ_API_KEY --summary "$GITHUB_STEP_SUMMARY"

  release:
    name: Release packages
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse until the 4.0 release cut
        # A release used to push its tag's version of every package, to feedz.io and nuget.org, through a global
        # /p:Version and --skip-duplicate. Spec 150 forbids both, and a stable 4.0.0 on either feed would sort above every
        # computed 4.0.N-preview. Promoting a release is #2085's to build.
        run: |
          echo "::error title=Releases publish nothing yet::Packages from a GitHub Release are not published until the 4.0 release cut is built (#2085, https://github.com/elsa-workflows/elsa-foundation/issues/2085). Previews publish from main."
          exit 1
