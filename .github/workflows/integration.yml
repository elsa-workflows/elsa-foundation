name: Integration (nightly)

# Deferred integration/nightly gate -- the follow-up scoped out of issue #544 and
# PR #545, which added the PR-time gate (ci.yml) that deliberately runs only the
# fast, container-free unit tests.
#
# This workflow is the INVERSE of ci.yml's filter: it runs ONLY the test projects
# that reference Testcontainers (Docker required). The generate-filter step mirrors
# ci.yml's but KEEPS the container projects instead of dropping them, so it is
# self-maintaining: any new Testcontainers test project is picked up here automatically
# (and excluded from the PR gate).
#
# Why not on pull_request: containers are too slow/flaky to run on every PR -- that is
# the explicit reason #544 excluded them from ci.yml. This runs nightly against main
# plus on-demand via workflow_dispatch.
#
# GitHub-hosted ubuntu-latest runners ship with a working Docker daemon, so
# Testcontainers works with no extra setup. Provider fixtures pin exact image tags
# for determinism.
#
# This is informational/nightly, NOT a required PR check -- it is intentionally not
# wired into branch protection. A failed run is visible in the Actions tab.
#
# It is NOT, however, visible through the usual scheduled-workflow failure notification, which
# is what this file used to claim. GitHub sends that mail to whoever last committed a change to
# the cron schedule, which in a long-lived workflow is nobody who is watching: on 2026-08-12
# this run failed at 05:02Z against a main that could not activate the Workbench, and it went
# unread while main showed green for another four hours. The alert job at the bottom (issue
# #1298) files a deduplicated issue instead, which is the same escalation the push-triggered
# gates now use.

on:
  schedule:
    # 03:17 UTC daily. Odd minute to avoid the top-of-hour scheduler surge.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Generate Testcontainers-only test solution filter
        # Inverse of ci.yml: keep ONLY test projects that reference Testcontainers.
        # Self-maintaining -- new Testcontainers projects are picked up automatically.
        # Fail loudly if the set is empty: that means the filter logic broke (a silent
        # empty test run would pass green while testing nothing).
        run: |
          keep=()
          while IFS= read -r p; do
            grep -q "Testcontainers" "$p" && keep+=("$p")
          done < <(find tests -name '*.csproj' | sort)
          if [ ${#keep[@]} -eq 0 ]; then
            echo "::error::No Testcontainers test projects found -- filter logic is broken."
            exit 1
          fi
          projects=$(printf '"%s",' "${keep[@]}" | sed 's/,$//')
          printf '{"solution":{"path":"Elsa.Server.slnx","projects":[%s]}}' "$projects" > Elsa.Server.integration.slnf
          echo "Kept ${#keep[@]} Testcontainers test project(s) in the integration filter."

      - name: Restore
        run: dotnet restore Elsa.Server.slnx -p:WarningsNotAsErrors=NU1603

      - name: Build (full solution, including test projects)
        run: dotnet build Elsa.Server.slnx -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      - name: Test (Testcontainers integration tests)
        run: dotnet test Elsa.Server.integration.slnf -c Release --no-build -p:WarningsNotAsErrors=NU1603

  # Feature 094 activation shells. Each lane is deliberately skipped and contains
  # a failing sentinel so removing the condition before its owning tasks land cannot
  # produce a false-green readiness signal.
  groundwork-provider-matrix:
    name: Groundwork provider matrix (scaffold)
    if: ${{ false }}
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Activation sentinel
        run: |
          echo "::error::Provider-matrix scaffolding only; replace this sentinel when T086-T089 and T092 activate the lane."
          exit 1

  groundwork-failure-restart:
    name: Groundwork failure & restart (scaffold)
    if: ${{ false }}
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Activation sentinel
        run: |
          echo "::error::Failure/restart scaffolding only; replace this sentinel when T090 activates the lane."
          exit 1

  groundwork-schema-plan:
    name: Groundwork schema plan (scaffold)
    if: ${{ false }}
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Activation sentinel
        run: |
          echo "::error::Schema-plan scaffolding only; replace this sentinel when T020 and T030 activate the lane."
          exit 1

  groundwork-temporary-oracle:
    name: Groundwork temporary EF oracle (scaffold)
    if: ${{ false }}
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Activation sentinel
        run: |
          echo "::error::Temporary-oracle scaffolding only; replace this sentinel when T091 activates the lane."
          exit 1

  groundwork-readiness:
    name: Groundwork readiness (scaffold)
    if: ${{ false }}
    needs:
      - groundwork-provider-matrix
      - groundwork-failure-restart
      - groundwork-schema-plan
      - groundwork-temporary-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activation sentinel
        run: |
          echo "::error::Readiness scaffolding only; replace this sentinel after T100 and activate it in T105."
          exit 1

  # Scheduled runs only. A workflow_dispatch failure needs no issue: someone is already looking
  # at the run they just started.
  alert:
    name: Alert on a red main
    needs: integration-tests
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/main-red-alert.yml
    with:
      gate: Integration (nightly)
