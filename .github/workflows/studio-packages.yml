name: Studio Packages (consolidated gated)

# Structural-consolidation replacement for studio/.github/workflows/packages.yml.
# This workflow is manual-only. Build-only is the default; publication is inert until
# the old Studio publisher has been disabled and the repository variable below is
# explicitly enabled during the approved cutover. The Foundation `Packages` workflow
# remains the sole publisher for Foundation packages and its Docker consumer.
#
# Frontend (React/Vite) client assets are generated into each module's ignored wwwroot.
# Build them in this job before .NET build/test/pack so the NuGet packages contain the
# same host and RCL assets that the Studio Docker image ships.
#
# Alongside the NuGet packages, four workspace libraries are also published to npm as standalone
# deliverables (@elsa-workflows/studio-sdk, studio-ui, studio-code-editor, studio-workflows).
# On disk those packages stay `private: true` and export raw `src/` for the in-repo workspace
# dev flow; the `build_npm` job builds each one's `dist/` via `build:lib`, runs
# scripts/prepare-npm-package.mjs to rewrite each manifest into publishable shape (see that
# script for the why), then packs and publishes them — preview builds to the elsa-4 feedz.io npm
# feed on an explicitly requested preview, and the tagged version to npmjs.org on an
# explicitly requested stable release, in dependency order.

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Build only by default. Publishing requires the repository opt-in and a reviewed manual dispatch from main or a release tag.'
        type: choice
        options:
          - none
          - feedz-preview
          - public-release
        default: none
        required: true
      preview_version:
        description: 'Required for a main feedz-preview publish. Check both NuGet and all four npm published floors first; use a strictly higher 4.0.0-preview.N version.'
        type: string
        default: ''
        required: false

env:
  base_version: '4.0.0'
  feedz_feed_source: 'https://f.feedz.io/elsa-workflows/elsa-4/nuget/index.json'
  nuget_feed_source: 'https://api.nuget.org/v3/index.json'
  npm_feed_feedz: 'https://f.feedz.io/elsa-workflows/elsa-4/npm/'
  npm_feed_npm: 'https://registry.npmjs.org/'

permissions:
  contents: read

concurrency:
  group: studio-packages-${{ inputs.publish_target }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: studio

jobs:
  version:
    name: Validate publication request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      signed_snapshot: ${{ steps.resume.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      publish_target: ${{ steps.version.outputs.publish_target }}
      publisher_gate: ${{ steps.version.outputs.publisher_gate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate request and compute the existing Studio version
        id: version
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target }}
          PREVIEW_VERSION: ${{ inputs.preview_version }}
          PUBLISHING_ENABLED: ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/tags/*:refs/tags/*

          if [[ "$PUBLISH_TARGET" != "none" && "$PUBLISHING_ENABLED" != "true" ]]; then
            echo "::error::Publishing was requested, but ELSA_STUDIO_CONSOLIDATED_PUBLISHING is not true."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Studio package tags must point to a commit reachable from main."
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^4\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Expected a v4 semver tag; got $GITHUB_REF_NAME."
              exit 1
            fi
            if [[ "$PUBLISH_TARGET" == "public-release" && "$VERSION" == *-* ]]; then
              echo "::error::Public-release publishing requires a stable v4 tag without a prerelease suffix."
              exit 1
            fi
            if [[ "$PUBLISH_TARGET" == "feedz-preview" && "$VERSION" != *-* ]]; then
              echo "::error::Feedz preview publishing from a tag requires a prerelease version."
              exit 1
            fi
          else
            BRANCH_NAME="$GITHUB_REF_NAME"
            PACKAGE_PREFIX="$(printf '%s' "$BRANCH_NAME" | awk -F/ '{print $NF}' | tr '_' '-')"
            if [[ "$BRANCH_NAME" == "main" ]]; then
              PACKAGE_PREFIX="preview"
              if [[ "$PUBLISH_TARGET" == "feedz-preview" ]]; then
                if [[ ! "$PREVIEW_VERSION" =~ ^4\.0\.0-preview\.[0-9]+$ ]]; then
                  echo "::error::Main preview publishing requires preview_version in the form 4.0.0-preview.N. Compare the published NuGet and npm floors first."
                  exit 1
                fi
                VERSION="$PREVIEW_VERSION"
              else
                VERSION="${base_version}-${PACKAGE_PREFIX}.${GITHUB_RUN_NUMBER}"
              fi
            elif [[ "$PUBLISH_TARGET" != "none" ]]; then
              echo "::error::Studio publishing from a branch is allowed only on main."
              exit 1
            else
              VERSION="${base_version}-${PACKAGE_PREFIX}.${GITHUB_RUN_NUMBER}"
            fi
          fi

          if [[ "$PUBLISH_TARGET" == "public-release" && "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Public-release publishing requires a manual dispatch from a 4.x release tag (with optional leading v)."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "publish_target=$PUBLISH_TARGET"
            echo "publisher_gate=$PUBLISHING_ENABLED"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Studio package version: $VERSION."
            if [[ "$PUBLISH_TARGET" == "none" ]]; then
              echo "Publication target: none (build-only)."
            else
              echo "Publication target: $PUBLISH_TARGET (repository opt-in enabled)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find an already signed snapshot of this run before rebuilding
        if: ${{ inputs.publish_target != 'none' && github.run_attempt != '1' }}
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ../tools/versioning/package-evidence/studio_snapshot.sh

  build:
    name: Build packages
    needs: version
    if: ${{ !needs.version.outputs.signed_snapshot }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: studio/package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install release inventory tools
        run: npm ci --prefix ../tools/versioning/package-evidence --ignore-scripts --no-audit

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Studio host and RCL frontend assets
        env:
          STUDIO_INVENTORY: ${{ runner.temp }}/studio-bundles
        run: pnpm build

      - name: Verify generated Studio host and RCL assets
        run: python3 ../tools/ci/verify-studio-assets.py --root ..

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Elsa.Studio.slnx -p:WarningsNotAsErrors=NU1603

      - name: Build
        run: dotnet build Elsa.Studio.slnx -c Release --no-restore "/p:Version=$VERSION" -p:WarningsNotAsErrors=NU1603

      - name: Test
        run: dotnet test Elsa.Studio.slnx -c Release --no-build "/p:Version=$VERSION"

      - name: Generate frontend inventories and pack official Studio projects
        run: |
          set -euo pipefail
          inventories="$RUNNER_TEMP/studio-inventories"
          node ../tools/versioning/package-evidence/studio.mjs nuget "$RUNNER_TEMP/studio-bundles" ../tools/ci/studio-package-identities.json "$inventories"
          # The solution includes independently packable UX fixtures. The public project list owns this feed.
          jq -r '.packable_projects[].project' ../tools/ci/studio-package-identities.json | while IFS= read -r project; do
            dotnet pack "../$project" -c Release --no-build "/p:Version=$VERSION" -p:WarningsNotAsErrors=NU1603 \
              "-p:PackageOutputPath=$(pwd)/packages/nuget" "-p:StudioFrontendInventories=$inventories"
          done

      - name: Verify exact Studio NuGet package set
        run: python3 ../tools/ci/verify_studio_nuget_packages.py --root .. --packages packages/nuget --version "$VERSION"

      - name: Verify embedded frontend inventories and record final NuGet digests
        run: python3 ../tools/versioning/package-evidence/studio_archives.py packages/nuget --write nuget

      - name: Write Studio artifact provenance
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target }}
          PUBLISHING_ENABLED: ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("packages/nuget/studio-package-build.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "Studio Packages (consolidated gated)",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "ref": os.environ["GITHUB_REF"],
              "commit": os.environ["GITHUB_SHA"],
              "version": os.environ["VERSION"],
              "publish_target": os.environ["PUBLISH_TARGET"],
              "publisher_gate_enabled": os.environ["PUBLISHING_ENABLED"] == "true",
          }, indent=2) + "\n")
          PY

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-foundation-studio-nuget-packages
          path: studio/packages/nuget/
          overwrite: true

  publish_preview_feedz:
    name: Publish to feedz.io
    needs: attest
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ !cancelled() && needs.attest.result == 'success' && vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'feedz-preview'
      && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/studio-signed-packages
        with:
          artifact-id: ${{ needs.attest.outputs.artifact_id }}
          kind: nuget
          receipt-sha256: ${{ needs.attest.outputs.nuget_receipt }}
          version: ${{ needs.attest.outputs.version }}

      - name: Verify any existing NuGet versions before the first push
        run: python3 ../tools/versioning/package-evidence/studio_nuget_feed.py packages/nuget "$RUNNER_TEMP/existing-nuget" "$feedz_feed_source" --preflight

      - name: Publish to feedz.io
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
        run: dotnet nuget push packages/nuget/*.nupkg -k "$FEEDZ_API_KEY" -s "$feedz_feed_source" --skip-duplicate

  publish_nuget:
    name: Publish release to nuget.org
    needs: attest
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ !cancelled() && needs.attest.result == 'success' && vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'public-release'
      && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/studio-signed-packages
        with:
          artifact-id: ${{ needs.attest.outputs.artifact_id }}
          kind: nuget
          receipt-sha256: ${{ needs.attest.outputs.nuget_receipt }}
          version: ${{ needs.attest.outputs.version }}

      - name: Verify any existing NuGet versions before the first push
        run: python3 ../tools/versioning/package-evidence/studio_nuget_feed.py packages/nuget "$RUNNER_TEMP/existing-nuget" "$nuget_feed_source" --preflight

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push packages/nuget/*.nupkg -k "$NUGET_API_KEY" -s "$nuget_feed_source" --skip-duplicate

  # Builds, packs and verifies the four npm workspace libraries. Runs in parallel with the NuGet
  # `build` job on the same triggers, sharing the identical versioning scheme.
  build_npm:
    name: Build npm packages
    needs: version
    if: ${{ !needs.version.outputs.signed_snapshot }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm must be set up BEFORE setup-node so that `cache: pnpm` can find the pnpm binary.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: studio/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the four publishable libraries (each produces dist/index.js + dist/index.d.ts,
      # plus dist/tokens.css for studio-ui and dist/style.css for studio-workflows).
      - name: Record locked production resolutions
        run: |
          npm ci --prefix ../tools/versioning/package-evidence --ignore-scripts --no-audit
          python3 -m unittest discover -s ../tools/versioning/package-evidence -p test_studio_evidence.py
          mkdir -p "$RUNNER_TEMP/studio-locked"
          pnpm --filter @elsa-workflows/studio-sdk --filter @elsa-workflows/studio-ui \
            --filter @elsa-workflows/studio-code-editor --filter @elsa-workflows/studio-workflows \
            sbom --lockfile-only --prod --split --sbom-format cyclonedx --sbom-spec-version 1.6 \
            --out "$RUNNER_TEMP/studio-locked/%s.cdx.json"

      - name: Build libraries
        env:
          STUDIO_INVENTORY: ${{ runner.temp }}/studio-bundles
        run: >-
          pnpm
          --filter @elsa-workflows/studio-sdk
          --filter @elsa-workflows/studio-ui
          --filter @elsa-workflows/studio-code-editor
          --filter @elsa-workflows/studio-workflows
          run build:lib

      # Rewrite each on-disk (private, src-pointing) manifest into publishable shape. See
      # scripts/prepare-npm-package.mjs for why this can't be done with publishConfig alone.
      - name: Prepare npm manifests
        run: |
          for dir in \
            src/essentials/Elsa.Studio.Hosting/StudioSdk \
            src/essentials/Elsa.Studio.Hosting/StudioUi \
            src/essentials/Elsa.Studio.CodeEditor/Client \
            src/essentials/Elsa.Studio.Workflows/Client; do
            node scripts/prepare-npm-package.mjs "$dir" "$VERSION"
          done

      # Pack each package into packages/npm. `pnpm pack` writes the tarball relative to the
      # package dir by default, so we pin the destination to an absolute path shared by all four.
      - name: Generate library inventories from the release manifests
        run: node ../tools/versioning/package-evidence/studio.mjs npm "$RUNNER_TEMP/studio-bundles" "$RUNNER_TEMP/studio-locked"

      - name: Pack packages
        run: |
          mkdir -p packages/npm
          DEST="$(pwd)/packages/npm"
          for dir in \
            src/essentials/Elsa.Studio.Hosting/StudioSdk \
            src/essentials/Elsa.Studio.Hosting/StudioUi \
            src/essentials/Elsa.Studio.CodeEditor/Client \
            src/essentials/Elsa.Studio.Workflows/Client; do
            (cd "$dir" && pnpm pack --pack-destination "$DEST")
          done

      # Guard against shipping a tarball that points at src/ or is missing its built output.
      - name: Verify tarball contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(packages/npm/*.tgz)
          if [[ ${#tarballs[@]} -ne 4 ]]; then
            echo "Expected exactly four npm package tarballs, found ${#tarballs[@]}" >&2
            exit 1
          fi
          actual_ids=()
          for tgz in "${tarballs[@]}"; do
            echo "Verifying $tgz"
            contents=$(tar -tzf "$tgz")
            # Every package must ship its built entry point and types.
            for required in package/dist/index.js package/dist/index.d.ts; do
              if ! grep -qx "$required" <<< "$contents"; then
                echo "  MISSING: $required in $tgz" >&2
                exit 1
              fi
            done
            # studio-ui ships tokens and the actual public component stylesheet.
            if [[ "$tgz" == *studio-ui-* ]]; then
              if ! grep -qx "package/dist/tokens.css" <<< "$contents" || ! grep -qx "package/dist/styles.css" <<< "$contents"; then
                echo "  MISSING: package/dist/tokens.css or styles.css in $tgz" >&2
                exit 1
              fi
            fi
            # Workflow and code editor consumers use a public bundled stylesheet.
            if [[ "$tgz" == *studio-workflows-* || "$tgz" == *studio-code-editor-* ]]; then
              if ! grep -qx "package/dist/style.css" <<< "$contents"; then
                echo "  MISSING: package/dist/style.css in $tgz" >&2
                exit 1
              fi
            fi
            # No raw source may leak into the published tarball.
            if grep -q "^package/src/" <<< "$contents"; then
              echo "  LEAKED src/ into $tgz" >&2
              exit 1
            fi
            # Intra-monorepo dependencies must be ranges, never exact pins. An exact pin welds the
            # four packages into a set: a fix to one cannot ship without republishing the others,
            # and a consumer cannot take a newer dependency at all. prepare-npm-package.mjs emits a
            # caret; this is the gate that stops a regression to `deps[name] = versionArg`.
            manifest=$(tar -xzOf "$tgz" package/package.json)
            package_id=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name' <<< "$manifest")
            package_version=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' <<< "$manifest")
            actual_ids+=("$package_id")
            if [[ "$package_version" != "$VERSION" ]]; then
              echo "  VERSION MISMATCH in $tgz: expected $VERSION, got $package_version" >&2
              exit 1
            fi
            pinned=$(node -e '
              const pkg = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const bad = [];
              for (const group of ["dependencies", "peerDependencies", "optionalDependencies"])
                for (const [name, range] of Object.entries(pkg[group] ?? {}))
                  if (name.startsWith("@elsa-workflows/") && !/^[\^~>]/.test(range)) bad.push(name + "@" + range);
              process.stdout.write(bad.join(", "));
            ' <<< "$manifest")
            if [[ -n "$pinned" ]]; then
              echo "  EXACT-PINNED intra-monorepo dependency in $tgz: $pinned" >&2
              exit 1
            fi
          done
          expected_ids=$(printf '%s\n' \
            '@elsa-workflows/studio-sdk' \
            '@elsa-workflows/studio-ui' \
            '@elsa-workflows/studio-code-editor' \
            '@elsa-workflows/studio-workflows' | sort)
          actual_id_set=$(printf '%s\n' "${actual_ids[@]}" | sort)
          if [[ "$actual_id_set" != "$expected_ids" ]]; then
            echo "Unexpected npm package identities. Expected:" >&2
            printf '%s\n' "$expected_ids" >&2
            echo "Found:" >&2
            printf '%s\n' "$actual_id_set" >&2
            exit 1
          fi
          python3 ../tools/versioning/package-evidence/studio_archives.py packages/npm --write npm
          echo "All tarballs verified."

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-foundation-studio-npm-packages
          path: studio/packages/npm/
          overwrite: true

  attest:
    name: Select and attest the Studio release snapshot
    needs: [version, build, build_npm]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.publisher_gate == 'true'
      && needs.version.outputs.publish_target != 'none'
      && (needs.version.outputs.signed_snapshot || (needs.build.result == 'success' && needs.build_npm.result == 'success')) }}
    environment: studio-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      artifact_id: ${{ steps.save.outputs.artifact-id || steps.recover.outputs.id }}
      npm_receipt: ${{ steps.receipts.outputs.npm }}
      nuget_receipt: ${{ steps.receipts.outputs.nuget }}
      version: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check again for a snapshot saved by an interrupted signing job
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/versioning/package-evidence/studio_snapshot.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !steps.recover.outputs.id }}
        with:
          artifact-ids: ${{ needs.build_npm.outputs.artifact_id }}
          merge-multiple: true
          path: release/npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !steps.recover.outputs.id }}
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: release/nuget
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ steps.recover.outputs.id }}
        with:
          artifact-ids: ${{ steps.recover.outputs.id }}
          merge-multiple: true
          path: release
      - name: Verify the original release set before signing or resuming
        id: receipts
        env:
          SNAPSHOT: ${{ steps.recover.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for kind in npm nuget; do
            receipt="release/$kind/$kind-subjects.json"
            args=()
            if [[ -n "$SNAPSHOT" ]]; then
              gh attestation verify "$receipt" --repo "$GITHUB_REPOSITORY" --bundle release/producer.sigstore.json \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/studio-packages.yml" \
                --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
              args+=(--signed-retry)
            fi
            python3 tools/versioning/package-evidence/studio_archives.py "release/$kind" --check "$kind" "${args[@]}"
            echo "$kind=$(sha256sum "$receipt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done
      - name: Sign archive, inventory, NuGet payload and receipt digests
        if: ${{ !steps.recover.outputs.id }}
        id: sign
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/**/*.tgz
            release/**/*.nupkg
            release/**/*.cdx.json
            release/**/*.payload.json
            release/**/*-subjects.json
      - name: Retain the signature bundle with the immutable candidates
        if: ${{ !steps.recover.outputs.id }}
        env:
          BUNDLE: ${{ steps.sign.outputs.bundle-path }}
        run: cp "$BUNDLE" release/producer.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !steps.recover.outputs.id }}
        id: save
        with:
          name: studio-signed-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  # Publishes preview npm builds only after an explicit gated manual request.
  publish_npm_preview_feedz:
    name: Publish npm to feedz.io
    needs: attest
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ !cancelled() && needs.attest.result == 'success' && vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'feedz-preview'
      && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: ${{ env.npm_feed_feedz }}

      - uses: ./.github/actions/studio-signed-packages
        with:
          artifact-id: ${{ needs.attest.outputs.artifact_id }}
          kind: npm
          receipt-sha256: ${{ needs.attest.outputs.npm_receipt }}
          version: ${{ needs.attest.outputs.version }}

      - name: Publish verified tarballs in dependency order and check registry integrity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FEEDZ_API_KEY_BASE64 }}
        run: python3 ../tools/versioning/package-evidence/studio_publish_npm.py packages/npm "$npm_feed_feedz" --tag preview

  # Publishes a stable tagged version to npmjs.org only after an explicit gated request.
  publish_npm_release:
    name: Publish npm release to npmjs.org
    needs: attest
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ !cancelled() && needs.attest.result == 'success' && vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'public-release'
      && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: ${{ env.npm_feed_npm }}

      - uses: ./.github/actions/studio-signed-packages
        with:
          artifact-id: ${{ needs.attest.outputs.artifact_id }}
          kind: npm
          receipt-sha256: ${{ needs.attest.outputs.npm_receipt }}
          version: ${{ needs.attest.outputs.version }}

      - name: Publish verified tarballs in dependency order and check registry integrity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_KEY }}
        run: python3 ../tools/versioning/package-evidence/studio_publish_npm.py packages/npm "$npm_feed_npm" --tag latest

  verify_nuget_feed:
    name: Verify registry-served NuGet packages and attest the receipt
    needs: [attest, publish_preview_feedz, publish_nuget]
    if: ${{ !cancelled() && (needs.publish_preview_feedz.result == 'success' || needs.publish_nuget.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/studio-signed-packages
        with:
          artifact-id: ${{ needs.attest.outputs.artifact_id }}
          kind: nuget
          receipt-sha256: ${{ needs.attest.outputs.nuget_receipt }}
          version: ${{ needs.attest.outputs.version }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x
      - name: Read back the package set and verify payload and registry signatures
        env:
          FEED: ${{ inputs.publish_target == 'public-release' && env.nuget_feed_source || env.feedz_feed_source }}
        run: python3 ../tools/versioning/package-evidence/studio_nuget_feed.py packages/nuget packages/published "$FEED"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: studio/packages/published/nuget-feed-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-foundation-studio-nuget-feed-receipt-attempt-${{ github.run_attempt }}
          path: studio/packages/published/nuget-feed-receipt.json
