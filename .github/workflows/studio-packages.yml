name: Studio Packages (consolidated gated)

# Structural-consolidation replacement for Studio/.github/workflows/packages.yml.
# This workflow is manual-only. Build-only is the default; publication is inert until
# the old Studio publisher has been disabled and the repository variable below is
# explicitly enabled during the approved cutover. The Foundation `Packages` workflow
# remains the sole publisher for Foundation packages and its Docker consumer.
#
# Frontend (React/Vite) client assets are generated into each module's ignored wwwroot.
# Build them in this job before .NET build/test/pack so the NuGet packages contain the
# same host and RCL assets that the Studio Docker image ships.
#
# Alongside the NuGet packages, four workspace libraries are also published to npm as standalone
# deliverables (@elsa-workflows/studio-sdk, studio-ui, studio-code-editor, studio-workflows).
# On disk those packages stay `private: true` and export raw `src/` for the in-repo workspace
# dev flow; the `build_npm` job builds each one's `dist/` via `build:lib`, runs
# scripts/prepare-npm-package.mjs to rewrite each manifest into publishable shape (see that
# script for the why), then packs and publishes them — preview builds to the elsa-4 feedz.io npm
# feed on an explicitly requested preview, and the tagged version to npmjs.org on an
# explicitly requested stable release, in dependency order.

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Build only by default. Publishing requires the repository opt-in and a reviewed manual dispatch from main or a release tag.'
        type: choice
        options:
          - none
          - feedz-preview
          - public-release
        default: none
        required: true
      preview_version:
        description: 'Required for a main feedz-preview publish. Check both NuGet and all four npm published floors first; use a strictly higher 4.0.0-preview.N version.'
        type: string
        default: ''
        required: false

env:
  base_version: '4.0.0'
  feedz_feed_source: 'https://f.feedz.io/elsa-workflows/elsa-4/nuget/index.json'
  nuget_feed_source: 'https://api.nuget.org/v3/index.json'
  npm_feed_feedz: 'https://f.feedz.io/elsa-workflows/elsa-4/npm/'
  npm_feed_npm: 'https://registry.npmjs.org/'

permissions:
  contents: read

concurrency:
  group: studio-packages-${{ inputs.publish_target }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: Studio

jobs:
  version:
    name: Validate publication request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_target: ${{ steps.version.outputs.publish_target }}
      publisher_gate: ${{ steps.version.outputs.publisher_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate request and compute the existing Studio version
        id: version
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target }}
          PREVIEW_VERSION: ${{ inputs.preview_version }}
          PUBLISHING_ENABLED: ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/tags/*:refs/tags/*

          if [[ "$PUBLISH_TARGET" != "none" && "$PUBLISHING_ENABLED" != "true" ]]; then
            echo "::error::Publishing was requested, but ELSA_STUDIO_CONSOLIDATED_PUBLISHING is not true."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Studio package tags must point to a commit reachable from main."
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^4\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Expected a v4 semver tag; got $GITHUB_REF_NAME."
              exit 1
            fi
            if [[ "$PUBLISH_TARGET" == "public-release" && "$VERSION" == *-* ]]; then
              echo "::error::Public-release publishing requires a stable v4 tag without a prerelease suffix."
              exit 1
            fi
            if [[ "$PUBLISH_TARGET" == "feedz-preview" && "$VERSION" != *-* ]]; then
              echo "::error::Feedz preview publishing from a tag requires a prerelease version."
              exit 1
            fi
          else
            BRANCH_NAME="$GITHUB_REF_NAME"
            PACKAGE_PREFIX="$(printf '%s' "$BRANCH_NAME" | awk -F/ '{print $NF}' | tr '_' '-')"
            if [[ "$BRANCH_NAME" == "main" ]]; then
              PACKAGE_PREFIX="preview"
              if [[ "$PUBLISH_TARGET" == "feedz-preview" ]]; then
                if [[ ! "$PREVIEW_VERSION" =~ ^4\.0\.0-preview\.[0-9]+$ ]]; then
                  echo "::error::Main preview publishing requires preview_version in the form 4.0.0-preview.N. Compare the published NuGet and npm floors first."
                  exit 1
                fi
                VERSION="$PREVIEW_VERSION"
              else
                VERSION="${base_version}-${PACKAGE_PREFIX}.${GITHUB_RUN_NUMBER}"
              fi
            elif [[ "$PUBLISH_TARGET" != "none" ]]; then
              echo "::error::Studio publishing from a branch is allowed only on main."
              exit 1
            else
              VERSION="${base_version}-${PACKAGE_PREFIX}.${GITHUB_RUN_NUMBER}"
            fi
          fi

          if [[ "$PUBLISH_TARGET" == "public-release" && "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Public-release publishing requires a manual dispatch from a 4.x release tag (with optional leading v)."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "publish_target=$PUBLISH_TARGET"
            echo "publisher_gate=$PUBLISHING_ENABLED"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Studio package version: $VERSION."
            if [[ "$PUBLISH_TARGET" == "none" ]]; then
              echo "Publication target: none (build-only)."
            else
              echo "Publication target: $PUBLISH_TARGET (repository opt-in enabled)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Studio/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Studio/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Studio host and RCL frontend assets
        run: pnpm build

      - name: Verify generated Studio host and RCL assets
        run: python3 ../tools/ci/verify-studio-assets.py --root ..

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Elsa.Studio.slnx -p:WarningsNotAsErrors=NU1603

      - name: Build
        run: dotnet build Elsa.Studio.slnx -c Release --no-restore "/p:Version=$VERSION" -p:WarningsNotAsErrors=NU1603

      - name: Test
        run: dotnet test Elsa.Studio.slnx -c Release --no-build "/p:Version=$VERSION"

      - name: Pack
        run: dotnet pack Elsa.Studio.slnx -c Release --no-build "/p:Version=$VERSION" -p:WarningsNotAsErrors=NU1603 "-p:PackageOutputPath=$(pwd)/packages/nuget"

      - name: Verify exact Studio NuGet package set
        run: python3 ../tools/ci/verify_studio_nuget_packages.py --root .. --packages packages/nuget --version "$VERSION"

      - name: Write Studio artifact provenance
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target }}
          PUBLISHING_ENABLED: ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("packages/nuget/studio-package-build.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "Studio Packages (consolidated gated)",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "ref": os.environ["GITHUB_REF"],
              "commit": os.environ["GITHUB_SHA"],
              "version": os.environ["VERSION"],
              "publish_target": os.environ["PUBLISH_TARGET"],
              "publisher_gate_enabled": os.environ["PUBLISHING_ENABLED"] == "true",
          }, indent=2) + "\n")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elsa-foundation-studio-nuget-packages
          path: Studio/packages/nuget/

  publish_preview_feedz:
    name: Publish to feedz.io
    needs: [build, build_npm]
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'feedz-preview'
      && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-studio-nuget-packages
          path: Studio/packages/nuget

      - name: Publish to feedz.io
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
        run: dotnet nuget push packages/nuget/*.nupkg -k "$FEEDZ_API_KEY" -s "$feedz_feed_source" --skip-duplicate

  publish_nuget:
    name: Publish release to nuget.org
    needs: [build, build_npm]
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'public-release'
      && github.ref_type == 'tag' }}
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-studio-nuget-packages
          path: Studio/packages/nuget

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push packages/nuget/*.nupkg -k "$NUGET_API_KEY" -s "$nuget_feed_source" --skip-duplicate

  # Builds, packs and verifies the four npm workspace libraries. Runs in parallel with the NuGet
  # `build` job on the same triggers, sharing the identical versioning scheme.
  build_npm:
    name: Build npm packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up BEFORE setup-node so that `cache: pnpm` can find the pnpm binary.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Studio/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the four publishable libraries (each produces dist/index.js + dist/index.d.ts,
      # plus dist/tokens.css for studio-ui and dist/style.css for studio-workflows).
      - name: Build libraries
        run: >-
          pnpm
          --filter @elsa-workflows/studio-sdk
          --filter @elsa-workflows/studio-ui
          --filter @elsa-workflows/studio-code-editor
          --filter @elsa-workflows/studio-workflows
          run build:lib

      # Rewrite each on-disk (private, src-pointing) manifest into publishable shape. See
      # scripts/prepare-npm-package.mjs for why this can't be done with publishConfig alone.
      - name: Prepare npm manifests
        run: |
          for dir in \
            src/apps/Elsa.Studio.Web/StudioSdk \
            src/apps/Elsa.Studio.Web/StudioUi \
            src/essentials/Elsa.Studio.CodeEditor/Client \
            src/essentials/Elsa.Studio.Workflows/Client; do
            node scripts/prepare-npm-package.mjs "$dir" "$VERSION"
          done

      # Pack each package into packages/npm. `pnpm pack` writes the tarball relative to the
      # package dir by default, so we pin the destination to an absolute path shared by all four.
      - name: Pack packages
        run: |
          mkdir -p packages/npm
          DEST="$(pwd)/packages/npm"
          for dir in \
            src/apps/Elsa.Studio.Web/StudioSdk \
            src/apps/Elsa.Studio.Web/StudioUi \
            src/essentials/Elsa.Studio.CodeEditor/Client \
            src/essentials/Elsa.Studio.Workflows/Client; do
            (cd "$dir" && pnpm pack --pack-destination "$DEST")
          done

      # Guard against shipping a tarball that points at src/ or is missing its built output.
      - name: Verify tarball contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(packages/npm/*.tgz)
          if [[ ${#tarballs[@]} -ne 4 ]]; then
            echo "Expected exactly four npm package tarballs, found ${#tarballs[@]}" >&2
            exit 1
          fi
          actual_ids=()
          for tgz in "${tarballs[@]}"; do
            echo "Verifying $tgz"
            contents=$(tar -tzf "$tgz")
            # Every package must ship its built entry point and types.
            for required in package/dist/index.js package/dist/index.d.ts; do
              if ! grep -qx "$required" <<< "$contents"; then
                echo "  MISSING: $required in $tgz" >&2
                exit 1
              fi
            done
            # studio-ui must additionally ship its design tokens.
            if [[ "$tgz" == *studio-ui-* ]]; then
              if ! grep -qx "package/dist/tokens.css" <<< "$contents"; then
                echo "  MISSING: package/dist/tokens.css in $tgz" >&2
                exit 1
              fi
            fi
            # studio-workflows must additionally ship its bundled stylesheet.
            if [[ "$tgz" == *studio-workflows-* ]]; then
              if ! grep -qx "package/dist/style.css" <<< "$contents"; then
                echo "  MISSING: package/dist/style.css in $tgz" >&2
                exit 1
              fi
            fi
            # No raw source may leak into the published tarball.
            if grep -q "^package/src/" <<< "$contents"; then
              echo "  LEAKED src/ into $tgz" >&2
              exit 1
            fi
            # Intra-monorepo dependencies must be ranges, never exact pins. An exact pin welds the
            # four packages into a set: a fix to one cannot ship without republishing the others,
            # and a consumer cannot take a newer dependency at all. prepare-npm-package.mjs emits a
            # caret; this is the gate that stops a regression to `deps[name] = versionArg`.
            manifest=$(tar -xzOf "$tgz" package/package.json)
            package_id=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name' <<< "$manifest")
            package_version=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' <<< "$manifest")
            actual_ids+=("$package_id")
            if [[ "$package_version" != "$VERSION" ]]; then
              echo "  VERSION MISMATCH in $tgz: expected $VERSION, got $package_version" >&2
              exit 1
            fi
            pinned=$(node -e '
              const pkg = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const bad = [];
              for (const group of ["dependencies", "peerDependencies", "optionalDependencies"])
                for (const [name, range] of Object.entries(pkg[group] ?? {}))
                  if (name.startsWith("@elsa-workflows/") && !/^[\^~>]/.test(range)) bad.push(name + "@" + range);
              process.stdout.write(bad.join(", "));
            ' <<< "$manifest")
            if [[ -n "$pinned" ]]; then
              echo "  EXACT-PINNED intra-monorepo dependency in $tgz: $pinned" >&2
              exit 1
            fi
          done
          expected_ids=$(printf '%s\n' \
            '@elsa-workflows/studio-sdk' \
            '@elsa-workflows/studio-ui' \
            '@elsa-workflows/studio-code-editor' \
            '@elsa-workflows/studio-workflows' | sort)
          actual_id_set=$(printf '%s\n' "${actual_ids[@]}" | sort)
          if [[ "$actual_id_set" != "$expected_ids" ]]; then
            echo "Unexpected npm package identities. Expected:" >&2
            printf '%s\n' "$expected_ids" >&2
            echo "Found:" >&2
            printf '%s\n' "$actual_id_set" >&2
            exit 1
          fi
          echo "All tarballs verified."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elsa-foundation-studio-npm-packages
          path: Studio/packages/npm/*.tgz

  # Publishes preview npm builds only after an explicit gated manual request.
  publish_npm_preview_feedz:
    name: Publish npm to feedz.io
    needs: [build, build_npm]
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'feedz-preview'
      && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ env.npm_feed_feedz }}

      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-studio-npm-packages
          path: Studio/packages/npm

      # Publish IN DEPENDENCY ORDER (sdk -> ui -> code-editor -> workflows) so each package's
      # intra-monorepo deps already exist on the feed. We order explicitly by filename pattern
      # rather than relying on glob order.
      - name: Publish to feedz.io
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FEEDZ_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for pattern in studio-sdk studio-ui studio-code-editor studio-workflows; do
            for file in packages/npm/*"$pattern"-*.tgz; do
              echo "Publishing $file"
              npm publish "$file" --access public --tag preview
            done
          done

  # Publishes a stable tagged version to npmjs.org only after an explicit gated request.
  publish_npm_release:
    name: Publish npm release to npmjs.org
    needs: [build, build_npm]
    environment: studio-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ vars.ELSA_STUDIO_CONSOLIDATED_PUBLISHING == 'true'
      && inputs.publish_target == 'public-release'
      && github.ref_type == 'tag' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ env.npm_feed_npm }}

      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: elsa-foundation-studio-npm-packages
          path: Studio/packages/npm

      # Publish IN DEPENDENCY ORDER (sdk -> ui -> code-editor -> workflows). A prerelease tag
      # (any version containing a '-' suffix, e.g. 4.0.0-preview.1) is published under the
      # `preview` dist-tag so it never becomes `latest`; a clean release omits the flag.
      # This job doesn't run the Set VERSION step, so we derive the version from the release tag
      # (GITHUB_REF_NAME, e.g. v4.0.0) here purely to decide the dist-tag.
      - name: Publish to npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_TAG"
          VERSION=${VERSION#v}
          TAG_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            TAG_ARGS=(--tag preview)
          fi
          for pattern in studio-sdk studio-ui studio-code-editor studio-workflows; do
            for file in packages/npm/*"$pattern"-*.tgz; do
              echo "Publishing $file"
              npm publish "$file" --access public "${TAG_ARGS[@]}"
            done
          done
