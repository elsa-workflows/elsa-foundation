name: CI

# Build-and-test gate for pull requests targeting main, and for main itself.
#
# Neither existing workflow guards PRs:
#   - docker.yml   runs on push to main only.
#   - packages.yml runs on push to feat/*|fix/*|bug/*|... (not pull_request, not
#     claude/*) and deliberately packs/compiles only the src/ libraries -- it does
#     NOT build test projects or run tests.
# Net result: PRs could merge to main with compile errors or failing tests undetected.
# This bit in PR #543: a semantic merge conflict between #539 and #541 that compiled
# on each branch but not when combined (HashMismatchTests.cs referenced
# ActivityVersionHashMismatchException.Version, removed by #539).
#
# This workflow builds the FULL solution -- including test projects, which is what
# catches semantic-merge compile breaks -- then runs the fast unit tests only.
# The Testcontainers-based integration tests (which need Docker) are intentionally
# excluded here so no containers start; a full integration/nightly gate is a separate
# follow-up. See issue #544.
#
# "Build & test" IS a required status check on main. Branch protection matches the context
# by JOB name, not by workflow file, so the job names below are load-bearing and must not be
# renamed. Note that `enforce_admins` is off, so a required check is a speed bump for an
# admin rather than a wall -- which is the hole the push trigger below covers.
#
# TRIGGERS
#   - pull_request: the merge gate. Unchanged behavior.
#   - push to main: reports post-merge breakage AGAINST MAIN. Until PR #1302 this ran on
#     pull_request only, so nothing ever evaluated main itself. On 2026-08-12 PR #1270 was
#     force-merged at 00:20Z with three checks red and this very job still pending; main was
#     then left unable to activate the Workbench at all, with HistoricalSchemaUpgradeTests
#     failing 8 of 8, and showed all-green for about nine hours because every workflow that
#     did run on push (Maps, Packages, Docker Images, Code Quality) is blind to test results.
#     That test project references no Testcontainers, so it sits inside the container-free
#     filter below and this job would have gone red on the merge commit within ~13 minutes.
#   - workflow_dispatch: re-run on demand after a fix, without pushing an empty commit.
#
# The push run is deliberately the SAME job, not a scoped-down variant. Scoping it would mean
# a second job name (the required-check context is tied to this one) and a second thing to
# keep in step with the PR gate, in exchange for saving one run per merge. This workflow takes
# ~13 minutes end to end, measured over its recent successful runs; every push to main already
# pays ~8-10 for Docker Images, which builds two multi-platform images, and ~3 for Packages.
# Those run in parallel with this one, so the answer to "is main broken" arrives ~13 minutes
# after a merge and the merge itself is not held up by any of it.
#
# Blocking is not available on push: the commit has already landed. A red run on main is a
# request to fix forward or revert; the alert job at the bottom makes sure someone is told.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer head supersedes only its own PR. Main and manual runs keep every full-matrix proof.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Generate container-free test solution filter
        # Run the fast unit tests only. Any test project that reaches Testcontainers spins up
        # Docker containers, so exclude those by reference -- the shared solution-filter generator
        # parses PackageReference elements rather than matching comments or other raw text, and
        # follows ProjectReference edges so a project that only inherits the package from another
        # test project is excluded too.
        run: |
          container_roots_file=$(mktemp)
          trap 'rm -f "$container_roots_file"' EXIT
          dotnet run --project tools/maps/Elsa.Maps.Generator -c Release -v:q -- \
            solution-filter-roots Elsa.Server.Persistence.Integration.slnf \
            > "$container_roots_file"

          declare -A container_tests=()
          while IFS= read -r p; do
            container_tests["$p"]=1
          done < "$container_roots_file"
          if (( ${#container_tests[@]} == 0 )); then
            echo "::error::No Testcontainers roots found; refusing to build an unsafe fast-test filter."
            exit 1
          fi

          keep=()
          while IFS= read -r p; do
            if [[ -z "${container_tests[$p]+x}" ]]; then
              keep+=("$p")
            fi
          done < <({ find tests -name '*.csproj'
                     find src -path '*/tests/*' -name '*.csproj'; } | sort)
          if (( ${#keep[@]} == 0 )); then
            echo "::error::No container-free test projects found; refusing to run an empty fast-test filter."
            exit 1
          fi
          projects=$(printf '"%s",' "${keep[@]}" | sed 's/,$//')
          printf '{"solution":{"path":"Elsa.Server.slnx","projects":[%s]}}' "$projects" > Elsa.Server.test.slnf
          echo "Kept ${#keep[@]} test project(s) in the container-free filter."

      - name: Restore
        # Includes the isolated Debug dependency graph required by the Architecture
        # tests in the container-free filter while preserving ordinary Release assets.
        run: bash tools/architecture/restore-ci-project-graph.sh -p:WarningsNotAsErrors=NU1603

      - name: Restore repository-local .NET tools
        run: dotnet tool restore

      - name: Build (full solution, including test projects)
        # Building the whole solution -- test projects included -- is what catches
        # semantic-merge compile breaks like #543.
        run: dotnet build Elsa.Server.slnx -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      # The IAM native-query-plan capture and its artifact upload were retired with performance
      # measurement (#1668, ADR 0073); the upload's if-no-files-found: error would otherwise fail
      # this job now that no test writes a plan.
      - name: Test (fast unit tests, no containers)
        run: dotnet test Elsa.Server.test.slnf -c Release --no-build -p:WarningsNotAsErrors=NU1603

  # The manifest is the single suite list; the selector uses the validated solution-reference
  # graph to run affected legs on PRs, and selects every leg on main and manual dispatch.
  select-ef-suites:
    name: Select EF suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Checkout full history for the PR diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Verify selector contract
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release -v:q -- ef-suites-self-test

      - name: Select affected suites
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          selection=$(dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- ef-suites-select "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
          {
            echo "matrix=$(jq -c '.matrix' <<< "$selection")"
            echo "count=$(jq -r '.count' <<< "$selection")"
            echo "mode=$(jq -r '.mode' <<< "$selection")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### EF container selection"
            echo "Mode: $(jq -r '.mode' <<< "$selection")"
            echo "Reason: $(jq -r '.reason' <<< "$selection")"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $(jq -r '.count' <<< "$selection") == 0 ]]; then
            echo "No EF container suites selected." >> "$GITHUB_STEP_SUMMARY"
          else
            jq -r '.matrix.include[].suite | "- " + .' <<< "$selection" >> "$GITHUB_STEP_SUMMARY"
          fi

  ef-container-suites:
    name: EF container suites (${{ matrix.suite }})
    needs: select-ef-suites
    if: ${{ needs.select-ef-suites.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-ef-suites.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Arm the suite's required-provider mode
        if: ${{ matrix.require != '' }}
        run: echo "${{ matrix.require }}=1" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore ${{ matrix.project }} -p:WarningsNotAsErrors=NU1603

      - name: Test
        run: dotnet test ${{ matrix.project }} -c Release --no-restore -p:WarningsNotAsErrors=NU1603

  # Stable result for branch rules and reviewers, including an explicit no-impact PR.
  ef-container-result:
    name: EF container suites
    if: ${{ always() }}
    needs: [select-ef-suites, ef-container-suites, secrets-ef-composition]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected suite results
        env:
          SELECT_RESULT: ${{ needs.select-ef-suites.result }}
          SUITES_RESULT: ${{ needs.ef-container-suites.result }}
          SECRETS_RESULT: ${{ needs.secrets-ef-composition.result }}
          COUNT: ${{ needs.select-ef-suites.outputs.count }}
          MODE: ${{ needs.select-ef-suites.outputs.mode }}
        run: |
          if [[ "$SELECT_RESULT" != success ]]; then
            echo "::error::EF suite selection failed; this is not a no-impact PR."
            exit 1
          fi
          if [[ "$SECRETS_RESULT" != success ]]; then
            echo "::error::The always-run Secrets EF host proof did not pass."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$MODE" != full ]]; then
            echo "::error::Main and manual runs must select the full EF matrix."
            exit 1
          fi
          if [[ "$COUNT" == 0 && "$SUITES_RESULT" == skipped ]]; then
            echo "No EF suite impact; selection succeeded."
            exit 0
          fi
          if [[ "$COUNT" =~ ^[1-9][0-9]*$ && "$SUITES_RESULT" == success ]]; then
            echo "All $COUNT selected EF suites passed."
            exit 0
          fi
          echo "::error::EF suites did not pass (count=$COUNT, result=$SUITES_RESULT)."
          exit 1

  # Secrets EF composition on a native PostgreSQL: configuration-driven CShells composition,
  # migration/validation, CRUD/OCC, runtime resolution, restart persistence and the packed-module
  # child-host proof. Kept separate from the provider matrix because it boots a real shell.
  secrets-ef-composition:
    name: Secrets EF composition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Start PostgreSQL for the Secrets EF shell proof
        run: |
          docker run --detach --name secrets-ef-postgresql --publish 5432:5432 \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17.6-alpine3.22
          for attempt in {1..60}; do
            if docker exec secrets-ef-postgresql pg_isready -U postgres > /dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs secrets-ef-postgresql
              exit 1
            fi
            sleep 1
          done

      - name: Restore the Secrets EF PostgreSQL shell proof
        run: dotnet restore tests/essentials/Secrets/Persistence/EntityFrameworkCore/PostgreSql/Tests/Elsa.Secrets.Persistence.EntityFrameworkCore.PostgreSql.Tests.csproj -p:WarningsNotAsErrors=NU1603

      # Configuration-driven CShells composition, migration/validation, CRUD/OCC, runtime
      # resolution, restart persistence, and the packed-module child-host proof. Npgsql is
      # the only relational provider package in this project.
      - name: Prove Secrets EF composition on PostgreSQL
        env:
          ELSA_SECRETS_EF_POSTGRESQL_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Username=postgres;Database=postgres
        run: >-
          dotnet test
          tests/essentials/Secrets/Persistence/EntityFrameworkCore/PostgreSql/Tests/Elsa.Secrets.Persistence.EntityFrameworkCore.PostgreSql.Tests.csproj
          -c Release --no-restore
          -p:WarningsNotAsErrors=NU1603

  # Container-free architecture guards (dependency direction, endpoint security, feature
  # composition, the EF dependency allowlist, and the fail-closed guard that keeps the retired
  # persistence family out of the tree). The whole project runs so a renamed or newly added guard
  # cannot silently fall out of a brittle test filter. The spec 094 coverage-ledger and
  # benchmark-evidence suites that once ran beside it were retired with performance
  # measurement (#1668).
  architecture-guards:
    name: Architecture guards
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore the evaluated source dependency graphs
        run: bash tools/architecture/restore-ci-project-graph.sh -p:WarningsNotAsErrors=NU1603

      - name: Run the architecture guards
        run: dotnet test tests/essentials/Architecture/Elsa.Architecture.Tests.csproj -c Release --no-restore -p:WarningsNotAsErrors=NU1603

  # Issue #1815 separates required modules from optional ones. This leg is what makes that
  # separation mean something: it builds and tests ONLY the core, so a dependency from core into
  # an optional module fails here even when the full solution is perfectly happy.
  #
  # The filter is generated from tools/solution-filters/profiles.json by expanding the dependency
  # closure of the named core roots, so it cannot drift: add a core-to-extension reference and the
  # closure grows, the committed .slnf stops matching, and the "Solution filters" workflow goes red
  # alongside this one.
  #
  # The ExtensionBoundary guard that enforces the rule directly also runs inside "Build & test",
  # because it lives under tests/ and references no Testcontainers, so it is already covered by a
  # required check. This job adds the thing that guard cannot prove on its own: that the core
  # actually compiles and passes its tests with every optional module absent.
  core-only:
    name: Core-only build & test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Elsa.Server.Core.slnf -p:WarningsNotAsErrors=NU1603

      - name: Build (core only)
        run: dotnet build Elsa.Server.Core.slnf -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      - name: Test (core only)
        run: dotnet test Elsa.Server.Core.slnf -c Release --no-build -p:WarningsNotAsErrors=NU1603

  # A red main has to reach a human. GitHub's own failure notification for a push does go to
  # whoever pushed, which is a better channel than the one the nightly uses -- but on
  # 2026-08-12 the pusher was the person who had just merged through three red checks, so it
  # is not a channel to rely on alone. This files or updates one deduplicated issue as well.
  alert:
    name: Alert on a red main
    needs:
      - build-and-test
      - ef-container-result
      - architecture-guards
      - core-only
    if: ${{ failure() && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/main-red-alert.yml
    with:
      gate: CI

  # The "Generated maps fresh" job moved to maps.yml (issue #1274). It needed a push-to-main
  # trigger as well, and this workflow was the pull_request gate at the time; both triggers now
  # live here too, but the job stays in maps.yml. Its name is unchanged, so the required status
  # check of that name still reports.
