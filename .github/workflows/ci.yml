name: CI

# Build-and-test gate for pull requests targeting main, and for main itself.
#
# Neither existing workflow guards PRs:
#   - docker.yml   runs on push to main only.
#   - packages.yml runs on push to feat/*|fix/*|bug/*|... (not pull_request, not
#     claude/*) and deliberately packs/compiles only the src/ libraries -- it does
#     NOT build test projects or run tests.
# Net result: PRs could merge to main with compile errors or failing tests undetected.
# This bit in PR #543: a semantic merge conflict between #539 and #541 that compiled
# on each branch but not when combined (HashMismatchTests.cs referenced
# ActivityVersionHashMismatchException.Version, removed by #539).
#
# This workflow builds the FULL solution -- including test projects, which is what
# catches semantic-merge compile breaks -- then runs the fast unit tests only.
# The Testcontainers-based integration tests (which need Docker) are intentionally
# excluded here so no containers start; a full integration/nightly gate is a separate
# follow-up. See issue #544.
#
# "Build & test" IS a required status check on main. Branch protection matches the context
# by JOB name, not by workflow file, so the job names below are load-bearing and must not be
# renamed. Note that `enforce_admins` is off, so a required check is a speed bump for an
# admin rather than a wall -- which is the hole the push trigger below covers.
#
# TRIGGERS
#   - pull_request: the merge gate. Unchanged behavior.
#   - push to main: reports post-merge breakage AGAINST MAIN. Until PR #1302 this ran on
#     pull_request only, so nothing ever evaluated main itself. On 2026-08-12 PR #1270 was
#     force-merged at 00:20Z with three checks red and this very job still pending; main was
#     then left unable to activate the Workbench at all, with HistoricalSchemaUpgradeTests
#     failing 8 of 8, and showed all-green for about nine hours because every workflow that
#     did run on push (Maps, Packages, Docker Images, Code Quality) is blind to test results.
#     That test project references no Testcontainers, so it sits inside the container-free
#     filter below and this job would have gone red on the merge commit within ~13 minutes.
#   - workflow_dispatch: re-run on demand after a fix, without pushing an empty commit.
#
# The push run is deliberately the SAME job, not a scoped-down variant. Scoping it would mean
# a second job name (the required-check context is tied to this one) and a second thing to
# keep in step with the PR gate, in exchange for saving one run per merge. This workflow takes
# ~13 minutes end to end, measured over its recent successful runs; every push to main already
# pays ~8-10 for Docker Images, which builds two multi-platform images, and ~3 for Packages.
# Those run in parallel with this one, so the answer to "is main broken" arrives ~13 minutes
# after a merge and the merge itself is not held up by any of it.
#
# Blocking is not available on push: the commit has already landed. A red run on main is a
# request to fix forward or revert; the alert job at the bottom makes sure someone is told.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Generate container-free test solution filter
        # Run the fast unit tests only. Any test project that references
        # Testcontainers spins up Docker containers, so exclude those by reference --
        # this is self-maintaining (new Testcontainers projects are auto-excluded) and
        # provably starts no containers. Every other test project is kept.
        run: |
          keep=()
          while IFS= read -r p; do
            grep -q "Testcontainers" "$p" || keep+=("$p")
          done < <(find tests -name '*.csproj' | sort)
          projects=$(printf '"%s",' "${keep[@]}" | sed 's/,$//')
          printf '{"solution":{"path":"Elsa.Server.slnx","projects":[%s]}}' "$projects" > Elsa.Server.test.slnf
          echo "Kept ${#keep[@]} test project(s) in the container-free filter."

      - name: Restore
        run: dotnet restore Elsa.Server.slnx -p:WarningsNotAsErrors=NU1603

      - name: Restore repository-local .NET tools
        run: dotnet tool restore

      - name: Build (full solution, including test projects)
        # Building the whole solution -- test projects included -- is what catches
        # semantic-merge compile breaks like #543.
        run: dotnet build Elsa.Server.slnx -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      - name: Test (fast unit tests, no containers)
        run: dotnet test Elsa.Server.test.slnf -c Release --no-build -p:WarningsNotAsErrors=NU1603

  # Feature 094 container-free ratchets. The whole architecture project runs so a
  # renamed or newly added gate cannot silently fall out of a brittle test filter.
  groundwork-fast:
    name: Groundwork fast gates
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GROUNDWORK_LEDGER_BASE_REF used to be a job-level env set straight from
      # github.event.pull_request.base.sha, which is empty on push and workflow_dispatch.
      # GroundworkCoverageLedgerTransitionTests skips itself on an empty value but treats an
      # unresolvable one as a hard finding ("checkout must fetch immutable baseline history"),
      # so the push baseline has to be validated rather than assumed: it is better for the
      # transition guard alone to opt out than for the whole architecture job -- EF ratchet,
      # continuity and dependency gates included -- to go red on a baseline artifact.
      #
      # On push the baseline is github.event.before, the commit main pointed at before this
      # push, which is exactly what the landed change transitioned FROM. main forbids force
      # pushes and deletions, so that commit is always a reachable ancestor here and never the
      # all-zero branch-creation sha; both are still screened out, because this job should not
      # be the thing that discovers a branch-protection setting was relaxed.
      - name: Resolve the coverage-ledger baseline commit
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${PULL_REQUEST_BASE_SHA:-$PUSH_BEFORE_SHA}"
          case "$base" in
            *[!0]*) ;;     # holds a non-zero character, so it is a real sha
            *) base="" ;;  # empty (workflow_dispatch), or the all-zero sha
          esac
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::Coverage-ledger baseline $base is not reachable in this checkout; the transition guard will skip."
            base=""
          fi
          if [ -z "$base" ]; then
            echo "No coverage-ledger baseline; the transition guard skips, every other ratchet still runs."
          else
            echo "Coverage-ledger baseline: $base"
          fi
          echo "GROUNDWORK_LEDGER_BASE_REF=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The EF surface ratchet inspects project.assets.json for every repository project, not only
      # the architecture test dependency graph. Restore the full solution so the gate fails closed
      # on real missing assets instead of a deliberately partial restore.
      - name: Restore repository graph for architecture ratchets
        run: dotnet restore Elsa.Server.slnx -p:WarningsNotAsErrors=NU1603

      - name: Validate Groundwork ledger, continuity, dependency, and EF ratchets
        run: dotnet test tests/Elsa/Architecture/Elsa.Architecture.Tests.csproj -c Release --no-restore -p:WarningsNotAsErrors=NU1603

  # A red main has to reach a human. GitHub's own failure notification for a push does go to
  # whoever pushed, which is a better channel than the one the nightly uses -- but on
  # 2026-08-12 the pusher was the person who had just merged through three red checks, so it
  # is not a channel to rely on alone. This files or updates one deduplicated issue as well.
  alert:
    name: Alert on a red main
    needs:
      - build-and-test
      - groundwork-fast
    if: ${{ failure() && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/main-red-alert.yml
    with:
      gate: CI

  # The "Generated maps fresh" job moved to maps.yml (issue #1274). It needed a push-to-main
  # trigger as well, and this workflow was the pull_request gate at the time; both triggers now
  # live here too, but the job stays in maps.yml. Its name is unchanged, so the required status
  # check of that name still reports.
