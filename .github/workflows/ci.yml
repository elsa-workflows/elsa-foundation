name: CI

# All source validation lives here; publishing and trusted maintenance have separate tokens.
# Required check names stay stable. Marking a PR ready runs the gate, the maps and the stubs in one suite;
# splitting the required contexts across draft/ready suites can block protected merges (#3708).
# Focused manual runs select a suite below.
# Path filters live in tools/ci/workflow-paths.json and are applied by plan-scope.
# Pull requests to an initiative branch (docs/contributing/initiatives.md) run exactly what a pull request to main runs,
# diffed against the initiative branch: the same tier selection and the same documentation-only fast path.
#
# Lean CI (owner-approved 20 Nov 2026): a pull request and a push to main run one gate, `Build & test`: the PR-tier
# shards, Architecture guards, Core-only, Generated maps and, when Studio changed, the Studio frontend checks. Every
# heavy suite (the integration and EF container shards, the Studio browser, .NET and composed UX proofs, the backend
# source journeys, the Weaver witness, the published-image pair and the shuffled Workflows tests) runs in the nightly
# schedule below and on a manual run (suite and tier inputs), never on a pull request or a push. `alert` files one
# issue per failing nightly suite. `Full tier` and `Generated maps fresh` are pass-through stubs that keep the two
# required contexts reporting until ruleset main-2 drops them.
# Task-specific local visual acceptance remains part of each visible change's review.
#
# The standalone kernel model (prototypes/kernel-model, issue #4229) has its own gate here, folded in from the former
# kernel-prototype.yml: `Kernel prototype gate` runs on a pull request that changes the kernel model, the gate script
# or this workflow (plan-scope's `kernel` output), and the `Kernel prototype nightly` jobs run on the nightly schedule.
# None of them is a required check.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'initiative/**'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      # FR-008: the one way to run the full tier early, on any branch, a draft's head included. The literals "tier"
      # and "full" are what docs/contributing/merging.md#ci-tiers documents; test_tiers.py check-docs keeps them in step.
      suite:
        description: Validation to run
        type: choice
        # kernel-gate and kernel-nightly run only the kernel prototype's gate or its nightly jobs.
        options: [ci, studio, backend-source, weaver, published-images, studio-order, kernel-gate, kernel-nightly]
        default: ci
      tier:
        description: Which tier to run
        type: choice
        options: [full, pr]
        default: full
  schedule:
    # 02:41 UTC daily. Odd minute to avoid the top-of-hour scheduler surge.
    - cron: '41 2 * * *'

permissions:
  contents: read

# PR updates cancel the superseded head. Main finishes its active run and keeps only the
# newest pending push in the same group, so a stream of merges cannot restart validation
# indefinitely. Intermediate pending pushes are replaced by the latest one; plan-scope then diffs the latest push from
# the last push run that ran, so the replaced pushes' changes still select their focused proofs (#4713). Manual and
# scheduled runs keep their own groups. A cancelled run is not a failure, and the aggregate jobs use !cancelled() so
# cancellation does not file a red-main issue.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && format('ci-push-{0}', github.ref)
    || github.event_name == 'merge_group' && format('ci-merge-group-{0}', github.ref)
    || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan-scope:
    name: Select focused validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A push to main diffs from the head of the last push run whose focused proofs ran, not from the event's `before`:
    # a pending run replaced by a newer push, or a [skip ci] head, validates nothing, and its change would otherwise
    # never reach a path filter (#4713). Reading the earlier runs needs actions: read.
    permissions:
      contents: read
      actions: read
    outputs:
      weaver: ${{ steps.scope.outputs.weaver }}
      studio: ${{ steps.scope.outputs.studio }}
      studio-heavy: ${{ steps.scope.outputs.studio-heavy }}
      studio-ux: ${{ steps.scope.outputs.studio-ux }}
      heavy: ${{ steps.scope.outputs.heavy }}
      published-images: ${{ steps.scope.outputs.published-images }}
      studio-order: ${{ steps.scope.outputs.studio-order }}
      package-evidence: ${{ steps.scope.outputs.package-evidence }}
      backend-source: ${{ steps.scope.outputs.backend-source }}
      kernel: ${{ steps.kernel.outputs.kernel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select jobs from the event and changed paths
        id: scope
        env:
          CI_FULL_TIER_EVERY_PUSH: ${{ vars.CI_FULL_TIER_EVERY_PUSH }}
          # Only a push reads the earlier runs; pull request code gets no token here.
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: python3 tools/ci/workflow_scope.py
      # The kernel prototype gate's path filter, the former kernel-prototype.yml's `paths`. A pull request diffs from the
      # first parent of the merge commit GitHub tests (as change_scope.py does); a diff it cannot read runs the gate.
      - name: Select the kernel prototype gate
        id: kernel
        run: |
          kernel=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if ! changed=$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA"); then
              kernel=true
            elif grep -Eq '^(prototypes/kernel-model/|server/apps/Elsa\.Workbench\.Host/CorePreview/|tools/ci/actor-foundation/WorkbenchPostgresPreview\.cs$|server/essentials/(src|tests)/ActorFoundation/|server/essentials/(src|tests)/Workflows/Runtime/(Graph|Native|Statecharts|WorkflowActor)/|server/essentials/build/Analyzers/|server/essentials/tests/Directory\.Build\.props$|Directory\.Build\.(props|targets)$|Directory\.Packages\.props$|PackageVersioning\.props$|PackageRanges\.targets$|VersionLines\.props$|\.editorconfig$|tools/ci/kernel_prototype_gate\.py$|tools/architecture/check-kernel-model-references\.targets$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
              kernel=true
            fi
          fi
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"

  # Python only, so the shards start within a minute: the change scope, the cheap guards, and the shard matrix.
  plan-tiers:
    if: (github.event_name != 'workflow_dispatch' || inputs.suite == 'ci')
    name: Plan tiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read  # check-quarantine reads each tracking issue's state
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      pr_matrix: ${{ steps.select.outputs.pr_matrix }}
      pr_count: ${{ steps.select.outputs.pr_count }}
      integration_matrix: ${{ steps.select.outputs.integration_matrix }}
      integration_count: ${{ steps.select.outputs.integration_count }}
      container_matrix: ${{ steps.select.outputs.container_matrix }}
      container_count: ${{ steps.select.outputs.container_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check evidence artifact sizes
        run: |
          python3 tools/ci/check_evidence_sizes.py --self-test
          python3 tools/ci/check_evidence_sizes.py
          python3 tools/bpmn/test_restore_evidence.py

      - name: Classify the change scope
        id: scope
        # Pull requests and merge-queue entries only; every other event is a full run. The classifier exits 0 whatever
        # it finds, and a diff it cannot read classifies as a full run.
        #
        # BASE_SHA is the first parent of the merge commit GitHub tests: the base branch today (main or initiative/*).
        # The diff from it is exactly what the pull request would change. pull_request.base.sha is the base from when the
        # PR was opened or last retargeted, so on an older PR it also counted everything merged into main since, and a
        # documentation-only PR got a full run (#2683: one docs file, classified by an .editorconfig change on main). A
        # merge-queue entry's base is merge_group.base_sha, the commit the entry was built on; its head, GITHUB_SHA, is
        # the merge result.
        # The same base serves the quarantine guard and the switch check below.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          python3 tools/ci/change_scope.py --self-test
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            python3 tools/ci/change_scope.py --base "$BASE_SHA" --head "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check contributor checkpoint workflow guards
        run: python3 tools/contributor-checkpoints/test_workflow_guards.py

      - name: Check retained migration generator guards
        run: python3 tools/ef/test_generate_module_migrations.py

      - name: Check Studio asset gate
        run: python3 tools/ci/verify-studio-assets.py --self-test

      - name: Check Studio image publishing guards
        run: |
          python3 tools/ci/studio_image_tags.py --self-test
          python3 tools/ci/test_studio_docker_publish.py

      - name: Check the package publish gate
        run: python3 -m unittest discover -s tools/ci -p 'test_await_ci_result.py'

      - name: Check the resilient Chromium installer
        run: python3 -m unittest discover -s tools/ci -p 'test_install_playwright_chromium.py'

      # Same files and rules as CatalogLinkGuardTests, without the build. It is the documentation-reading check a
      # documentation-only PR can still break (by moving or deleting a doc a catalog or module README links to).
      - name: Check catalog and module README links
        run: python3 tools/maps/check-catalog-links.py

      - name: Verify package evidence reader and recovery
        run: python3 -m unittest discover -s tools/versioning/package-evidence -p 'test_*.py'

      - name: Exercise the tier tooling
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_workflow_scope.py'
          python3 -m unittest discover -s tools/ci -p 'test_studio_gate.py'
          python3 -m unittest discover -s tools/ci -p 'test_run_shard_retry_policy.py'
          python3 tools/ci/test_tiers.py --self-test
          python3 tools/ci/affected_tests.py --self-test
          python3 tools/ci/test_results.py --self-test
          python3 tools/ci/test_tiers.py check-workflows
          python3 tools/ci/test_tiers.py check-docs

      # FR-013. On a pull request or a merge-queue entry only the entries its diff adds or changes, against today's
      # main, are checked, so closing a tracking issue never turns unrelated PRs red or stalls the queue. The checkout
      # has full history, so the base is always
      # readable; check-quarantine exits 2 rather than widen the check if it is not. On main and nightly every entry is
      # checked, and a closed issue fails the run and files "main is red".
      - name: Check the quarantine list's tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            python3 tools/ci/test_results.py check-quarantine --base "$BASE_SHA"
          else
            python3 tools/ci/test_results.py check-quarantine
          fi

      - name: Select the PR-tier shards
        id: select
        env:
          # select reads ruleset main-2 when a change turns integrationLeavesPrTier on (FR-011); gh needs a token for it.
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          DISPATCH_TIER: ${{ inputs.tier }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            # A pull request and a push to main run the PR tier only; the full tier runs nightly and on a manual run.
            pull_request | merge_group | push) tier="pr" ;;
            schedule) tier="nightly" ;;
            workflow_dispatch) [[ "$DISPATCH_TIER" == pr ]] && tier="pr" || tier="nightly" ;;
            *) tier="push" ;;
          esac
          # --event: on a pull request only the shards its changes can affect run (#3787); every other event, the
          # merge queue included, runs them all. pr_count can be 0, and Build & test accepts skipped shards then.
          python3 tools/ci/test_tiers.py select --tier "$tier" ${BASE_SHA:+--base "$BASE_SHA" --head "$GITHUB_SHA"} \
            --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  # One shard of the PR tier. Each shard rebuilds the solution rather than downloading a shared build: the 4.2 GB
  # output takes about 6 minutes to download against a 3-minute build (spec 263 research R4).
  pr-shard:
    name: PR shard (${{ matrix.shard }})
    needs: plan-tiers
    if: ${{ needs.plan-tiers.outputs.docs_only != 'true' && needs.plan-tiers.outputs.pr_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-tiers.outputs.pr_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        # Includes the isolated Debug dependency graph required by the Architecture tests while preserving ordinary
        # Release assets. Every restore in CI is locked (#2122): it restores exactly the versions the committed
        # packages.lock.json files name and fails when one no longer matches its project, so a dependency change lands
        # only as a reviewed lock-file diff. See docs/reference/nuget-lock-files.md.
        run: bash tools/architecture/restore-ci-project-graph.sh --locked-mode -p:WarningsNotAsErrors=NU1603

      - name: Restore repository-local .NET tools
        run: dotnet tool restore

      - name: Restore original BPMN test fixtures
        run: python3 tools/bpmn/restore_evidence.py

      - name: Build (full solution, including test projects)
        # Building the whole solution -- test projects included -- is what catches
        # semantic-merge compile breaks like #543. Every shard builds it, so every shard gates on it.
        run: dotnet build Elsa.Server.slnx -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      - name: Test the shard, retrying each failure once
        env:
          SHARD: ${{ toJSON(matrix) }}
        run: >-
          python3 tools/ci/run_shard.py --entry "$SHARD" --out "$RUNNER_TEMP/shard" --head "$GITHUB_SHA"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Capture whole-project BPMN and design test discovery
        if: ${{ success() && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          shard = Path(os.environ["RUNNER_TEMP"]) / "shard"
          runs = json.loads((shard / "runs.json").read_text())
          if not isinstance(runs, list):
              raise RuntimeError("Expected the shard's recorded run list")
          projects = {
              "extensions/Bpmn/tests/Interchange/Tests/Elsa.Activities.Bpmn.Interchange.Tests.csproj",
              "extensions/Bpmn/tests/Tests/Elsa.Activities.Bpmn.Tests.csproj",
              "server/essentials/tests/Workflows/Design/Tests/Elsa.Workflows.Design.Tests.csproj",
          }
          seen = set()
          failed = False
          for index, run in enumerate(runs):
              project = run["project"]
              if project not in projects:
                  continue
              if run.get("filter", "") != "" or run.get("group", "") != "" or project in seen:
                  raise RuntimeError("Discovery requires one unfiltered whole-project run: " + project)
              seen.add(project)
              out = shard / "discovery" / str(index)
              out.mkdir(parents=True, exist_ok=False)
              command = ["dotnet", "test", project, "-c", "Release", "--no-build", "--no-restore",
                         "--list-tests", "-p:WarningsNotAsErrors=NU1603"]
              metadata = {
                  "project": project, "runIndex": index, "command": command,
                  "cwd": os.getcwd(), "githubSha": os.environ["GITHUB_SHA"],
                  "language": {"DOTNET_CLI_UI_LANGUAGE": "en-US", "VSLANG": "1033"},
                  "normalTry1": "try1/" + str(index), "normalTry2": "try2/" + str(index),
                  "exitCode": None,
              }
              record = out / "metadata.json"
              record.write_text(json.dumps(metadata, indent=2) + "\n")
              with (out / "stdout.log").open("wb") as stdout, (out / "stderr.log").open("wb") as stderr:
                  result = subprocess.run(command, stdout=stdout, stderr=stderr,
                                          env={**os.environ, **metadata["language"]}, check=False)
              metadata["exitCode"] = result.returncode
              record.write_text(json.dumps(metadata, indent=2) + "\n")
              print(project + ": raw discovery exit " + str(result.returncode), flush=True)
              failed = failed or result.returncode != 0
          if failed:
              raise SystemExit(1)
          PY

      - name: Upload the shard outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-outcomes-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/test-outcomes.json
          if-no-files-found: ignore
          retention-days: 7

      # Kept for tools/maps/Elsa.Maps.Generator test-tiers-rebalance, which takes medians over several runs.
      - name: Upload the shard TRX files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trx-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shard/try*/**/*.trx
            ${{ runner.temp }}/shard/discovery/**
          if-no-files-found: ignore
          retention-days: 7

  # The required context, and the one gate. It reports one result for the plan, every PR-tier shard, the architecture
  # guards, the core-only leg, the generated maps (on a pull request) and the Studio frontend checks when Studio changed.
  # The heavy suites run nightly, not here. !cancelled() rather than always(): a superseded run must not turn into a red
  # aggregate.
  build-and-test:
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'ci' && 'Build & test (not requested)' || 'Build & test' }}"
    needs: [plan-tiers, pr-shard, architecture-guards, core-only, generated-maps, plan-scope, studio-lint-and-test]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ needs.plan-tiers.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Before the docs-only fast path: a Studio change that is also documentation-only still needs its frontend checks.
      # The Studio browser, .NET and composed UX proofs run nightly (lean CI), so the frontend checks are the only
      # Studio proof here. A missing scope fails rather than passes.
      - name: Verify the Studio frontend checks before the docs-only fast path
        env:
          SCOPE: ${{ needs.plan-scope.result }}
          STUDIO_SELECTED: ${{ needs.plan-scope.outputs.studio }}
          STUDIO_FRONTEND: ${{ needs.studio-lint-and-test.result }}
        run: |
          if [[ "$SCOPE" != success ]]; then
            echo "::error::Select focused validation did not succeed ($SCOPE)."; exit 1
          fi
          if [[ "$STUDIO_SELECTED" == true && "$STUDIO_FRONTEND" != success ]]; then
            echo "::error::Studio frontend lint, typecheck & unit tests did not succeed ($STUDIO_FRONTEND)."; exit 1
          fi
      # Generated maps runs on every pull request, documentation-only ones included, so it is checked before the fast
      # path. Only on a pull request: on a push or the nightly run, stale filters stay out of `alert` (see generated-maps).
      - name: Verify the generated maps
        if: github.event_name == 'pull_request'
        env:
          MAPS: ${{ needs.generated-maps.result }}
        run: |
          if [[ "$MAPS" != success ]]; then
            echo "::error::Generated maps did not succeed ($MAPS)."; exit 1
          fi
      - name: Verify the PR tier passed
        env:
          PLAN: ${{ needs.plan-tiers.result }}
          DOCS_ONLY: ${{ needs.plan-tiers.outputs.docs_only }}
          SHARDS: ${{ needs.pr-shard.result }}
          PR_COUNT: ${{ needs.plan-tiers.outputs.pr_count }}
          ARCHITECTURE: ${{ needs.architecture-guards.result }}
          CORE: ${{ needs.core-only.result }}
        run: |
          if [[ "$PLAN" != success ]]; then
            echo "::error::Plan tiers did not succeed ($PLAN)."; exit 1
          fi
          if [[ "$DOCS_ONLY" == true ]]; then
            echo "Documentation-only change: the .NET build and tests were skipped (spec 257)."; exit 0
          fi
          # A pull request whose changes reach no PR-tier test selects no shard (#3787), and the shard job is skipped.
          # Only an explicit count of 0 allows that; Architecture guards and Core-only still have to pass.
          if [[ "$PR_COUNT" == 0 && "$SHARDS" == skipped ]]; then
            echo "No PR-tier shard is affected by this change (see Plan tiers' summary)."; SHARDS=success
          fi
          failed=0
          for pair in "PR shards:$SHARDS" "Architecture guards:$ARCHITECTURE" "Core-only build & test:$CORE"; do
            if [[ "${pair##*:}" != success ]]; then
              echo "::error::${pair%%:*} did not succeed (${pair##*:})."; failed=1
            fi
          done
          exit "$failed"

  # Nightly and manual runs only (lean CI). A push to main plans the PR tier, which selects no integration shard.
  integration-shard:
    name: Integration shard (${{ matrix.shard }})
    needs: [plan-tiers]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan-tiers.result == 'success'
      && needs.plan-tiers.outputs.docs_only != 'true' && needs.plan-tiers.outputs.integration_count != '0' }}
    runs-on: ubuntu-latest
    # The serial BPMN host cases are split across two shards of about 25 minutes each (#3784).
    # Leave room for setup and artifact upload; run_shard.py still bounds each test.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-tiers.outputs.integration_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: bash tools/architecture/restore-ci-project-graph.sh --locked-mode -p:WarningsNotAsErrors=NU1603

      - name: Restore repository-local .NET tools
        run: dotnet tool restore

      # The whole solution, as in the PR shards: the integration projects launch hosts, probes and the CLI from
      # sibling build outputs that their own project references do not build (spec 263 research R4).
      - name: Restore original BPMN test fixtures
        run: python3 tools/bpmn/restore_evidence.py

      - name: Build (full solution)
        run: dotnet build Elsa.Server.slnx -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      - name: Test the shard, retrying each failure once
        env:
          SHARD: ${{ toJSON(matrix) }}
        run: >-
          python3 tools/ci/run_shard.py --entry "$SHARD" --out "$RUNNER_TEMP/shard" --head "$GITHUB_SHA"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the shard outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-outcomes-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/test-outcomes.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the shard TRX files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trx-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/try*/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # Several EF suites per job, one after another: the suites' own build is paid once per job instead of once per suite,
  # which keeps the full tier within the organization's 20-job limit (FR-022). Each suite still runs whole, with its
  # required-provider mode armed for that suite only, so an engine that fails to start fails rather than skips.
  # Nightly and manual runs only (lean CI), like the integration shards.
  ef-container-shard:
    name: EF container shard (${{ matrix.shard }})
    needs: [plan-tiers]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan-tiers.result == 'success'
      && needs.plan-tiers.outputs.docs_only != 'true' && needs.plan-tiers.outputs.container_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-tiers.outputs.container_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Configuration-driven CShells composition, migration/validation, CRUD/OCC, runtime resolution, restart
      # persistence and the packed-module child-host proof on a native PostgreSQL. Npgsql is the only relational
      # provider package in that project.
      - name: Start PostgreSQL for the Secrets EF shell proof
        if: ${{ matrix.secrets }}
        run: |
          docker run --detach --name secrets-ef-postgresql --publish 5432:5432 \
            --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17.6-alpine3.22
          for attempt in {1..60}; do
            if docker exec secrets-ef-postgresql pg_isready -U postgres > /dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs secrets-ef-postgresql
              exit 1
            fi
            sleep 1
          done

      - name: Restore original BPMN test fixtures
        run: python3 tools/bpmn/restore_evidence.py

      - name: Restore and build the shard's suites
        env:
          SHARD: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          python3 -c 'import json, os
          entry = json.loads(os.environ["SHARD"])
          projects = [suite["project"] for suite in entry["suites"]] + ([entry["secretsProject"]] if entry["secrets"] else [])
          print("\n".join(dict.fromkeys(projects)))' > "$RUNNER_TEMP/projects.txt"
          while IFS= read -r project; do
            dotnet restore "$project" --locked-mode -p:WarningsNotAsErrors=NU1603
            dotnet build "$project" -c Release --no-restore -p:WarningsNotAsErrors=NU1603
          done < "$RUNNER_TEMP/projects.txt"

      - name: Test the suites using their declared retry policy
        env:
          SHARD: ${{ toJSON(matrix) }}
          ELSA_SECRETS_EF_POSTGRESQL_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Username=postgres;Database=postgres
        run: >-
          python3 tools/ci/run_shard.py --entry "$SHARD" --out "$RUNNER_TEMP/shard" --head "$GITHUB_SHA" --parallel 1
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the shard outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-outcomes-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/test-outcomes.json
          if-no-files-found: ignore
          retention-days: 7

  # One result for the full tier in the nightly and manual runs, and its suite in `alert`.
  # !cancelled() rather than always(): a cancelled run must not turn into a red aggregate that files a "main is red" issue.
  full-tier-result:
    name: Full tier result
    needs: [plan-tiers, integration-shard, ef-container-shard]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the full-tier shards passed
        env:
          PLAN: ${{ needs.plan-tiers.result }}
          INTEGRATION: ${{ needs.integration-shard.result }}
          CONTAINERS: ${{ needs.ef-container-shard.result }}
        run: |
          if [[ "$PLAN" != success ]]; then
            echo "::error::Plan tiers did not succeed ($PLAN)."; exit 1
          fi
          for result in "$INTEGRATION" "$CONTAINERS"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::A full-tier shard did not succeed ($result)."; exit 1
            fi
          done

  # Container-free architecture guards (dependency direction, endpoint security, feature
  # composition, the EF dependency allowlist, and the fail-closed guard that keeps the retired
  # persistence family out of the tree). The whole project runs so a renamed or newly added guard
  # cannot silently fall out of a brittle test filter. The spec 094 coverage-ledger and
  # benchmark-evidence suites that once ran beside it were retired with performance
  # measurement (#1668).
  architecture-guards:
    name: Architecture guards
    needs: [plan-tiers, plan-scope]
    if: needs.plan-tiers.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore the evaluated source dependency graphs
        run: bash tools/architecture/restore-ci-project-graph.sh --locked-mode -p:WarningsNotAsErrors=NU1603

      - name: Build the architecture guards
        run: dotnet build server/essentials/tests/Architecture/Tests/Elsa.Architecture.Tests.csproj -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      # Through the shard runner, so a failure gets the same single retry and quarantine as every PR-tier test (FR-004).
      - name: Run the architecture guards
        run: |
          entry=$(python3 tools/ci/test_tiers.py entry --shard architecture-guards --project server/essentials/tests/Architecture/Tests/Elsa.Architecture.Tests.csproj)
          python3 tools/ci/run_shard.py --entry "$entry" --out "$RUNNER_TEMP/shard" --head "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-outcomes-architecture-guards
          path: ${{ runner.temp }}/shard/test-outcomes.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install the inventory toolchain
        if: needs.plan-scope.outputs.package-evidence == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Rehearse source and binary inventory boundaries
        if: needs.plan-scope.outputs.package-evidence == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci --prefix tools/versioning/package-evidence --ignore-scripts --no-audit --no-fund
          node --test tools/versioning/package-evidence/test-generation.mjs
          python3 tools/versioning/package-evidence/rehearse.py


  # Issue #1815 separates required modules from optional ones. This leg is what makes that
  # separation mean something: it builds and tests ONLY the core, so a dependency from core into
  # an optional module fails here even when the full solution is perfectly happy.
  #
  # The filter is generated from tools/solution-filters/profiles.json by expanding the dependency
  # closure of the named core roots, so it cannot drift: add a core-to-extension reference and the
  # closure grows, the committed .slnf stops matching, and the "Generated maps fresh" job's solution
  # filter check goes red alongside this one.
  #
  # The ExtensionBoundary guard that enforces the rule directly also runs inside "Build & test",
  # because it lives under tests/ and references no Testcontainers, so it is already covered by a
  # required check. This job adds the thing that guard cannot prove on its own: that the core
  # actually compiles and passes its tests with every optional module absent.

  core-only:
    name: Core-only build & test
    needs: plan-tiers
    if: needs.plan-tiers.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Elsa.Server.Core.slnf --locked-mode -p:WarningsNotAsErrors=NU1603

      - name: Build (core only)
        run: dotnet build Elsa.Server.Core.slnf -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      # The core filter's test projects, through the shard runner: the same single retry and quarantine as every
      # PR-tier test (FR-004), so a quarantined core test cannot fail "Build & test" through this job.
      - name: Test (core only)
        run: |
          entry=$(python3 tools/ci/test_tiers.py entry --shard core-only --slnf Elsa.Server.Core.slnf)
          python3 tools/ci/run_shard.py --entry "$entry" --out "$RUNNER_TEMP/shard" --head "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-outcomes-core-only
          path: ${{ runner.temp }}/shard/test-outcomes.json
          if-no-files-found: ignore
          retention-days: 7

  # A red main has to reach a human. GitHub's own failure notification for a push does go to
  # whoever pushed, which is a better channel than the one the nightly uses -- but on
  # 2026-08-12 the pusher was the person who had just merged through three red checks, so it
  # is not a channel to rely on alone. This files or updates one deduplicated issue as well.
  #
  # Lean CI: one issue per suite. The gate (Build & test, Architecture guards, Core-only) files "main is red: CI", as
  # before; each heavy suite that runs only in the nightly schedule files its own "main is red: CI nightly, <suite>", so a
  # red suite names itself and one red suite does not hide another. A Generated maps failure alone files nothing
  # (see generated-maps).
  alert:
    name: Alert on a red main
    needs:
      - build-and-test
      - full-tier-result
      - architecture-guards
      - core-only
      - studio-browser-tests
      - studio-ux-acceptance
      - studio-dotnet-build-and-test
      - backend-source
      - package-witness
      - published-image-pair
      - shuffled-unit-tests
      - kernel-prototype-nightly
      - kernel-prototype-nightly-4096
      - nightly-nl9
      - nightly-kernel-postgres-history
      - nightly-kernel-mysql
      # Only so a stale-filter failure, which reaches alert through Build & test, can be told apart and file nothing.
      - generated-maps
    # A cancelled run (superseded by a newer push) is not a failure and files nothing. The nightly schedule
    # files too: its failure mail goes to whoever last edited the cron, which is nobody watching, and on main it is the
    # only automatic run of the heavy suites. A suite skipped on a push is not a failure.
    if: ${{ failure() && !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: File or update one tracking issue per failed suite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          GATE_RESULTS: >-
            ${{ needs.build-and-test.result }} ${{ needs.architecture-guards.result }} ${{ needs.core-only.result }}
          FULL_TIER: ${{ needs.full-tier-result.result }}
          STUDIO_BROWSER: ${{ needs.studio-browser-tests.result }}
          STUDIO_UX: ${{ needs.studio-ux-acceptance.result }}
          STUDIO_DOTNET: ${{ needs.studio-dotnet-build-and-test.result }}
          BACKEND_SOURCE: ${{ needs.backend-source.result }}
          WEAVER: ${{ needs.package-witness.result }}
          PUBLISHED_IMAGES: ${{ needs.published-image-pair.result }}
          SHUFFLED: ${{ needs.shuffled-unit-tests.result }}
          KERNEL_NIGHTLY: ${{ needs.kernel-prototype-nightly.result }}
          KERNEL_4096: ${{ needs.kernel-prototype-nightly-4096.result }}
          KERNEL_NL9: ${{ needs.nightly-nl9.result }}
          KERNEL_PG_HISTORY: ${{ needs.nightly-kernel-postgres-history.result }}
          KERNEL_MYSQL: ${{ needs.nightly-kernel-mysql.result }}
          MAPS: ${{ needs.generated-maps.result }}
        run: |
          set -euo pipefail
          failed=()
          if [[ " $GATE_RESULTS " == *" failure "* ]]; then failed+=("CI"); fi
          for pair in "Full tier:$FULL_TIER" "Studio browser tests:$STUDIO_BROWSER" "UX acceptance:$STUDIO_UX" \
              "Studio .NET build & test:$STUDIO_DOTNET" "Backend source:$BACKEND_SOURCE" \
              "Weaver independent package witness:$WEAVER" "Published image pair:$PUBLISHED_IMAGES" \
              "Workflows unit tests (three shuffled orders):$SHUFFLED" "Kernel prototype nightly:$KERNEL_NIGHTLY" \
              "Kernel prototype nightly, 4,096 virtual partitions:$KERNEL_4096" \
              "Kernel prototype nightly, NL-9 node lease deadlock runs:$KERNEL_NL9" \
              "Kernel prototype nightly, PostgreSQL workflow history:$KERNEL_PG_HISTORY" \
              "Kernel prototype nightly, MySQL provider:$KERNEL_MYSQL"; do
            if [[ "${pair##*:}" == failure ]]; then failed+=("CI nightly, ${pair%:*}"); fi
          done
          if [ ${#failed[@]} -eq 0 ]; then
            # Generated maps is an ancestor of alert through Build & test, so a stale-filter failure alone reaches this
            # job. It is a request to open a refresh PR, not a red main (see generated-maps): file nothing for it.
            if [[ "$MAPS" == failure ]]; then
              echo "::notice::Only Generated maps failed: stale solution filters are a refresh request, not a red main. No issue filed."
              exit 0
            fi
            echo "::warning::A need failed, but no gate or suite result reads failure; filing for the gate. Results: gate=[$GATE_RESULTS] maps=$MAPS full-tier=$FULL_TIER studio-browser=$STUDIO_BROWSER studio-ux=$STUDIO_UX studio-dotnet=$STUDIO_DOTNET backend-source=$BACKEND_SOURCE weaver=$WEAVER published-images=$PUBLISHED_IMAGES shuffled=$SHUFFLED kernel-nightly=$KERNEL_NIGHTLY kernel-4096=$KERNEL_4096 kernel-nl9=$KERNEL_NL9 kernel-pg-history=$KERNEL_PG_HISTORY kernel-mysql=$KERNEL_MYSQL"
            failed=("CI")
          fi

          # One issue per failed gate or suite; the body below is the same for each (left unindented for its heredoc).
          # A failed gh call for one suite does not stop the others (file_issue runs under ||, so set -e does not end
          # the loop); the step fails at the end if any call failed.
          file_issue() {
          local GATE=$1 title trigger issues existing body
          title="main is red: $GATE"

          # Attribute only what the event actually says. On a schedule github.actor is whoever
          # last touched the workflow file, not anyone who caused the failure, so naming them
          # would pin a breakage on someone who had nothing to do with it.
          case "$EVENT_NAME" in
            push) trigger="push by @$ACTOR" ;;
            schedule) trigger="scheduled run" ;;
            *) trigger="$EVENT_NAME" ;;
          esac

          # Exact-title match over the open issues rather than `--search`, whose index lags
          # issue creation by up to a minute -- long enough for two merges in quick succession
          # to file the same issue twice. If the lookup itself fails, file without dedup.
          if ! issues=$(gh issue list --state open --limit 300 --json number,title); then
            echo "::warning::Could not list open issues; filing without deduplication."
            issues='[]'
          fi
          existing=$(jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty' <<<"$issues")

          # No "main is broken" claim: the body states which gate failed and leaves the diagnosis
          # to the run. (The benchmark gate that motivated this wording was retired in #1668.)
          body=$(cat <<EOF
          The **$GATE** gate failed against \`main\`.

          - Commit: \`$COMMIT_SHA\`
          - Trigger: $trigger
          - Run: $RUN_URL

          This gate cannot block anything: on a push the commit has already landed, and a
          scheduled run is after the fact by definition. Fix forward or revert.

          Close this issue once the gate is green again and the cause is understood. A later
          green run does not close it automatically, and a gate that stays red comments here
          instead of filing a second issue.
          EOF
          )

          if [ -n "$existing" ]; then
            echo "Commenting on existing issue #$existing."
            gh issue comment "$existing" --body "$body"
          else
            echo "Filing a new issue."
            # The label is a convenience. If it is ever renamed or deleted, `gh issue create`
            # rejects the whole call, so fall back to filing unlabeled rather than losing the
            # alert entirely.
            gh issue create --title "$title" --body "$body" --label needs-triage || {
              echo "::warning::Labeled create failed; filing without the needs-triage label."
              gh issue create --title "$title" --body "$body"
            }
          fi
          }

          errors=0
          for GATE in "${failed[@]}"; do
            file_issue "$GATE" || { echo "::warning::Could not file or update the issue for $GATE."; errors=$((errors + 1)); }
          done
          if [ "$errors" -ne 0 ]; then
            echo "::error::$errors issue call(s) failed; see the warnings above."; exit 1
          fi

  # Freshness gate for the one generated output that IS committed: the solution filters (Elsa.Server.*.slnf),
  # regenerated into a scratch directory and byte-compared with what is committed. It also runs the generator's own
  # contract self-tests, including the shared project-discovery rule, the publish link rewrite and the generated-maps
  # branch writer, and generates the full published set, so a tree the project-graph scan refuses fails here too.
  #
  # The documentation maps, their manifest and the findings reports are not committed (spec 257): every PR changed
  # them, so concurrent PRs conflicted on them and this job turned unrelated PRs red. docs/maps/dependency-map.json
  # is not committed either (spec 259): the versioning calculator derives it from each commit's tree with the same scan
  # (tools/maps/Elsa.Maps.Projects). All of them are generated locally with `-- all` and published after every push to
  # main by the "Publish generated maps" job below. Before #1274 this job ran on pull_request only and PR #1202 left
  # main stale for the next three PRs (#1243, #1247, #1248).
  #
  # Build & test needs this job on a pull request (lean CI); the required context "Generated maps fresh" is now the
  # pass-through stub below. Until #2622 it lived in maps.yml and the filter check in solution-filters.yml ("Solution
  # filters fresh"); both were folded in here to cut the workflows a push queues. It runs on pull_request, push to
  # main and this workflow's schedule, on every PR including documentation-only ones.
  #
  # A failure of this job alone files no alert issue (alert needs it only to recognise that case), as the former maps
  # workflow also kept these failures separate: stale filters are a request to open a refresh PR, and the actionable output is the refresh
  # command in the run summary.
  #
  # The generator is built once and each check runs whenever that build succeeded, so one failing check does not
  # hide another.
  generated-maps:
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'ci' && 'Generated maps (not requested)' || 'Generated maps' }}"
    if: (github.event_name != 'workflow_dispatch' || inputs.suite == 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      # No restore of the tree: the dependency map's pinned-transitive edges (spec 149 FR-012) are read from the NuGet lock
      # files committed beside each project (#2122), so the check is a scan of the checkout alone. A lock file the tree
      # has moved past is refused by name, and CI's locked restores fail on it too. The generator tool itself still
      # restores to build, so that restore is locked (RestoreLockedMode=true) against its own lock file.
      - name: Build the generator
        id: generator
        run: dotnet build tools/maps/Elsa.Maps.Generator -c Release -p:RestoreLockedMode=true

      - name: Exercise publish link rewrite contract
        id: publish-self-test
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- publish-self-test

      # Publishing into a scratch directory must succeed on every PR and leave the working tree untouched, so a
      # generator change that would break the post-merge publication fails here, before it merges.
      - name: Publish the documentation maps into a scratch directory
        id: publish-dry-run
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: |
          dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- \
            publish "$RUNNER_TEMP/maps" --source-commit "$GITHUB_SHA" --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::publish wrote into the working tree:"; git status --porcelain; exit 1
          fi

      - name: Exercise the generated-maps branch writer
        id: branch-writer
        if: ${{ !cancelled() }}
        run: bash tools/maps/test-publish-generated-maps.sh

      - name: Exercise project facts contract
        id: project-facts
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- project-facts-self-test

      # The one project-discovery rule the generator and the versioning calculator share (spec 259).
      - name: Exercise project graph contract
        id: project-graph
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- project-graph-self-test

      - name: Exercise feature facts contract
        id: feature-facts
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- feature-facts-self-test

      - name: Check generated filters against the project graph
        id: filters
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- solution-filters-check

      - name: Exercise solution filter generator contracts
        id: filters-self-test
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- solution-filters-self-test

      # Cheap, container-free: a new Testcontainers project missing from containerSuites in tools/ci/test-tiers.json fails here on the PR,
      # instead of silently running nowhere until the nightly EF matrix notices.
      - name: Check every Testcontainers project is in the nightly EF suite manifest
        id: ef-suites-self-test
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- ef-suites-self-test

      # Spec 263: every test project is in tools/ci/test-tiers.json exactly once; Testcontainers, or a child host in a
      # project of 2 minutes or more, is integration tier; split classes exist and no xUnit collection is split; every unit
      # runs in exactly one shard of its tier.
      - name: Check the test tier manifest
        id: test-tiers-check
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- test-tiers-check

      - name: Exercise test tier check contract
        id: test-tiers-self-test
        if: ${{ !cancelled() && steps.generator.outcome == 'success' }}
        run: dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- test-tiers-self-test

      - name: Explain a failed test tier check
        if: ${{ failure() && (steps.test-tiers-check.outcome == 'failure' || steps.test-tiers-self-test.outcome == 'failure') }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Test tier manifest does not match the tree

          The step log names each problem. `tools/ci/test-tiers.json` must list every test project once, in the
          `pr` or `integration` tier, and every unit in one shard of its tier. A project that reaches Testcontainers,
          or that launches a child host and takes 2 minutes or more, is integration tier. Check locally with:

          ```bash
          dotnet run --project tools/maps/Elsa.Maps.Generator -- test-tiers-check
          ```

          The tier rule: `docs/contributing/merging.md#ci-tiers`.
          EOF

      - name: Validate filters with the .NET CLI
        id: filters-cli
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for filter in Elsa.Server.*.slnf; do
            echo "Validating $filter"
            dotnet sln "$filter" list >/dev/null
          done

      - name: Explain a failed generator check
        if: >-
          ${{ failure() && (steps.generator.outcome == 'failure'
          || steps.project-facts.outcome == 'failure' || steps.project-graph.outcome == 'failure'
          || steps.feature-facts.outcome == 'failure' || steps.publish-self-test.outcome == 'failure'
          || steps.publish-dry-run.outcome == 'failure' || steps.branch-writer.outcome == 'failure') }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Generated maps check failed

          No map is committed: the documentation maps (spec 257) and `docs/maps/dependency-map.json`
          (spec 259) are generated and published, never staged. The versioning calculator derives the
          dependency map from each commit's tree with the same scan this job runs.

          If the scan refuses a lock file, the tree's dependencies changed without it: run
          `dotnet restore Elsa.Server.slnx`, review and commit the changed `packages.lock.json`
          files, then run `dotnet run --project tools/maps/Elsa.Maps.Generator -- dependency-map` to
          confirm the map derives. Any other failing step is a generator or `tools/maps` change to fix;
          see `docs/contributing/generated-maps.md`.
          EOF

      - name: Explain how to refresh the solution filters
        if: >-
          ${{ failure() && (steps.generator.outcome == 'failure' || steps.filters.outcome == 'failure'
          || steps.filters-self-test.outcome == 'failure' || steps.filters-cli.outcome == 'failure') }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Generated solution filters are stale or invalid

          Refresh and validate them locally:

          ```bash
          tools/solution-filters/generate-solution-filters.sh
          tools/solution-filters/generate-solution-filters.sh --check
          ```

          Commit every changed `.slnf` file together with any manifest or generator change.
          EOF

  # Publishes the documentation maps for every push to main (spec 257): a build artifact of this run and a commit on
  # the generated-maps branch, the stable home that AGENTS.md and docs/maps/README.md link to. Links into the source
  # tree are pinned to this commit. Only this job writes that branch (the publish-state convention); ruleset
  # generated-maps blocks its deletion and force pushes, and tools/repo-hygiene exempts it from the branch sweep.
  #
  # It needs no other job: the maps describe the tree whether or not its tests pass. The branch only moves forward
  # along main (publish-generated-maps.sh skips an older commit), and a newer push supersedes a pending older one.
  # Pushes made with GITHUB_TOKEN start no workflow run. Like generated-maps it is not among the alert job's needs:
  # a failed publication leaves the previous set in place, and the next push to main catches the branch up.
  # Pass-through stub (lean CI). Build & test now carries the generated maps; `Generated maps fresh` is still a required
  # check in ruleset main-2, matched by job name, so this job keeps reporting it on every pull request until an admin
  # drops it; then it is deleted. It needs nothing, so it always reports.
  generated-maps-fresh:
    name: Generated maps fresh
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the generated maps as part of Build & test
        run: echo "The generated-maps check runs as the Generated maps job, and Build & test requires it."

  publish-maps:
    name: Publish generated maps
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: generated-maps
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build the generator
        run: dotnet build tools/maps/Elsa.Maps.Generator -c Release -p:RestoreLockedMode=true

      - name: Generate the documentation maps
        run: |
          dotnet run --project tools/maps/Elsa.Maps.Generator -c Release --no-build -- \
            publish "$RUNNER_TEMP/maps" --source-commit "$GITHUB_SHA" --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Upload the maps as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-maps-${{ github.sha }}
          path: ${{ runner.temp }}/maps
          if-no-files-found: error

      - name: Commit the maps to the generated-maps branch
        run: bash tools/maps/publish-generated-maps.sh "$RUNNER_TEMP/maps" "$GITHUB_SHA"

  # Pass-through stub (lean CI). The integration and EF container shards run nightly and on a manual run (see
  # full-tier-result), not on pull requests. `Full tier` is still a required check in ruleset main-2, so this job keeps
  # reporting it on every pull request until an admin drops it; then it is deleted. It needs nothing, so it always reports.
  full-tier:
    name: Full tier
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the full tier as nightly
        run: |
          echo "The full tier (integration and EF container shards) runs in CI's nightly schedule, not on pull requests."
          echo "Run it on this branch with: gh workflow run ci.yml --ref <branch> -f tier=full"
          echo "The other heavy suites: -f suite=studio, backend-source, weaver, published-images or studio-order."

  studio-lint-and-test:
    needs: plan-scope
    if: needs.plan-scope.outputs.studio == 'true'
    name: Studio frontend lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Studio dependencies
        uses: ./.github/actions/setup-studio

      - name: Lint
        run: pnpm lint
        working-directory: studio

      - name: Typecheck
        run: pnpm typecheck
        working-directory: studio

      - name: Unit tests
        # Run one workspace at a time so these tests stay deterministic under the hosted runner.
        run: pnpm --recursive --workspace-concurrency=1 test
        working-directory: studio

      - name: Check Workflows bundle budget
        run: pnpm check:bundle:workflows
        working-directory: studio

  # The heavy suites below run in the nightly schedule and on a manual run that selects them (suite input), never on a
  # pull request or a push (lean CI). `alert` files one issue per failing suite.
  studio-browser-tests:
    needs: plan-scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && needs.plan-scope.outputs.studio-heavy == 'true'
    name: Studio browser tests (Chromium ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Keep the complete inventory within the budget as it grows; no cases are omitted.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Studio dependencies
        uses: ./.github/actions/setup-studio

      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        with:
          working-directory: studio

      - name: Run browser tests
        id: browser-tests
        run: pnpm test:browser --shard=${{ matrix.shard }}/4
        working-directory: studio

      # Playwright retains a trace and error context only for failed cases; specs also write their own screenshots there.
      # Without this step the job discards the folder. Scoped to the test step so setup failures upload nothing, and
      # including the cancelled outcome so a shard that hits the 45-minute job timeout still surfaces what failed first.
      # always() only lifts the implicit success() gate that would otherwise skip this step on a red job; the outcome
      # checks keep it off on green runs and on setup failures.
      - name: Upload failed browser traces
        if: ${{ always() && (steps.browser-tests.outcome == 'failure' || steps.browser-tests.outcome == 'cancelled') }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: studio/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  studio-ux-acceptance:
    name: UX acceptance (composed Studio, ${{ matrix.proof }})
    needs: plan-scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && needs.plan-scope.outputs.studio-ux == 'true'
    runs-on: ubuntu-latest
    # Allow time for the full composed journeys, Decision runtime qualification and artifact upload.
    # Standard composed proof has an 80-minute owned envelope; subsequent qualified probes retain their own caps.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - proof: existing
            journey: ''
          - proof: trigger-management
            journey: standalone trigger management
          - proof: trigger-associations
            journey: standalone trigger associations and inputs
          - proof: trigger-event-schedule
            journey: standalone event and schedule starts
          - proof: trigger-http
            journey: standalone HTTP modes
          - proof: trigger-lifecycle
            journey: standalone delivery lifecycle and recovery
          - proof: trigger-bpmn
            journey: standalone genuine BPMN inputs
          - proof: trigger-access
            journey: standalone access and availability
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-studio
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        with:
          working-directory: studio
      - name: Verify acceptance tooling and gate failure controls
        run: |
          python3 -m unittest discover -s tools/ux-acceptance -p 'test_*.py'
          node --test tools/ux-acceptance/*.test.mjs
      - name: Exercise real composed hosts with disposable stores
        id: composed-ux
        if: matrix.proof == 'existing'
        env:
          UX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/identity/ExternalAuthentication.Probe/ui-build-provenance.mjs pin --output "$RUNNER_TEMP/external-auth-ui-toolchain.json"
          node tools/identity/ExternalAuthentication.Probe/ui-build-provenance.mjs studio --root "$RUNNER_TEMP/external-auth-ui-build" --standard-output "$RUNNER_TEMP/ux-acceptance" --toolchain "$RUNNER_TEMP/external-auth-ui-toolchain.json"
      - name: Exercise the selected standalone trigger journey
        id: trigger-ux
        if: matrix.proof != 'existing'
        env:
          UX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIGGER_JOURNEY: ${{ matrix.journey }}
          STUDIO_SHAPE: ${{ matrix.proof == 'trigger-access' && 'coordinated-sdk' || 'application' }}
        run: python3 tools/ux-acceptance/standalone.py --output "$RUNNER_TEMP/ux-acceptance" --journey "$TRIGGER_JOURNEY" --studio-shape "$STUDIO_SHAPE"
      - name: Qualify shared decision execution and runtime-only restart
        if: matrix.proof == 'existing'
        run: python3 tools/decisions/qualify-execution.py --output "$RUNNER_TEMP/ux-acceptance/decision-execution"
      - name: Exercise managed external sign-in on the full Studio host
        if: matrix.proof == 'existing'
        env:
          UX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TMPDIR: ${{ runner.temp }}
          ELSA_EXTERNAL_AUTH_UI_BUILD_ROOT: ${{ runner.temp }}/external-auth-ui-build
        run: |
          node tools/identity/ExternalAuthentication.Probe/ui-build-provenance.mjs controls --root "$RUNNER_TEMP/external-auth-ui-build"
          node tools/identity/ExternalAuthentication.Probe/ui-build-provenance.mjs probe --root "$RUNNER_TEMP/external-auth-ui-build"
          node tools/identity/ExternalAuthentication.Probe/qualify-studio.mjs
          for profile in empty configuration provider-reader denied external-owned hybrid missing-api missing-sessions; do
            node tools/identity/ExternalAuthentication.Probe/qualify-studio.mjs "$profile"
          done
      - name: Retain external sign-in screenshots and source-bound receipts
        if: ${{ !cancelled() && matrix.proof == 'existing' }}
        uses: actions/upload-artifact@v4
        with:
          name: external-auth-ux-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/elsa-3579-full-studio-*/*.png
            ${{ runner.temp }}/elsa-3579-full-studio-*/studio-receipt.json
            ${{ runner.temp }}/elsa-3579-full-studio-*/browser-receipt.json
            ${{ runner.temp }}/elsa-3579-full-studio-*/ui-evidence/*.json
            ${{ runner.temp }}/elsa-3579-full-studio-*/build-provenance.json
            ${{ runner.temp }}/elsa-3579-full-studio-*/failure-*.json
            ${{ runner.temp }}/elsa-3579-full-studio-*/mode-failure.json
      # Job timeouts are cancelled outcomes too; retain their partial evidence without accepting it.
      # Restrict uploads to an attempted producer, so setup failures do not create empty artifacts.
      - name: Retain reviewable success and failure evidence
        if: ${{ always() && (contains(fromJSON('["success","failure","cancelled"]'), steps.composed-ux.outcome) || contains(fromJSON('["success","failure","cancelled"]'), steps.trigger-ux.outcome)) }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-ux-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.proof }}
          path: ${{ runner.temp }}/ux-acceptance
          if-no-files-found: error
          retention-days: 14

      - name: Retain composed producer command timing log
        if: ${{ always() && (steps.composed-ux.outcome == 'success' || steps.composed-ux.outcome == 'failure' || steps.composed-ux.outcome == 'cancelled') }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-ux-command-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-auth-ui-build/studio-build-0.log
          if-no-files-found: warn
          retention-days: 14

  studio-dotnet-build-and-test:
    needs: plan-scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && needs.plan-scope.outputs.studio == 'true'
    name: Studio .NET build & test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Local CI artifacts share one prerelease version, including their Modularity project dependencies.
      STUDIO_PACKAGE_VERSION: 4.0.0-studio-ci.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Studio dependencies
        uses: ./.github/actions/setup-studio

      - name: Build Studio host and RCL frontend assets
        run: pnpm build
        working-directory: studio

      - name: Verify generated Studio host and RCL assets
        run: python3 ../tools/ci/verify-studio-assets.py --root ..
        working-directory: studio

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-studio-nuget-${{ hashFiles('studio/Directory.Packages.props', 'extensions/**/studio/**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-studio-nuget-

      - name: Restore
        run: dotnet restore Elsa.Studio.slnx --locked-mode -p:WarningsNotAsErrors=NU1603
        working-directory: studio

      - name: Build
        run: dotnet build Elsa.Studio.slnx -c Release --no-restore -p:WarningsNotAsErrors=NU1603 "-p:Version=$STUDIO_PACKAGE_VERSION" "-p:SourceRevisionId=$GITHUB_SHA"
        working-directory: studio

      - name: Test
        run: dotnet test Elsa.Studio.slnx -c Release --no-build -p:WarningsNotAsErrors=NU1603 "-p:Version=$STUDIO_PACKAGE_VERSION"
        working-directory: studio

      - name: Pack Studio NuGet projects without publishing
        run: >-
          dotnet pack Elsa.Studio.slnx -c Release --no-build
          -p:WarningsNotAsErrors=NU1603
          "-p:Version=$STUDIO_PACKAGE_VERSION"
          "-p:SourceRevisionId=$GITHUB_SHA"
          "-p:PackageOutputPath=$RUNNER_TEMP/studio-nuget"
        working-directory: studio

      - name: Verify complete Studio NuGet artifact
        run: |
          python3 tools/ci/verify_studio_nuget_packages.py --self-test
          python3 tools/ci/verify_studio_nuget_packages.py --packages "$RUNNER_TEMP/studio-nuget" --version "$STUDIO_PACKAGE_VERSION" --report "$RUNNER_TEMP/studio-archive-verification.json"

      - name: Pack matching mandatory support candidates without publishing
        run: >-
          python3 tools/ci/pack_studio_support.py --output "$RUNNER_TEMP/studio-modularity-nuget"
          --version "$STUDIO_PACKAGE_VERSION" --source "$GITHUB_SHA"

      - name: Publish the matching actual reference Studio
        run: >-
          dotnet publish studio/src/apps/Elsa.Studio.Workbench.Host/Elsa.Studio.Workbench.Host.csproj -c Release --no-build --no-restore
          "-p:Version=$STUDIO_PACKAGE_VERSION" "-p:SourceRevisionId=$GITHUB_SHA"
          -o "$RUNNER_TEMP/studio-reference-web"

      - name: Install Chromium for package consumer qualification
        uses: ./.github/actions/install-chromium
        with:
          working-directory: studio

      - name: Qualify actual Studio packages and causal controls
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_studio_native_scratch.py'
          python3 tools/ci/qualify_studio_consumers.py --self-test
          python3 tools/ci/qualify_studio_consumers.py \
            --packages "$RUNNER_TEMP/studio-nuget" \
            --modularity-packages "$RUNNER_TEMP/studio-modularity-nuget" \
            --reference-web "$RUNNER_TEMP/studio-reference-web" \
            --expected-producer-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/studio-consumer-qualification"

      - name: Retain package candidates and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-package-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/studio-nuget/*.nupkg
            ${{ runner.temp }}/studio-modularity-nuget/*.nupkg
            ${{ runner.temp }}/studio-archive-verification.json
            ${{ runner.temp }}/studio-consumer-qualification/report.json
            ${{ runner.temp }}/studio-consumer-qualification/**/*.log
            ${{ runner.temp }}/studio-consumer-qualification/archive-controls/*.json
            ${{ runner.temp }}/studio-consumer-qualification/evidence/**

      - name: Build standalone Studio images without publishing
        # Every Studio flavor's Dockerfile copies its own project closure; building each one catches a missing COPY
        # before studio-docker.yml publishes it.
        run: |
          set -euo pipefail
          for app in Workbench Essentials Foundation; do
            flavor=$(tr '[:upper:]' '[:lower:]' <<< "$app")
            docker build --file "studio/src/apps/Elsa.Studio.$app.Host/Dockerfile" --build-arg "STUDIO_VERSION=$STUDIO_PACKAGE_VERSION" \
              --tag "elsa-studio-$flavor:ci-${{ github.sha }}" .
          done

  backend-source:
    needs: plan-scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && needs.plan-scope.outputs.backend-source == 'true'
    name: Backend source (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select the existing .NET 10.x CI line
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Record the runner and verify empty job paths
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Invoke-PlatformSourceJourney.ps1 -PreflightOnly
          else
            pwsh -NoProfile -File e2e-tests/Invoke-PlatformSourceJourney.ps1 -PreflightOnly
          fi

      - name: Restore Workbench and the focused test project from committed public feeds
        shell: bash
        run: |
          dotnet restore server/apps/Elsa.Workbench.Host/Elsa.Workbench.Host.csproj --locked-mode
          dotnet restore server/essentials/tests/Activities/Runtime/Tests/Elsa.Activities.Runtime.Tests.csproj --locked-mode

      - name: Build Workbench with the documented command
        shell: bash
        run: dotnet build server/apps/Elsa.Workbench.Host/Elsa.Workbench.Host.csproj -p:RestoreLockedMode=true

      - name: Verify the documented build left tracked lock files unchanged
        shell: bash
        run: git diff --exit-code -- ':(glob)**/packages.lock.json'

      - name: Run the focused WriteLine bound-input test
        shell: bash
        run: dotnet test server/essentials/tests/Activities/Runtime/Tests/Elsa.Activities.Runtime.Tests.csproj --configuration Debug --no-restore --filter 'FullyQualifiedName~WriteLineBoundInputExecutionTests'

      - name: Test strict result verdict and run the owned backend journey
        id: platform-journey
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Test-WorkflowFlowVerdict.ps1
            powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Test-SequenceWorkflowVerdict.ps1
            powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Test-SourceEditTrxVerdict.ps1
            powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Invoke-PlatformSourceJourney.ps1
          else
            pwsh -NoProfile -File e2e-tests/Test-WorkflowFlowVerdict.ps1
            pwsh -NoProfile -File e2e-tests/Test-SequenceWorkflowVerdict.ps1
            pwsh -NoProfile -File e2e-tests/Test-SourceEditTrxVerdict.ps1
            pwsh -NoProfile -File e2e-tests/Invoke-PlatformSourceJourney.ps1
          fi

      - name: Verify dotnet run failure propagation
        id: run-profile-negative-control
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            if control_output=$(powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Invoke-RunProfileSourceJourney.ps1 -InvalidCommandControl 2>&1); then
              control_exit=0
            else
              control_exit=$?
            fi
          else
            if control_output=$(pwsh -NoProfile -File e2e-tests/Invoke-RunProfileSourceJourney.ps1 -InvalidCommandControl 2>&1); then
              control_exit=0
            else
              control_exit=$?
            fi
          fi
          printf '%s\n' "$control_output"
          if [ "$control_exit" -eq 0 ]; then
            echo 'The deliberately invalid launch invocation unexpectedly returned success.' >&2
            exit 1
          fi
          case "$control_output" in
            *"RUN_PROFILE_FAILURE_PROPAGATED:$control_exit"*) ;;
            *)
              echo 'The wrapper did not mark the expected native command failure as propagated.' >&2
              exit 1
              ;;
          esac
          echo "Expected negative control: wrapper propagated native exit code $control_exit; the fixed port remained free."

      - name: Replay the documented dotnet run profile and workflow smoke
        id: run-profile-journey
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Invoke-RunProfileSourceJourney.ps1
          else
            pwsh -NoProfile -File e2e-tests/Invoke-RunProfileSourceJourney.ps1
          fi

      - name: Replay and restore the documented backend source edit
        id: source-edit-journey
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File e2e-tests/Invoke-SourceEditExercise.ps1
          else
            pwsh -NoProfile -File e2e-tests/Invoke-SourceEditExercise.ps1
          fi

      - name: Upload owned-server diagnostics on failure
        if: ${{ failure() && steps.platform-journey.outcome == 'failure' && steps.platform-journey.outputs.diagnostics_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-source-diagnostics-${{ matrix.runner }}
          path: ${{ steps.platform-journey.outputs.diagnostics_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload run-profile diagnostics on failure
        if: ${{ failure() && steps.run-profile-journey.outcome == 'failure' && steps.run-profile-journey.outputs.diagnostics_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-source-run-profile-diagnostics-${{ matrix.runner }}
          path: ${{ steps.run-profile-journey.outputs.diagnostics_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload source-edit test and command evidence
        if: ${{ always() && steps.source-edit-journey.outcome != 'skipped' && steps.source-edit-journey.outputs.diagnostics_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-source-edit-evidence-${{ matrix.runner }}
          path: ${{ steps.source-edit-journey.outputs.diagnostics_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload owned Sequence server diagnostics on failure
        if: ${{ always() && steps.source-edit-journey.outcome == 'failure' && steps.source-edit-journey.outputs.sequence_diagnostics_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-source-edit-server-diagnostics-${{ matrix.runner }}
          path: ${{ steps.source-edit-journey.outputs.sequence_diagnostics_path }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure-control diagnostics on failure
        if: ${{ failure() && steps.run-profile-negative-control.outcome == 'failure' && steps.run-profile-negative-control.outputs.diagnostics_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-source-run-profile-control-diagnostics-${{ matrix.runner }}
          path: ${{ steps.run-profile-negative-control.outputs.diagnostics_path }}
          if-no-files-found: error
          retention-days: 7

  package-witness:
    needs: plan-scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && needs.plan-scope.outputs.weaver == 'true'
    name: Weaver independent package witness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEAVER_VERSION: 4.0.0-weaver-ci.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Studio dependencies
        uses: ./.github/actions/setup-studio

      - name: Install driver browser tooling
        uses: ./.github/actions/install-chromium
        with:
          working-directory: studio

      - name: Verify driver refusal controls
        run: python3 -m unittest discover -s tools/studio/Weaver.Conformance.Probe -p 'test_*.py'

      - name: Qualify real distributions and all native journeys
        run: >-
          python3 tools/studio/Weaver.Conformance.Probe/qualify.py
          --output "$RUNNER_TEMP/weaver-conformance"
          --version "$WEAVER_VERSION"

      - name: Select safe primary failure diagnostics independently of full evidence
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/weaver-conformance/report.json"; then
            python3 tools/studio/Weaver.Conformance.Probe/export_failure_diagnostic.py \
              --source "$RUNNER_TEMP/weaver-conformance" \
              --destination "$RUNNER_TEMP/weaver-failure-diagnostic"
          fi

      - name: Select evidence without private authentication or runtime state
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/weaver-conformance/report.json"; then
            python3 tools/studio/Weaver.Conformance.Probe/export_evidence.py \
              --source "$RUNNER_TEMP/weaver-conformance" \
              --destination "$RUNNER_TEMP/weaver-evidence"
          fi

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weaver-package-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weaver-evidence/
          # The exporter already selects safe references, including hidden package metadata.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Retain safe failed diagnostics without claiming qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weaver-failure-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weaver-failure-diagnostic/
          if-no-files-found: warn
          retention-days: 14

  published-image-pair:
    needs: plan-scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && needs.plan-scope.outputs.published-images == 'true'
    name: Exercise pinned published images in a real browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed workflow and harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/contributor-pair-proof/package-lock.json

      - name: Install the locked browser harness
        working-directory: tools/contributor-pair-proof
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test bounded failure diagnostics without a browser
        run: node --test tools/contributor-pair-proof/diagnostics.test.mjs

      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        with:
          working-directory: tools/contributor-pair-proof

      - name: Run the published image pair journey
        id: published-pair-journey
        run: node tools/contributor-pair-proof/run.mjs

      - name: Retain bounded published pair failure diagnostics
        if: ${{ failure() && steps.published-pair-journey.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: published-pair-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/published-pair-diagnostics/diagnostic.json
            ${{ runner.temp }}/published-pair-diagnostics/viewport.png
          retention-days: 7
          if-no-files-found: warn

  shuffled-unit-tests:
    needs: plan-scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && needs.plan-scope.outputs.studio-order == 'true'
    name: Workflows unit tests (three shuffled orders)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Studio dependencies
        uses: ./.github/actions/setup-studio

      - name: Unit tests (Workflows, shuffled)
        working-directory: studio/src/essentials/Elsa.Studio.Workflows/Client
        env:
          SHUFFLE_SEEDS: '1 11 29'
        run: |
          for seed in $SHUFFLE_SEEDS; do
            echo "::group::Shuffle seed $seed"
            if ! pnpm exec vitest run --sequence.shuffle --sequence.seed="$seed"; then
              echo "::endgroup::"
              echo "::error::Order-dependent test failure on shuffle seed $seed. Reproduce locally with: pnpm --filter @elsa-workflows/studio-workflows exec vitest run --sequence.shuffle --sequence.seed=$seed"
              exit 1
            fi
            echo "::endgroup::"
          done

  # The kernel prototype (prototypes/kernel-model, #4229), folded in from the former kernel-prototype.yml without a
  # change to its steps. The server jobs select no test shard for a change under prototypes/ (affected_tests.py), so
  # these are the prototype's own gate and nightly:
  #   - pull request: a fast gate, the deterministic simulation at a small size plus both mutation checks, the in-memory
  #     store conformance and the graph engine corpus. Target: well under its 25-minute timeout.
  #   - nightly (this workflow's schedule): the larger simulation sizes, the runtime and store conformance (built-in
  #     runtime, EF on SQLite in both fence modes) and the native smoke and cost runs.
  # The database engines that run in containers (PostgreSQL, SQL Server, MySQL and the document database) stay manual:
  # see the README. None of these is a required check, and `alert` does not need them.
  kernel-prototype-gate:
    name: Kernel prototype gate
    needs: plan-scope
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.plan-scope.outputs.kernel == 'true' || github.event_name == 'workflow_dispatch' && inputs.suite == 'kernel-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Output folders of the prototype projects, relative to prototypes/kernel-model.
      BIN: bin/Release/net10.0
    defaults:
      run:
        working-directory: prototypes/kernel-model
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: prototypes/kernel-model/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-kernel-prototype-nuget-${{ hashFiles('prototypes/kernel-model/**/packages.lock.json', 'server/essentials/tests/ActorFoundation/Simulation/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Statecharts/Run/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Graph/Tests/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Native/Recovery/Run/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Native/Migration/Run/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kernel-prototype-nuget-

      # One project at a time: they share obj/ folders through project references (README, Build). Every project
      # restores against its committed packages.lock.json in locked mode, then builds without restoring again.
      - name: Build
        run: |
          for p in ../../server/essentials/tests/ActorFoundation/Simulation ../../server/essentials/tests/Workflows/Runtime/Native/Recovery/Run ../../server/essentials/tests/Workflows/Runtime/Native/Migration/Run ../../server/essentials/tests/Workflows/Runtime/Statecharts/Run conformance/Kernel.Store.Conformance.Run conformance/Kernel.Runtime.Conformance.Run ../../server/essentials/tests/Workflows/Runtime/Graph/Tests; do
            dotnet restore "$p" --locked-mode
            dotnet build "$p" -c Release --no-restore
          done

      # K1 slice 7: the sim's --count only sizes the store's rows, so the gate runs the default, 1,024. The nightly's
      # count-4096 job runs the integrated runtime suite at 4,096.
      - name: Simulation, kernel and native, plus the lease witness
        run: |
          SIM="dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll"
          $SIM --seeds 10000
          $SIM --native --seeds 10000
          $SIM --lease-check
          dotnet ../../server/essentials/tests/Workflows/Runtime/Native/Migration/Run/$BIN/Elsa.Workflows.Runtime.Native.Migration.Run.dll --retention-pass-check
          $SIM --landed-check
          # K5: tenancy case T12, host-admin release and drain, then a kill and a takeover after lease expiry.
          $SIM --host-t12-check
          # K1 slice 5: the placement check witnesses the balancer's fewest moves, and must fail under its placement-cost mutation.
          $SIM --placement-check
          # It must fail on its checks (exit 1 with "placement: N check(s) FAILED"), not crash or reject the flaw name.
          code=0; out=$($SIM --placement-check --flaw ContiguousOnlyBalancer) || code=$?
          if [ "$code" -ne 1 ] || ! grep -Eq '^placement: [0-9]+ check\(s\) FAILED$' <<<"$out"; then echo "--placement-check did not catch ContiguousOnlyBalancer (exit $code)"; exit 1; fi
          # Round 5 C: the effect-key witnesses the sweep's mix cannot reach (a retried activation, a re-entered statechart state).
          dotnet ../../server/essentials/tests/Workflows/Runtime/Native/Recovery/Run/$BIN/Kernel.Native.Recovery.Run.dll --effect-keys
          dotnet ../../server/essentials/tests/Workflows/Runtime/Statecharts/Run/$BIN/Kernel.Statecharts.Run.dll --effect-keys

      - name: Public contract workloads
        run: |
          SIM="dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll"
          $SIM --contract --seeds 100
          $SIM --contract-native --seeds 100
          $SIM --contract-actors --seeds 100 --actions 100
          $SIM --contract-actors --seed 105 --actions 288
          $SIM --contract-evolution --seeds 100
          $SIM --contract-events --seeds 100
          $SIM --contract-http --seeds 100
          $SIM --contract-jobs --seeds 100
          $SIM --job-trial-check
          $SIM --job-result-size-check
          $SIM --held-job-result-check
          $SIM --park-kept-check
          $SIM --private-kinds-check
          $SIM --metadata-envelope-check
          $SIM --event-identity-check
          $SIM --contract-jobs --seed 1 --tree-stall
          expect_contract_failure() {
            local expected="$1"
            shift
            local code=0 output
            output=$($SIM "$@" 2>&1) || code=$?
            if [ "$code" -ne 1 ] || ! grep -Fq "$expected" <<<"$output"; then
              printf 'Unexpected contract control result (exit %s): %s\n' "$code" "$output"
              return 1
            fi
          }
          expect_contract_failure "future input must still be pending before its due time" --contract --seed 1 --flaw WallClockTimers
          expect_contract_failure "public inbox" --contract --seed 1 --flaw KeepConsumedMessages
          expect_contract_failure "effect key did not match its public actor and activation" --contract-native --seed 1 --native-flaw UnstableEffectKey
          expect_contract_failure "final join did not consume the live yes arrival and the dead no arrival" --contract-native --seed 1 --native-flaw NoDeadPaths
          expect_contract_failure "the cancel failed to reach a child whose start was still pending on the other owner" --contract-actors --seed 1 --actions 100 --flaw CancelKnownChildren
          expect_contract_failure "version two did not inherit the old token count exactly once" --contract-evolution --seed 1 --flaw SkipUpgrade
          expect_contract_failure "the correlation actor forgot an event before its waiter arrived" --contract-events --seed 1 --flaw CorrelationForgets
          expect_contract_failure "respond released its response on the wrong side of the commit" --contract-http --seed 1 --flaw EmitBeforeCommit
          expect_contract_failure "inline promotion writes the same public life, state, header, journal and live timer together" --inline-ephemeral-check --flaw ForgetShortWaits
          expect_contract_failure "an expired inline owner cannot return a successful write-free response" --inline-ephemeral-check --flaw IgnoreLeaseDeadline
          expect_contract_failure "Runner's job did not survive takeover with a distinct successor attempt" --contract-jobs --seed 1 --flaw VolatileJobTicket
          expect_contract_failure "Fragile failed to park with on trial when 3 owners were lost" --contract-jobs --seed 1 --flaw JobPoisonAsError
          expect_contract_failure "the job did not retry with a fresh physical attempt" --job-trial-check --flaw NoResetAfterFailedCommit
          expect_contract_failure "FAIL one byte over, suspended: a bounded authenticated result is stored" --job-result-size-check --flaw UnboundedJobResult
          expect_contract_failure "the successor applies the original payload under the same handle once without running the job" --held-job-result-check --flaw HoldRetainsJobTicket
          expect_contract_failure "the stale actor turn cannot replace the successor" --public-owner-check --flaw IgnoreLeaseDeadline,CommitDespiteFence

      # Both checks break the model on purpose, one flaw at a time. The kernel check runs at the README's and the
      # nightly's 20,000 seeds: NoWriteFirst is first caught at seed 3208 (6946 before K1 slice 7's set worlds), a seed
      # that has drifted before, so a smaller size would sit too close to it. The native check runs 12,000 seeds:
      # FreshTurnSwapsLoopKeys is first caught at seed 3589 since slice 7 (NATIVE.md), and the gate keeps three times that. Every kernel mutation is caught except the two FINDINGS documents as caught only
      # with the rule that covers them. --expect-total pins the number of mutations, the two flag combinations included, so one dropped or added fails.
      # K1 slice 7 added five (48): FenceSubset, SeenAtNodeEpoch, SuspectAcrossPartitions, ChildIssuerPerWorker, TrialSparesOtherPartitions.
      # K1b slice 6a: the node lease's seven mutations, each against the deterministic node-lease witnesses; all caught, pinned at 7.
      - name: Mutation checks
        run: |
          python3 ../../tools/ci/kernel_prototype_gate.py --allow-uncaught FenceWithoutPosition,DeleteWithoutCount --expect-total 48 -- \
            dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll --mutations --seeds 20000
          python3 ../../tools/ci/kernel_prototype_gate.py --allow-uncaught FlatRetryGeneration --expect-total 15 -- \
            dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll --native-mutations --seeds 12000
          python3 ../../tools/ci/kernel_prototype_gate.py --expect-total 7 -- dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll --node-lease-mutations

      # K1 slice 7: both witness cases must fail, each on the landed flush, with the k-row fence broken to land the part
      # of a flush still fenced.
      - name: Store conformance, in memory
        run: |
          STC="dotnet conformance/Kernel.Store.Conformance.Run/$BIN/Kernel.Store.Conformance.Run.dll"
          $STC semantic
          $STC semantic-flaw FenceSubset "the K1 witness" "the held flush landed"
          # K1b slice 1: the node lease's store cases, each failing on its own check under its mutation.
          $STC semantic-flaw TakeIgnoresNodeLease "NL-2" "from the live p"
          $STC semantic-flaw PlainReadEmptyFence "NL-5" "taken on the wire landed"
          $STC semantic-flaw StableNodeName "NL-6" "while its predecessor's node lease was live"

      # K1b slice 5b: `semantic` runs the loop-yield, fixed-host and watchdog checks first; the filter keeps two cases.
      - name: Runtime checks and placement
        run: dotnet conformance/Kernel.Runtime.Conformance.Run/$BIN/Kernel.Runtime.Conformance.Run.dll semantic placement

      - name: Graph engine corpus
        run: dotnet test ../../server/essentials/tests/Workflows/Runtime/Graph/Tests -c Release --no-build

      - name: Gate script self-test
        working-directory: .
        run: python3 tools/ci/kernel_prototype_gate.py --self-test

  kernel-prototype-nightly:
    name: Kernel prototype nightly
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.suite == 'kernel-nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Output folders of the prototype projects, relative to prototypes/kernel-model.
      BIN: bin/Release/net10.0
      # Throwaway value for the job-scoped database service (the K5 PostgreSQL step).
      PG_PASSWORD: kernel
    defaults:
      run:
        working-directory: prototypes/kernel-model
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
        ports: ['5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: prototypes/kernel-model/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-kernel-prototype-nuget-${{ hashFiles('prototypes/kernel-model/**/packages.lock.json', 'server/essentials/tests/ActorFoundation/Simulation/packages.lock.json', 'server/essentials/tests/ActorFoundation/Store/EntityFramework/packages.lock.json', 'server/essentials/tests/ActorFoundation/Native/Run/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Statecharts/Run/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Graph/Tests/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Native/Recovery/Run/packages.lock.json', 'server/essentials/tests/Workflows/Runtime/Native/Migration/Run/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kernel-prototype-nuget-

      - name: Build
        run: |
          for p in ../../server/essentials/tests/ActorFoundation/Simulation ../../server/essentials/tests/ActorFoundation/Native/Run ../../server/essentials/tests/Workflows/Runtime/Native/Recovery/Run ../../server/essentials/tests/Workflows/Runtime/Native/Migration/Run ../../server/essentials/tests/Workflows/Runtime/Statecharts/Run ../../server/essentials/tests/ActorFoundation/Store/EntityFramework conformance/Kernel.Store.Conformance.Run conformance/Kernel.Runtime.Conformance.Run ../../server/essentials/tests/Workflows/Runtime/Graph/Tests; do
            dotnet restore "$p" --locked-mode
            dotnet build "$p" -c Release --no-restore
          done

      # The sizes of the README's refactor gates (The gates of a refactor).
      - name: Simulation, full sizes
        run: |
          SIM="dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll"
          $SIM --seeds 200000
          $SIM --seeds 20000 --actions 1000
          $SIM --native --seeds 200000
          $SIM --native --seeds 20000 --actions 1000
          $SIM --contract --seeds 1000
          $SIM --contract-native --seeds 1000
          $SIM --contract-actors --seeds 1000 --actions 100
          $SIM --contract-actors --seed 105 --actions 288
          $SIM --contract-evolution --seeds 1000
          $SIM --contract-events --seeds 1000
          $SIM --contract-http --seeds 1000
          $SIM --contract-jobs --seeds 1000
          $SIM --job-trial-check
          $SIM --contract-jobs --seed 1 --tree-stall
          code=0; out=$($SIM --job-trial-check --flaw NoResetAfterFailedCommit 2>&1) || code=$?
          if [ "$code" -ne 1 ] || ! grep -Fq "the job did not retry with a fresh physical attempt" <<<"$out"; then printf 'Unexpected job-trial control (exit %s): %s\n' "$code" "$out"; exit 1; fi
          $SIM --lease-check
          dotnet ../../server/essentials/tests/Workflows/Runtime/Native/Migration/Run/$BIN/Elsa.Workflows.Runtime.Native.Migration.Run.dll --retention-pass-check
          $SIM --landed-check
          # K1 slice 5: the placement check witnesses the balancer's fewest moves, and must fail under its placement-cost mutation.
          $SIM --placement-check
          # It must fail on its checks (exit 1 with "placement: N check(s) FAILED"), not crash or reject the flaw name.
          code=0; out=$($SIM --placement-check --flaw ContiguousOnlyBalancer) || code=$?
          if [ "$code" -ne 1 ] || ! grep -Eq '^placement: [0-9]+ check\(s\) FAILED$' <<<"$out"; then echo "--placement-check did not catch ContiguousOnlyBalancer (exit $code)"; exit 1; fi
          # Round 5 C: the effect-key witnesses the sweep's mix cannot reach (a retried activation, a re-entered statechart state).
          dotnet ../../server/essentials/tests/Workflows/Runtime/Native/Recovery/Run/$BIN/Kernel.Native.Recovery.Run.dll --effect-keys
          dotnet ../../server/essentials/tests/Workflows/Runtime/Statecharts/Run/$BIN/Kernel.Statecharts.Run.dll --effect-keys

      - name: Mutation checks, full size
        run: |
          python3 ../../tools/ci/kernel_prototype_gate.py --allow-uncaught FenceWithoutPosition,DeleteWithoutCount --expect-total 48 -- \
            dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll --mutations --seeds 20000
          python3 ../../tools/ci/kernel_prototype_gate.py --allow-uncaught FlatRetryGeneration --expect-total 15 -- \
            dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll --native-mutations --seeds 20000
          python3 ../../tools/ci/kernel_prototype_gate.py --expect-total 7 -- dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll --node-lease-mutations

      - name: Store conformance, in memory and EF on SQLite in both fence modes
        run: |
          dotnet conformance/Kernel.Store.Conformance.Run/$BIN/Kernel.Store.Conformance.Run.dll semantic
          EFC="dotnet ../../server/essentials/tests/ActorFoundation/Store/EntityFramework/$BIN/Kernel.Ef.Conformance.dll"
          $EFC sqlite --checked-fence semantic
          $EFC sqlite --fence-in-batch semantic

      - name: Runtime conformance, built-in runtime
        run: |
          RTC="dotnet conformance/Kernel.Runtime.Conformance.Run/$BIN/Kernel.Runtime.Conformance.Run.dll"
          $RTC semantic
          $RTC semantic --partitions 1024
          $RTC stress 20 2000

      # The -broken forms break the store's fence on purpose; the runner decides whether the runtime failed as it must.
      - name: Fence broken on purpose
        run: |
          RTC="dotnet conformance/Kernel.Runtime.Conformance.Run/$BIN/Kernel.Runtime.Conformance.Run.dll"
          $RTC semantic-broken
          $RTC stress-broken 10 1000

      # K5 (#4229): graceful stop and host administration of ownership, tenancy case T12 among them.
      - name: K5, graceful stop and host administration
        run: |
          SIM="dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll"
          $SIM --host-job-drain-check
          $SIM --host-drain-check
          $SIM --host-t12-check

      # K5 on PostgreSQL: the hosted preview's lifetime, and two runtime processes with the wake signal at 4 and 1,024
      # partitions. Each run gets its own new database; a failed run fails the step at the end.
      - name: K5, PostgreSQL host lifetime and runtime cluster
        env:
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          NAT=(dotnet "../../server/essentials/tests/ActorFoundation/Native/Run/$BIN/Kernel.Native.Run.dll")
          failed=()
          for run in "pg-preview-host-lifetime" "pg-runtime-cluster 4 wake" "pg-runtime-cluster 1024 wake"; do
            db="k5_${run//[- ]/_}"
            echo "::group::$run"
            docker exec "$PG_ID" psql -U postgres -qc "CREATE DATABASE $db"
            export KERNEL_PREVIEW_POSTGRES="Host=localhost;Port=$PG_PORT;Username=postgres;Password=$PG_PASSWORD;Database=$db;SSL Mode=Disable;GSS Encryption Mode=Disable"
            read -ra arguments <<<"$run"
            if ! "${NAT[@]}" "${arguments[@]}"; then
              echo "::error::K5 PostgreSQL run failed: $run"
              failed+=("$run")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then printf 'failed: %s\n' "${failed[@]}"; exit 1; fi

      - name: Native model, smoke and cost
        run: |
          NAT="dotnet ../../server/essentials/tests/ActorFoundation/Native/Run/$BIN/Kernel.Native.Run.dll"
          $NAT smoke
          $NAT profile-capabilities
          $NAT cost sqlite
          $NAT sqlite-host-lifetime checked
          $NAT sqlite-host-lifetime in-batch
          $NAT sqlite-host-lifetime checked shipped
          $NAT sqlite-host-lifetime in-batch shipped
          $NAT sqlite-shipped-install
          $NAT sqlite-root-ingress
          $NAT sqlite-root-timed-jobs checked
          $NAT sqlite-root-timed-jobs in-batch
          $NAT sqlite-root-held-replies checked
          $NAT sqlite-root-held-replies in-batch
          $NAT sqlite-root-terminate checked
          $NAT sqlite-root-terminate in-batch
          $NAT sqlite-root-retirement checked
          $NAT sqlite-root-retirement in-batch
          $NAT sqlite-root-held-operators checked
          $NAT sqlite-root-held-operators in-batch

      - name: Graph engine corpus
        run: dotnet test ../../server/essentials/tests/Workflows/Runtime/Graph/Tests -c Release --no-build

  # K1 slice 7: the count of 4,096. The sim's --count only sizes the store's rows (PARTITIONS.md, slice 7), so it runs
  # here at reduced seeds; the integrated runtime suite qualifies 4,096 end to end. Estimate on a 4-core runner: build
  # 3 min, the two sims 4 min, the runtime suite at 4,096 about 3 min (49 s on 15 cores).
  kernel-prototype-nightly-4096:
    name: Kernel prototype nightly, 4,096 virtual partitions
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.suite == 'kernel-nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Output folders of the prototype projects, relative to prototypes/kernel-model.
      BIN: bin/Release/net10.0
    defaults:
      run:
        working-directory: prototypes/kernel-model
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: prototypes/kernel-model/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-kernel-prototype-nuget-${{ hashFiles('prototypes/kernel-model/**/packages.lock.json', 'server/essentials/tests/ActorFoundation/Simulation/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kernel-prototype-nuget-

      - name: Build
        run: |
          for p in ../../server/essentials/tests/ActorFoundation/Simulation conformance/Kernel.Runtime.Conformance.Run; do
            dotnet restore "$p" --locked-mode
            dotnet build "$p" -c Release --no-restore
          done

      - name: Simulation at 4,096, kernel and native
        run: |
          SIM="dotnet ../../server/essentials/tests/ActorFoundation/Simulation/$BIN/Kernel.Sim.dll"
          $SIM --seeds 20000 --count 4096
          $SIM --native --seeds 20000 --count 4096
          $SIM --contract --seeds 1000 --count 4096
          $SIM --contract-native --seeds 1000 --count 4096
          $SIM --contract-actors --seeds 1000 --actions 100 --count 4096
          $SIM --contract-actors --seed 105 --actions 288 --count 4096
          $SIM --contract-evolution --seeds 1000 --count 4096
          $SIM --contract-events --seeds 1000 --count 4096
          $SIM --contract-http --seeds 1000 --count 4096
          $SIM --contract-jobs --seeds 1000 --count 4096
          $SIM --job-trial-check --count 4096
          $SIM --contract-jobs --seed 1 --tree-stall --count 4096
          code=0; out=$($SIM --job-trial-check --count 4096 --flaw NoResetAfterFailedCommit 2>&1) || code=$?
          if [ "$code" -ne 1 ] || ! grep -Fq "the job did not retry with a fresh physical attempt" <<<"$out"; then printf 'Unexpected job-trial control (exit %s): %s\n' "$code" "$out"; exit 1; fi

      - name: Runtime conformance at 4,096, built-in runtime
        run: dotnet conformance/Kernel.Runtime.Conformance.Run/$BIN/Kernel.Runtime.Conformance.Run.dll semantic --partitions 4096

  nightly-nl9:
    name: Kernel prototype nightly, NL-9 node lease deadlock runs
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.suite == 'kernel-nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      BIN: bin/Release/net10.0
      # Throwaway values for the three job-scoped database services.
      PG_PASSWORD: kernel
      MSSQL_PASSWORD: Kernel_Model1
      MYSQL_PASSWORD: kernel
    defaults:
      run:
        working-directory: prototypes/kernel-model
    # Throwaway containers on tmpfs, with a free host port chosen for each service.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
        ports: ['5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_PASSWORD }}
        ports: ['1433']
        options: >-
          --user root --tmpfs /var/opt/mssql
          --health-cmd "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 10s
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        ports: ['3306']
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "MYSQL_PWD=$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: prototypes/kernel-model/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-kernel-prototype-nuget-${{ hashFiles('prototypes/kernel-model/**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kernel-prototype-nuget-

      - name: Build
        run: |
          dotnet restore ef/Kernel.Ef.Run --locked-mode
          dotnet build ef/Kernel.Ef.Run -c Release --no-restore

      # Every run goes ahead; the step fails at the end if any run's exit code was not 0.
      - name: NL-9 node lease deadlock runs
        env:
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          MSSQL_PORT: ${{ job.services.mssql.ports[1433] }}
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          NL=(dotnet "ef/Kernel.Ef.Run/$BIN/Kernel.Ef.Run.dll" x nodelease)
          PG="Host=localhost;Port=$PG_PORT;Username=postgres;Password=$PG_PASSWORD;Database=nl9"
          MS="Server=localhost,$MSSQL_PORT;User Id=sa;Password=$MSSQL_PASSWORD;TrustServerCertificate=True;Database=nl9"
          MY="server=127.0.0.1;port=$MYSQL_PORT;database=nl9;SslMode=Required"
          failed=()
          run() {
            local engine=$1 connection=$2
            shift 2
            local label="$engine $*"
            echo "::group::$label"
            if ! "${NL[@]}" "$engine" "$connection" "$@"; then
              echo "::error::NL-9 run failed: $label"
              failed+=("$label")
            fi
            echo "::endgroup::"
          }
          # The store as built: no deadlock, every case, every engine.
          for c in heartbeat mutual heartbeats; do
            run postgres "$PG" case=$c expect=none
            run sqlserver "$MS" case=$c expect=none
            run sqlserver "$MS" case=$c rcsi=0 expect=none
            run mysql "$MY" case=$c expect=none
          done
          # The negatives that deadlock on SQL Server (experiments/K1b.NodeLease/README.md, Results).
          run sqlserver "$MS" case=heartbeat rcsi=0 mutation=subquery expect=deadlock
          run sqlserver "$MS" case=mutual rcsi=0 mutation=subquery expect=deadlock
          run sqlserver "$MS" case=mutual mutation=rr expect=deadlock
          run sqlserver "$MS" case=mutual rcsi=0 mutation=rr expect=deadlock
          run sqlserver "$MS" case=heartbeats rcsi=0 mutation=membership expect=deadlock
          # NL-C1 on the other engines: hold both owners' node records and force the mutual take.
          run mysql "$MY" case=mutual mutation=rr-subquery expect=deadlock
          run postgres "$PG" case=mutual mutation=share expect=deadlock
          if [ ${#failed[@]} -ne 0 ]; then printf 'failed: %s\n' "${failed[@]}"; exit 1; fi

  # The workflow history chain runs birth, then restart and tenant in separate processes after birth renames the
  # checkpoint and journal tables. One empty database per writer and fence lane (prototypes/kernel-model/README.md).
  nightly-kernel-postgres-history:
    name: Kernel prototype nightly, PostgreSQL workflow history
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.suite == 'kernel-nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      BIN: bin/Release/net10.0
      # Throwaway value for the job-scoped database service.
      PG_PASSWORD: kernel
    defaults:
      run:
        working-directory: prototypes/kernel-model
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
        ports: ['5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: prototypes/kernel-model/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-kernel-prototype-nuget-${{ hashFiles('prototypes/kernel-model/**/packages.lock.json', 'server/essentials/tests/ActorFoundation/Native/Run/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kernel-prototype-nuget-

      - name: Build
        run: |
          dotnet restore ../../server/essentials/tests/ActorFoundation/Native/Run --locked-mode
          dotnet build ../../server/essentials/tests/ActorFoundation/Native/Run -c Release --no-restore

      # Every lane goes ahead; the step fails at the end if any phase's exit code was not 0.
      - name: Workflow history birth, restart and tenant
        env:
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          NAT=(dotnet "../../server/essentials/tests/ActorFoundation/Native/Run/$BIN/Kernel.Native.Run.dll" pg-root-workflow-history)
          failed=()
          for writer in owned ef; do
            for fence in checked in-batch; do
              label="$writer $fence"
              db="history_${writer}_${fence//-/_}"
              echo "::group::$label"
              docker exec "$PG_ID" psql -U postgres -qc "CREATE DATABASE $db"
              export KERNEL_PREVIEW_POSTGRES="Host=localhost;Port=$PG_PORT;Username=postgres;Password=$PG_PASSWORD;Database=$db;SSL Mode=Disable;GSS Encryption Mode=Disable"
              ok=false
              if out=$("${NAT[@]}" "$writer" "$fence" birth); then
                printf '%s\n' "$out"
                bookmark=$(awk '$1 == "projection-bookmark" { print $2 }' <<<"$out")
                reference=$(awk '$1 == "tenant-reference" { print $2 }' <<<"$out")
                if [ -n "$bookmark" ] && [ -n "$reference" ] &&
                    "${NAT[@]}" "$writer" "$fence" restart "$bookmark" &&
                    "${NAT[@]}" "$writer" "$fence" tenant "$bookmark" "$reference"; then
                  ok=true
                fi
              else
                printf '%s\n' "$out"
              fi
              if [ "$ok" != true ]; then
                echo "::error::Workflow history chain failed: $label"
                failed+=("$label")
              fi
              echo "::endgroup::"
            done
          done
          if [ ${#failed[@]} -ne 0 ]; then printf 'failed: %s\n' "${failed[@]}"; exit 1; fi

      # The S2 and S3 composition guards (#4229): each lane on its own new database; a failed lane fails the step at the end.
      # S7: each lane also runs against the shipped format 25's capability set ("shipped").
      - name: Root state family, all lanes
        if: ${{ !cancelled() }}
        env:
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          failed=()
          for set in composed shipped; do
            for writer in owned ef; do
              for fence in checked in-batch; do
                db="state_family_${set}_${writer}_${fence//-/_}"
                echo "::group::$set $writer $fence"
                docker exec "$PG_ID" psql -U postgres -qc "CREATE DATABASE $db"
                export KERNEL_PREVIEW_POSTGRES="Host=localhost;Port=$PG_PORT;Username=postgres;Password=$PG_PASSWORD;Database=$db;SSL Mode=Disable;GSS Encryption Mode=Disable"
                extra=(); [ "$set" = shipped ] && extra=(shipped)
                if ! dotnet "../../server/essentials/tests/ActorFoundation/Native/Run/$BIN/Kernel.Native.Run.dll" pg-root-state-family "$writer" "$fence" "${extra[@]}"; then
                  echo "::error::Root state family failed: $set $writer $fence"
                  failed+=("$set $writer $fence")
                fi
                echo "::endgroup::"
              done
            done
          done
          if [ ${#failed[@]} -ne 0 ]; then printf 'failed: %s\n' "${failed[@]}"; exit 1; fi

      # S4 adds the composed install guard beside the S2 composition guard.
      - name: Root composition and composed install, all lanes
        if: ${{ !cancelled() }}
        env:
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          failed=()
          for set in composed shipped; do
            for check in composition composed-install; do
              for writer in owned ef; do
                for fence in checked in-batch; do
                  db="${check//-/_}_${set}_${writer}_${fence//-/_}"
                  echo "::group::$check $set $writer $fence"
                  docker exec "$PG_ID" psql -U postgres -qc "CREATE DATABASE $db"
                  export KERNEL_PREVIEW_POSTGRES="Host=localhost;Port=$PG_PORT;Username=postgres;Password=$PG_PASSWORD;Database=$db;SSL Mode=Disable;GSS Encryption Mode=Disable"
                  extra=(); [ "$set" = shipped ] && extra=(shipped)
                  if ! dotnet "../../server/essentials/tests/ActorFoundation/Native/Run/$BIN/Kernel.Native.Run.dll" "pg-root-$check" "$writer" "$fence" "${extra[@]}"; then
                    echo "::error::Root $check failed: $set $writer $fence"
                    failed+=("$check $set $writer $fence")
                  fi
                  echo "::endgroup::"
                done
              done
            done
          done
          if [ ${#failed[@]} -ne 0 ]; then printf 'failed: %s\n' "${failed[@]}"; exit 1; fi

      # S7: the shipped format 25 hosted as a host runs it, and the S5a parked-operator guard on its capability set.
      - name: Shipped format 25
        if: ${{ !cancelled() }}
        env:
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          failed=()
          for run in "pg-shipped-format" "pg-root-parked-operators owned in-batch shipped" "pg-root-parked-operators ef checked shipped"; do
            db="shipped_$(tr -c 'a-z0-9' '_' <<<"$run")"
            echo "::group::$run"
            docker exec "$PG_ID" psql -U postgres -qc "CREATE DATABASE ${db:0:60}"
            export KERNEL_PREVIEW_POSTGRES="Host=localhost;Port=$PG_PORT;Username=postgres;Password=$PG_PASSWORD;Database=${db:0:60};SSL Mode=Disable;GSS Encryption Mode=Disable"
            read -ra arguments <<<"$run"
            if ! dotnet "../../server/essentials/tests/ActorFoundation/Native/Run/$BIN/Kernel.Native.Run.dll" "${arguments[@]}"; then
              echo "::error::Shipped format run failed: $run"
              failed+=("$run")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then printf 'failed: %s\n' "${failed[@]}"; exit 1; fi

  nightly-kernel-mysql:
    name: Kernel prototype nightly, MySQL provider
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.suite == 'kernel-nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BIN: bin/Release/net10.0
      # EngineRun uses this test credential to disconnect only its MySQL worker sessions.
      MYSQL_PASSWORD: kernel
    defaults:
      run:
        shell: bash
        working-directory: prototypes/kernel-model
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        ports: ['3306']
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: prototypes/kernel-model/global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-kernel-prototype-nuget-${{ hashFiles('prototypes/kernel-model/**/packages.lock.json', 'server/essentials/tests/ActorFoundation/Store/EntityFramework/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kernel-prototype-nuget-
      - name: Build provider runners
        id: build
        run: |
          for project in ../../server/essentials/tests/ActorFoundation/Store/EntityFramework ef/Kernel.Ef.Run; do
            dotnet restore "$project" --locked-mode
            dotnet build "$project" -c Release --no-restore
          done

      - name: MySQL store conformance
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          server="server=127.0.0.1;port=$MYSQL_PORT;uid=root;pwd=$MYSQL_PASSWORD;SslMode=Required"
          failed=0
          for writer in ef owned; do
            for fence in checked-fence fence-in-batch; do
              dotnet "../../server/essentials/tests/ActorFoundation/Store/EntityFramework/$BIN/Kernel.Ef.Conformance.dll" mysql "$server" "--$writer-commit" "--$fence" semantic || failed=1
            done
          done
          exit "$failed"

      - name: MySQL owned commit under connection loss
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          db="server=127.0.0.1;port=$MYSQL_PORT;database=kernel_stress;SslMode=Required"
          failed=0
          for fence in checked batch; do
            log="$RUNNER_TEMP/kernel-mysql-stress-$fence.log"
            dotnet "ef/Kernel.Ef.Run/$BIN/Kernel.Ef.Run.dll" x stress mysql "$db" commit=owned "fence=$fence" seconds=40 messages=5000 | tee "$log" || failed=1
            if ! grep -Eq '^SUMMARY .*\| kills [1-9][0-9]* \|' "$log"; then
              echo "::error::No worker sessions were disconnected under fence=$fence"
              failed=1
            fi
          done
          exit "$failed"
