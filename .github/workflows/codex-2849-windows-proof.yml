name: Architecture checkout Windows proof

on:
  push:
    branches: [agent/codex/2849-windows-guards]

permissions:
  contents: read

jobs:
  windows-proof:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_PROCESSOR_COUNT: 3
      ARCHITECTURE_BASE: fd0fdb21eacabe690183ff761432746e9c7e680c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore the two reviewed architecture graphs
        shell: bash
        run: bash tools/architecture/restore-ci-project-graph.sh --locked-mode -p:WarningsNotAsErrors=NU1603

      - name: Build the architecture tests
        shell: pwsh
        run: dotnet build Essentials/tests/Architecture/Tests/Elsa.Architecture.Tests.csproj -c Release --no-restore -p:WarningsNotAsErrors=NU1603

      - name: Prove Windows cleanup and tracked guard coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $project = 'Essentials/tests/Architecture/Tests/Elsa.Architecture.Tests.csproj'
          $output = Join-Path $env:RUNNER_TEMP 'architecture-2849'
          New-Item -ItemType Directory -Path $output | Out-Null
          $worktree = '.claude/worktrees/guard-2849'
          $family = 'Ground' + 'work'
          $leftovers = "tools/$family"
          $probeProject = 'tools/WindowsGuard2849'
          $changedTests = @(
            'Essentials/tests/Architecture/Tests/PackageVersioningPackTests.cs',
            'Essentials/tests/Architecture/Tests/EfCoreDependencyGuardTests.cs',
            'Essentials/tests/Architecture/Tests/RetiredPersistenceFamilyGuardTests.cs'
          )
          $conditional = 'Elsa.Architecture.Tests.EfCoreDependencyGuardTests.First_party_dependency_edges_cannot_be_conditionally_hidden_from_the_reviewed_restore_graphs'
          $namedPath = 'Elsa.Architecture.Tests.RetiredPersistenceFamilyGuardTests.No_project_or_directory_is_named_after_a_retired_persistence_family'
          $packClass = 'Elsa.Architecture.Tests.PackageVersioningPackTests'
          $existingPackDirectories = @(Get-ChildItem ([IO.Path]::GetTempPath()) -Directory -Filter 'PackageVersioningPackTests*' | ForEach-Object FullName)

          function Test-Run([string] $name, [string] $filter, [bool] $expectedFailure, [string] $failureText = '') {
            $arguments = @('test', $project, '-c', 'Release', '--no-build', '--no-restore', '--logger', "trx;LogFileName=$name.trx", '--results-directory', $output)
            if ($filter) { $arguments += @('--filter', $filter) }
            & dotnet @arguments 2>&1 | Tee-Object (Join-Path $output "$name.log") | Write-Host
            $code = $LASTEXITCODE
            [xml] $trx = Get-Content (Join-Path $output "$name.trx") -Raw
            $counts = $trx.TestRun.ResultSummary.Counters
            if ([int]$counts.total -eq 0 -or [int]$counts.notExecuted -ne 0) { throw "$name did not execute all selected cases." }
            if ($expectedFailure) {
              $failed = @($trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed')
              if ($code -eq 0 -or $failed.Count -eq 0) { throw "$name did not detect its negative control." }
              if ($failureText -and -not ($failed.Output.ErrorInfo.Message -like "*$failureText*")) { throw "$name failed without the expected diagnostic." }
            } elseif ($code -ne 0 -or [int]$counts.failed -ne 0 -or [int]$counts.passed -ne [int]$counts.total) {
              throw "$name did not pass every selected case."
            }
            return $trx
          }

          function Remove-OwnedDirectory([string] $path) {
            if (Test-Path $path) {
              Get-ChildItem $path -Recurse -Force -File | ForEach-Object { $_.IsReadOnly = $false }
              Remove-Item $path -Recurse -Force
            }
          }

          try {
            if ((Test-Path $worktree) -or (Test-Path $leftovers) -or (Test-Path $probeProject)) { throw 'An owned proof path already exists.' }
            git worktree add --detach $worktree HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the ignored Claude worktree.' }
            New-Item -ItemType Directory -Path "$leftovers/obj" -Force | Out-Null
            Set-Content "$leftovers/obj/leftover.txt" 'Untracked build output'

            git restore --source=$env:ARCHITECTURE_BASE --worktree -- @changedTests
            if ($LASTEXITCODE -ne 0) { throw 'Could not materialize the original test implementations.' }
            dotnet build $project -c Release --no-restore --no-dependencies -p:WarningsNotAsErrors=NU1603
            if ($LASTEXITCODE -ne 0) { throw 'The original test implementations did not build.' }
            $baseline = Test-Run 'baseline' "FullyQualifiedName~$packClass|FullyQualifiedName=$conditional|FullyQualifiedName=$namedPath" $true
            $baselineFailures = @($baseline.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed')
            $packFailures = @($baselineFailures | Where-Object testName -like '*PackageVersioningPackTests*')
            if ($packFailures.Count -ne 6 -or @($packFailures | Where-Object { $_.Output.ErrorInfo.Message -notlike '*UnauthorizedAccessException*' }).Count -ne 0) {
              throw 'The original six pack tests did not expose native read-only cleanup failures.'
            }
            if (@($baselineFailures | Where-Object testName -like '*First_party_dependency_edges_cannot*').Count -ne 1 -or
                @($baselineFailures | Where-Object testName -like '*No_project_or_directory_is_named*').Count -ne 1) {
              throw 'The original guards did not expose the untracked-checkout failures.'
            }

            git restore --source=HEAD --worktree -- @changedTests
            dotnet build $project -c Release --no-restore --no-dependencies -p:WarningsNotAsErrors=NU1603
            if ($LASTEXITCODE -ne 0) { throw 'The corrected architecture tests did not build.' }
            dotnet test $project -c Release --no-build --no-restore --list-tests 2>&1 | Tee-Object (Join-Path $output 'discovery.log') | Write-Host
            if ($LASTEXITCODE -ne 0) { throw 'Architecture discovery failed.' }
            $full = Test-Run 'full' '' $false
            $listed = @(Get-Content (Join-Path $output 'discovery.log') | Where-Object { $_ -match '^\s+Elsa\.Architecture\.Tests\.' } | ForEach-Object { ($_.Trim() -split '\(')[0] } | Sort-Object -Unique)
            $executed = @($full.TestRun.TestDefinitions.UnitTest | ForEach-Object {
              $methodName = ($_.TestMethod.name -split '\(')[0]
              '{0}.{1}' -f $_.TestMethod.className, $methodName
            } | Sort-Object -Unique)
            if ($listed.Count -eq 0 -or @(Compare-Object $listed $executed).Count -ne 0) { throw 'Architecture discovery and executed methods disagree.' }
            [ordered]@{ source = (git rev-parse HEAD); listedMethods = $listed.Count; executedMethods = $executed.Count; executedCases = [int]$full.TestRun.ResultSummary.Counters.executed } |
              ConvertTo-Json | Set-Content (Join-Path $output 'architecture-source-and-counts.json')

            $conditionalProbe = '.claude/worktrees/tracked-guard-2849/Conditional.csproj'
            New-Item -ItemType Directory -Path (Split-Path $conditionalProbe) -Force | Out-Null
            Set-Content $conditionalProbe '<Project><ItemGroup Condition="''$(Configuration)'' == ''Debug''"><PackageReference Include="Contoso.Probe" /></ItemGroup></Project>'
            git add -f -- $conditionalProbe
            try { $null = Test-Run 'tracked-conditional' "FullyQualifiedName=$conditional" $true 'Conditional.csproj' }
            finally { git rm --cached -f -- $conditionalProbe; Remove-OwnedDirectory (Split-Path $conditionalProbe) }

            $retiredProject = "$probeProject/$family.csproj"
            New-Item -ItemType Directory -Path $probeProject | Out-Null
            Set-Content $retiredProject '<Project />'
            git add -f -- $retiredProject
            try { $null = Test-Run 'tracked-project-name' "FullyQualifiedName=$namedPath" $true 'project path names a retired persistence family' }
            finally { git rm --cached -f -- $retiredProject; Remove-OwnedDirectory $probeProject }

            $directoryProbe = "$leftovers/tracked-2849.txt"
            Set-Content $directoryProbe 'Tracked directory probe'
            git add -f -- $directoryProbe
            try { $null = Test-Run 'tracked-directory-name' "FullyQualifiedName=$namedPath" $true 'directory names a retired persistence family' }
            finally { git rm --cached -f -- $directoryProbe; Remove-Item $directoryProbe -Force }

            $null = Test-Run 'restored-guards' "FullyQualifiedName=$conditional|FullyQualifiedName=$namedPath" $false
            git diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'The witness left tracked source changes.' }
            git diff --cached --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'The witness left staged mutations.' }
          } finally {
            git restore --source=HEAD --worktree -- @changedTests
            if (Test-Path $worktree) { git worktree remove --force $worktree }
            Remove-OwnedDirectory $leftovers
            Remove-OwnedDirectory $probeProject
            Get-ChildItem ([IO.Path]::GetTempPath()) -Directory -Filter 'PackageVersioningPackTests*' |
              Where-Object { $_.FullName -notin $existingPackDirectories } | ForEach-Object { Remove-OwnedDirectory $_.FullName }
          }

      - name: Set native Windows Git checkout policy for the separate fixture qualification
        if: always()
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout the independent fixture fix at its exact source
        if: always()
        uses: actions/checkout@v4
        with:
          ref: 39c9290671c211a44b41778d703e905cf2f94c94
          path: fixture-3253
          persist-credentials: false

      - name: Qualify the retained fixture tests separately on native Windows
        if: always()
        shell: pwsh
        working-directory: fixture-3253
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'fixture-3253'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $source = git rev-parse HEAD
          if ($source -ne '39c9290671c211a44b41778d703e905cf2f94c94' -or (git config core.autocrlf) -ne 'true') { throw 'Fixture source or checkout policy differs.' }
          git check-attr text -- Extensions/Etl/tests/Shared/Fixtures/V1/data/manifest.json | Set-Content (Join-Path $output 'attributes.log')
          $project = 'Extensions/Etl/tests/Tests/Elsa.Etl.Tests.csproj'
          dotnet restore $project --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Fixture test restore failed.' }
          dotnet test $project -c Release --no-restore --filter FullyQualifiedName~EtlV1CompatibilityFixtureTests --logger 'trx;LogFileName=fixture.trx' --results-directory $output
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows fixture tests failed.' }
          dotnet test $project -c Release --no-build --no-restore --filter FullyQualifiedName~EtlV1CompatibilityFixtureTests --list-tests | Set-Content (Join-Path $output 'discovery.log')
          if ($LASTEXITCODE -ne 0) { throw 'Fixture test discovery failed.' }
          [xml] $trx = Get-Content (Join-Path $output 'fixture.trx') -Raw
          $counts = $trx.TestRun.ResultSummary.Counters
          $listed = @(Get-Content (Join-Path $output 'discovery.log') | Where-Object { $_ -match '^\s+Elsa\.Etl\.Tests\.EtlV1CompatibilityFixtureTests\.' })
          if ($listed.Count -ne 3 -or [int]$counts.executed -ne 3 -or [int]$counts.passed -ne 3 -or [int]$counts.failed -ne 0 -or [int]$counts.notExecuted -ne 0) { throw 'The exact source did not execute all three retained fixture cases.' }
          [ordered]@{ source = $source; coreAutocrlf = (git config core.autocrlf); discovered = $listed.Count; executed = [int]$counts.executed; passed = [int]$counts.passed } |
            ConvertTo-Json | Set-Content (Join-Path $output 'fixture-source-and-counts.json')
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'The fixture qualification changed its source.' }

      - name: Retain the separate source and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-2849-and-3253-${{ github.sha }}
          path: |
            ${{ runner.temp }}/architecture-2849
            ${{ runner.temp }}/fixture-3253
          if-no-files-found: error
          retention-days: 14
