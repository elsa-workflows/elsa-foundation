<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d">
<title id="t">Elsa 4 target architecture: one platform, multiple execution models</title>
<desc id="d">Four layers. Shared authoring and operations in Elsa Studio. Three execution models, native workflows, BPMN processes and ETL pipelines, plus an extension slot. A shared durable runtime foundation. Hosting and distributed work, with execution coordination and work execution.</desc>
<defs><marker id="ah-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8F8C80" class="f-rail"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706" class="f-b-main"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F9488" class="f-e-main"/></marker>
<clipPath id="clip-bpmn"><rect x="80" y="324" width="360" height="296" rx="20"/></clipPath><clipPath id="clip-native"><rect x="480" y="324" width="660" height="296" rx="20"/></clipPath><clipPath id="clip-etl"><rect x="1180" y="324" width="360" height="296" rx="20"/></clipPath><clipPath id="clip-slot"><rect x="1580" y="324" width="260" height="296" rx="20"/></clipPath></defs>
<rect width="1920" height="1080" fill="#F7F6F2" class="f-bg"/>
<g id="header"><text x="80" y="46" font-size="20" font-weight="700" fill="#5B6068" class="f-muted" letter-spacing="3">ELSA 4   ·   ROADMAP</text><text x="80" y="102" font-size="52" fill="#14161A" class="f-ink" letter-spacing="-0.6"><tspan font-weight="700">One platform.</tspan><tspan font-weight="400" dx="16">Multiple execution models.</tspan></text><rect x="1507" y="28" width="333" height="38" rx="19" fill="none" stroke="#8F8C80" stroke-width="1.5" stroke-dasharray="5 5" class="s-rail"/><text x="1673.5" y="53" font-size="20" font-weight="700" fill="#5B6068" class="f-muted" text-anchor="middle" letter-spacing="2.4">TARGET ARCHITECTURE</text><text x="1840" y="100" font-size="20" font-weight="400" fill="#5B6068" class="f-muted" text-anchor="end">Proposed or possible</text><rect x="1609.2401580810547" y="86" width="30" height="18" rx="9" fill="none" stroke="#8F8C80" stroke-width="1.75" stroke-dasharray="4 3" class="s-rail"/><text x="1575.2401580810547" y="100" font-size="20" font-weight="400" fill="#5B6068" class="f-muted" text-anchor="end">Target capability</text><rect x="1389.5003204345703" y="86" width="30" height="18" rx="9" fill="#E2E0D8" class="f-chip"/></g>
<g id="layer-authoring" class="layer" data-level="layer" data-detail="authoring"><rect x="80" y="140" width="1760" height="124" rx="22" fill="#EDECE6" class="f-band"/><text x="112" y="176" font-size="20" font-weight="700" fill="#5B6068" class="f-muted" letter-spacing="2.2">1   SHARED AUTHORING &amp; OPERATIONS</text><text x="1808" y="177" font-size="24" font-weight="700" fill="#14161A" class="f-ink" text-anchor="end">Elsa Studio  ·  design  ·  inspect  ·  operate</text><rect x="268.5" y="196" width="223" height="52" rx="26" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><circle cx="296.5" cy="222" r="6" fill="#D97706" class="f-b-main"/><text x="314.5" y="229.5" font-size="22" font-weight="600" fill="#14161A" class="f-ink">BPMN modeler</text><rect x="679.5" y="196" width="261" height="52" rx="26" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><circle cx="707.5" cy="222" r="6" fill="#4F46E5" class="f-n-main"/><text x="725.5" y="229.5" font-size="22" font-weight="600" fill="#14161A" class="f-ink">Workflow designer</text><rect x="1237.5" y="196" width="245" height="52" rx="26" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><circle cx="1265.5" cy="222" r="6" fill="#0F9488" class="f-e-main"/><text x="1283.5" y="229.5" font-size="22" font-weight="600" fill="#14161A" class="f-ink">Pipeline designer</text><rect x="1605.5" y="196" width="209" height="52" rx="26" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="1633.5" cy="222" r="6" fill="none" stroke="#8F8C80" stroke-width="2" stroke-dasharray="3 2" class="s-rail"/><text x="1651.5" y="229.5" font-size="22" font-weight="600" fill="#14161A" class="f-ink">Its own editor</text></g>
<g id="layer-models" class="layer" data-level="layer" data-detail="models"><text x="80" y="302" font-size="20" font-weight="700" fill="#5B6068" class="f-muted" letter-spacing="2.2">2   EXECUTION MODELS</text><g id="model-bpmn" class="card" data-level="card" data-detail="bpmn"><rect x="80" y="324" width="360" height="296" rx="20" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><g clip-path="url(#clip-bpmn)"><rect x="80" y="324" width="360" height="8" fill="#D97706" class="f-b-main"/></g><text x="112" y="378" font-size="34" font-weight="700" fill="#14161A" class="f-ink">BPMN processes</text><rect x="112" y="392" width="147" height="40" rx="20" fill="#FBEBD0" class="f-b-tint"/><text x="185.5" y="419.48" font-size="22" font-weight="500" fill="#8A4B00" class="f-b-ink" text-anchor="middle">Direct host</text><rect x="112" y="442" width="261" height="40" rx="20" fill="#FBEBD0" class="f-b-tint"/><text x="242.5" y="469.48" font-size="22" font-weight="500" fill="#8A4B00" class="f-b-ink" text-anchor="middle">Embedded via activity</text><text x="112" y="526" font-size="22" font-weight="700" fill="#8A4B00" class="f-b-ink">One shared interpreter</text><text x="112" y="554" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">Owns tokens, events,</text><text x="112" y="582" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">gateways and scopes.</text></g><g id="model-native" class="card" data-level="card" data-detail="native"><rect x="480" y="324" width="660" height="296" rx="20" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><g clip-path="url(#clip-native)"><rect x="480" y="324" width="660" height="8" fill="#4F46E5" class="f-n-main"/></g><text x="512" y="378" font-size="34" font-weight="700" fill="#14161A" class="f-ink">Native workflows</text><rect x="512" y="392" width="138" height="40" rx="20" fill="#E8E7FB" class="f-n-tint"/><text x="581" y="419.48" font-size="22" font-weight="500" fill="#3730A3" class="f-n-ink" text-anchor="middle">Sequence</text><rect x="662" y="392" width="137" height="40" rx="20" fill="#E8E7FB" class="f-n-tint"/><text x="730.5" y="419.48" font-size="22" font-weight="500" fill="#3730A3" class="f-n-ink" text-anchor="middle">Flowchart</text><rect x="811" y="392" width="177" height="40" rx="20" fill="#FFFFFF" class="f-surface s-n-main" stroke="#4F46E5" stroke-width="1.75" stroke-dasharray="5 4"/><text x="899.5" y="419.48" font-size="22" font-weight="500" fill="#3730A3" class="f-n-ink" text-anchor="middle">StateMachine</text><rect x="512" y="442" width="258" height="40" rx="20" fill="#FFFFFF" class="f-surface s-b-main" stroke="#D97706" stroke-width="2.25"/><text x="641" y="469.48" font-size="22" font-weight="500" fill="#8A4B00" class="f-b-ink" text-anchor="middle">BpmnProcess activity</text><rect x="867" y="442" width="241" height="40" rx="20" fill="#FFFFFF" class="f-surface s-e-main" stroke="#0F9488" stroke-width="2.25"/><text x="987.5" y="469.48" font-size="22" font-weight="500" fill="#0B5F58" class="f-e-ink" text-anchor="middle">ETL pipeline activity</text><rect x="512" y="492" width="235" height="40" rx="20" fill="#E8E7FB" class="f-n-tint"/><text x="629.5" y="519.48" font-size="22" font-weight="500" fill="#3730A3" class="f-n-ink" text-anchor="middle">Agent collaboration</text><text x="512" y="576" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">Each composition owns its sequencing,</text><text x="512" y="604" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">routing and joining rules.</text></g><g id="model-etl" class="card" data-level="card" data-detail="etl"><rect x="1180" y="324" width="360" height="296" rx="20" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><g clip-path="url(#clip-etl)"><rect x="1180" y="324" width="360" height="8" fill="#0F9488" class="f-e-main"/></g><text x="1212" y="378" font-size="34" font-weight="700" fill="#14161A" class="f-ink">ETL pipelines</text><rect x="1212" y="392" width="209" height="40" rx="20" fill="#D3EFEB" class="f-e-tint"/><text x="1316.5" y="419.48" font-size="22" font-weight="500" fill="#0B5F58" class="f-e-ink" text-anchor="middle">Partition workers</text><rect x="1212" y="442" width="231" height="40" rx="20" fill="#D3EFEB" class="f-e-tint"/><text x="1327.5" y="469.48" font-size="22" font-weight="500" fill="#0B5F58" class="f-e-ink" text-anchor="middle">Invoked via activity</text><text x="1212" y="526" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">Batch and continuous.</text><text x="1212" y="554" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">Owns partitions,</text><text x="1212" y="582" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">checkpoints, backpressure.</text></g><g id="model-slot" class="card" data-level="card" data-detail="slot"><rect x="1580" y="324" width="260" height="296" rx="20" fill="#FFFFFF" class="f-surface s-rail" stroke="#8F8C80" stroke-width="2" stroke-dasharray="9 7"/><text x="1608" y="378" font-size="22" font-weight="700" fill="#5B6068" class="f-muted">Additional</text><text x="1608" y="406" font-size="22" font-weight="700" fill="#5B6068" class="f-muted">execution models</text><text x="1608" y="486" font-size="64" font-weight="300" fill="#8F8C80" class="f-rail">+ n</text><text x="1608" y="526" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">Extension point for</text><text x="1608" y="554" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">separately packaged</text><text x="1608" y="582" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">models.</text></g></g>
<g id="layer-foundation" class="layer" data-level="layer" data-detail="foundation"><rect x="80" y="660" width="1760" height="128" rx="22" fill="#EDECE6" class="f-band"/><text x="112" y="696" font-size="20" font-weight="700" fill="#5B6068" class="f-muted" letter-spacing="2.2">3   SHARED DURABLE RUNTIME FOUNDATION</text><text x="1808" y="696" font-size="22" font-weight="400" fill="#5B6068" class="f-muted" text-anchor="end">Shared contracts and infrastructure. Each model keeps its own state and semantics.</text><rect x="112" y="712" width="412" height="60" rx="14" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><text x="134" y="738" font-size="22" font-weight="600" fill="#14161A" class="f-ink">Execution identity</text><text x="134" y="763" font-size="22" font-weight="600" fill="#14161A" class="f-ink">and lifecycle</text><rect x="540" y="712" width="412" height="60" rx="14" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><text x="562" y="738" font-size="22" font-weight="600" fill="#14161A" class="f-ink">Durable state</text><text x="562" y="763" font-size="22" font-weight="600" fill="#14161A" class="f-ink">and delivery</text><rect x="968" y="712" width="412" height="60" rx="14" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><text x="990" y="738" font-size="22" font-weight="600" fill="#14161A" class="f-ink">Timers, correlation</text><text x="990" y="763" font-size="22" font-weight="600" fill="#14161A" class="f-ink">and recovery</text><rect x="1396" y="712" width="412" height="60" rx="14" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><text x="1418" y="738" font-size="22" font-weight="600" fill="#14161A" class="f-ink">Work dispatch</text><text x="1418" y="763" font-size="22" font-weight="600" fill="#14161A" class="f-ink">and observability</text></g>
<g id="layer-hosting" class="layer" data-level="layer" data-detail="hosting"><rect x="80" y="832" width="1760" height="200" rx="22" fill="#EDECE6" class="f-band"/><text x="112" y="868" font-size="20" font-weight="700" fill="#5B6068" class="f-muted" letter-spacing="2.2">4   HOSTING &amp; DISTRIBUTED WORK</text><text x="1808" y="868" font-size="22" font-weight="400" fill="#5B6068" class="f-muted" text-anchor="end">Decides placement and coordination, never model semantics.</text><g id="hosting-coordination"><rect x="112" y="884" width="800" height="128" rx="16" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><text x="136" y="922" font-size="28" font-weight="700" fill="#14161A" class="f-ink">Execution coordination</text><text x="136" y="952" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">One actor or virtual actor per execution, not per activity.</text><rect x="136" y="964" width="144" height="38" rx="19" fill="#E2E0D8" class="f-chip"/><text x="208" y="989.8" font-size="20" font-weight="500" fill="#14161A" class="f-ink" text-anchor="middle">Built-in host</text><rect x="290" y="964" width="104" height="38" rx="19" fill="#FFFFFF" class="f-surface s-rail" stroke="#8F8C80" stroke-width="1.75" stroke-dasharray="5 4"/><text x="342" y="989.8" font-size="20" font-weight="500" fill="#5B6068" class="f-muted" text-anchor="middle">Orleans</text><rect x="404" y="964" width="138" height="38" rx="19" fill="#FFFFFF" class="f-surface s-rail" stroke="#8F8C80" stroke-width="1.75" stroke-dasharray="5 4"/><text x="473" y="989.8" font-size="20" font-weight="500" fill="#5B6068" class="f-muted" text-anchor="middle">Proto.Actor</text><text x="556" y="990" font-size="20" font-weight="400" fill="#5B6068" class="f-muted">possible adapters</text></g><g id="hosting-work"><rect x="1042" y="884" width="766" height="128" rx="16" fill="#FFFFFF" class="f-surface s-line" stroke="#D6D3C9" stroke-width="1.5"/><text x="1066" y="922" font-size="28" font-weight="700" fill="#14161A" class="f-ink">Work execution</text><text x="1066" y="952" font-size="22" font-weight="400" fill="#5B6068" class="f-muted">Runs dispatched work and reports completion.</text><rect x="1066" y="964" width="162" height="38" rx="19" fill="#E2E0D8" class="f-chip"/><text x="1147" y="989.8" font-size="20" font-weight="500" fill="#14161A" class="f-ink" text-anchor="middle">Local workers</text><rect x="1238" y="964" width="163" height="38" rx="19" fill="#E2E0D8" class="f-chip"/><text x="1319.5" y="989.8" font-size="20" font-weight="500" fill="#14161A" class="f-ink" text-anchor="middle">External tasks</text><rect x="1411" y="964" width="230" height="38" rx="19" fill="#E2E0D8" class="f-chip"/><text x="1526" y="989.8" font-size="20" font-weight="500" fill="#14161A" class="f-ink" text-anchor="middle">ETL partition workers</text></g><text x="977" y="924" font-size="20" font-weight="400" fill="#5B6068" class="f-muted" text-anchor="middle">dispatch</text><line x1="924" y1="936" x2="1030" y2="936" stroke="#8F8C80" stroke-width="2.5" class="s-rail" marker-end="url(#ah-rail)"/><line x1="1030" y1="976" x2="924" y2="976" stroke="#8F8C80" stroke-width="2.5" class="s-rail" marker-end="url(#ah-rail)"/><text x="977" y="1002" font-size="20" font-weight="400" fill="#5B6068" class="f-muted" text-anchor="middle">completion</text></g>
<g id="connectors" class="connectors"><line x1="810" y1="248" x2="810" y2="321" stroke="#8F8C80" stroke-width="2.25" class="s-rail" marker-end="url(#ah-rail)"/><line x1="810" y1="620" x2="810" y2="656" stroke="#8F8C80" stroke-width="2.25" class="s-rail" marker-end="url(#ah-rail)"/><line x1="380" y1="248" x2="380" y2="321" stroke="#8F8C80" stroke-width="2.25" class="s-rail" marker-end="url(#ah-rail)"/><line x1="380" y1="620" x2="380" y2="656" stroke="#8F8C80" stroke-width="2.25" class="s-rail" marker-end="url(#ah-rail)"/><line x1="1360" y1="248" x2="1360" y2="321" stroke="#8F8C80" stroke-width="2.25" class="s-rail" marker-end="url(#ah-rail)"/><line x1="1360" y1="620" x2="1360" y2="656" stroke="#8F8C80" stroke-width="2.25" class="s-rail" marker-end="url(#ah-rail)"/><line x1="1710" y1="248" x2="1710" y2="321" stroke="#8F8C80" stroke-width="2.25" stroke-dasharray="6 5" class="s-rail" marker-end="url(#ah-rail)"/><line x1="1710" y1="620" x2="1710" y2="656" stroke="#8F8C80" stroke-width="2.25" stroke-dasharray="6 5" class="s-rail" marker-end="url(#ah-rail)"/><line x1="508" y1="462" x2="377" y2="462" stroke="#D97706" stroke-width="2.75" class="s-b-main" marker-end="url(#ah-amber)"/><line x1="1112" y1="462" x2="1208" y2="462" stroke="#0F9488" stroke-width="2.75" class="s-e-main" marker-end="url(#ah-teal)"/><line x1="960" y1="788" x2="960" y2="828" stroke="#8F8C80" stroke-width="2.25" class="s-rail"/><text x="976" y="816" font-size="20" font-weight="400" fill="#5B6068" class="f-muted">runs on</text></g>
</svg>