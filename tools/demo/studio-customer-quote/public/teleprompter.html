<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elsa Studio teleprompter</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif}button,select,input{font:inherit}button,select{border:1px solid #b5becb;border-radius:5px;padding:8px 12px;background:white;color:#1b283b}button:disabled{opacity:.35}button:not(:disabled),select{cursor:pointer}:focus-visible{outline:3px solid #1670d1;outline-offset:3px}a{color:#1765a8}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}body{background:#111820;color:#f3f5f8;height:100dvh;display:flex;flex-direction:column}header{background:#1a2532;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 20px;flex-shrink:0}header button,header select,footer button{background:#222f3e;color:#f3f5f8;border-color:#5b6d83}header label{display:flex;gap:8px;align-items:center;font-size:14px;color:#c1ccda}input{width:90px}header a{color:#b0d4ff;margin-left:auto}#prompt{overflow:auto;flex:1;min-height:0;scroll-behavior:auto;overscroll-behavior:contain;padding:35px max(25px,calc((100vw - 820px)/2)) 35vh}article{font-size:var(--script-size,36px);line-height:1.65;letter-spacing:.005em}h1{font-size:.85em;line-height:1.3;margin:0 0 28px;color:#b9d9fb}p{margin:0 0 1em}.cue{font-size:.52em;line-height:1.5;color:#a9c4df;border-left:3px solid #6e9ccd;padding-left:16px;margin-bottom:38px}footer{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 20px;background:#1a2532;font-size:14px;flex-shrink:0}#status{color:#c2ccda}.hint{margin-left:auto;color:#aab8c8}@media(max-width:650px){header{padding:10px;gap:8px}header select{max-width:100%}header a{margin-left:0}.hint{width:100%;margin-left:0}#prompt{padding:25px 20px 30vh}article{font-size:min(var(--script-size,36px),8vw)}}@media print{header,footer{display:none}body{display:block;background:white;color:black;height:auto}#prompt{overflow:visible;padding:0}article{font-size:18pt}.cue,h1{color:black}}</style></head><body><header><label class="sr-only" for="chapter">Chapter</label><select id="chapter"><option value="0">1. Customer quote</option><option value="1">2. API access</option><option value="2">3. Reusable calculation</option><option value="3">4. Quote workflow</option><option value="4">5. Runtime diagnosis</option><option value="5">6. Secret rotation</option></select><button id="start" aria-pressed="false">Start scrolling</button><button id="restart">Restart chapter</button><label>Text <input id="size" aria-label="Text size" type="range" min="26" max="52" value="36"></label><label>Speed <input id="speed" aria-label="Scroll speed" type="range" min="10" max="70" value="25"></label><a href="slides.html" target="_blank" rel="noopener">Slides</a></header><main id="prompt" tabindex="0" aria-label="Teleprompter script"><article id="script"></article></main><footer><button id="previous">Previous chapter</button><span id="status" role="status">Paused</span><button id="next">Next chapter</button><span class="hint">Space to pause or resume. Left and right to change chapter.</span></footer><script>const chapters=[{"id":"quote","title":"Customer quote","headline":"A customer and a total","lines":["Protected customer lookup","Reusable calculation","One JSON response"],"cue":"Show this slide, then open the prepared quote workflow in Studio.","paragraphs":["I’ll walk through the prepared quote workflow. It uses a local customer API and a small calculation to return a customer and total in one response.","I’ll show the prepared runtime incident and safe API receipt. Live fault injection or Secret rotation is optional."]},{"id":"api-access","title":"API access","headline":"A Secret and a Connection","lines":["Secret: customer-api","HTTP Connection with Bearer authentication","The workflow uses the Connection"],"cue":"Open the existing customer-api Text Secret and HTTP Connection. Show Bearer authentication and the Secret selection. Keep the value hidden.","paragraphs":["The customer-api Text Secret is already prepared. I’ll open it and show its status without revealing the value.","Then I’ll open the existing HTTP Connection and show its Bearer authentication setting and customer-api Secret reference.","The prepared quote workflow already uses this Connection to call the customer API. The token stays in the Secret store.","The demo API runs locally. The existing Connection is limited to its loopback host and uses HTTP for this local setup."]},{"id":"calculation","title":"Reusable calculation","headline":"40 + 2 = 42","lines":["Inputs: Subtotal and Shipping","Output: Total","Outcome: Calculated"],"cue":"Open the existing CalculateOrderTotal. Show its inputs, output, outcome and prepared test result for 40 + 2 = 42. Then show the published version.","paragraphs":["This is the existing CalculateOrderTotal activity. It has two integer inputs, Subtotal and Shipping.","It adds them and returns Total. When it finishes, it reports the Calculated outcome.","Its prepared test result uses 40 and 2 and returns 42.","The prepared quote workflow uses a published version of this activity. The same calculation can be reused in other workflows."]},{"id":"workflow","title":"Quote workflow","headline":"One request, one quote","lines":["Look up the customer","Calculate the total","Return the response"],"cue":"Show the four workflow activities. Send POST /workflows/http/quotes with subtotal 40 and shipping 2. Open the completed run and select CalculateOrderTotal.","paragraphs":["Here is the prepared quote workflow. It receives an HTTP request, looks up a customer through the Connection, calculates the total, and writes the response.","I send a POST with subtotal 40 and shipping 2. The customer ID comes from the configured lookup URL.","The response contains the customer details and a total of 42.","In the completed run, I can select the calculation and see the two inputs, the output, and the Calculated outcome. More detail is available when I need it."]},{"id":"diagnosis","title":"Runtime diagnosis","headline":"The failed Body input","lines":["Inspect the incident","Read the input and its error","Fix, publish and retry"],"cue":"Optional live fault injection: change the response Body to read the missing profile.segment property, publish, and send the same request. Otherwise, show the prepared incident. Inspect the error; only if you injected the failure, restore Body, publish, and retry.","paragraphs":["The prepared run shows a response expression reading a property this customer response doesn’t have. If I want to demonstrate this live, I can set the Body to that expression, publish, and send a request.","The expression is valid JavaScript, but it fails when the workflow evaluates it. The request doesn’t receive the expected quote response.","I open the run and inspect the incident. It points to the Body input of Write HTTP Response, with the expression and its error together.","If I injected the failure, I restore Body to use the customer ID and name that the API returns, along with the total. Then I publish and send the request again.","The prepared successful run returns HTTP 200 with a total of 42."]},{"id":"rotation","title":"Secret rotation","headline":"The workflow stays the same","lines":["Update the existing Secret","Send the same request","Confirm 200 and total 42"],"cue":"Optional live rotation: update customer-api to the prepared second demo value. If you do, do not republish the repaired workflow. Repeat the request and show the safe API receipt. Otherwise, show the prepared receipt.","paragraphs":["The customer-api Secret is already prepared. If I demonstrate rotation live, I update the existing Secret and leave the repaired workflow as it is.","After a live rotation, the same request still returns the customer and a total of 42.","The local API receipt confirms that the next call used credential version two. It records the version and result, without showing the token.","The Connection picks up the updated Secret while the workflow keeps using the same published version."]}],prompt=document.querySelector('#prompt'),script=document.querySelector('#script'),chapter=document.querySelector('#chapter'),start=document.querySelector('#start'),status=document.querySelector('#status');let current=0,running=false,frame=0,last=0,offset=0;const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pause(){running=false;cancelAnimationFrame(frame);last=0;start.textContent='Start scrolling';start.setAttribute('aria-pressed','false');status.textContent='Paused'}function tick(now){if(!running)return;if(last){offset+=Math.min(now-last,100)/1000*Number(document.querySelector('#speed').value);prompt.scrollTop=offset;}last=now;if(prompt.scrollTop+prompt.clientHeight>=prompt.scrollHeight-1){pause();status.textContent='End of chapter';return}frame=requestAnimationFrame(tick)}function toggle(){if(running){pause();return}running=true;start.textContent='Pause scrolling';start.setAttribute('aria-pressed','true');status.textContent='Scrolling';last=0;offset=prompt.scrollTop;frame=requestAnimationFrame(tick)}function show(){pause();const i=chapters.findIndex(c=>c.id===location.hash.slice(1));current=i<0?0:i;const c=chapters[current];chapter.value=String(current);script.innerHTML='<h1>'+escape(c.title)+'</h1><p class="cue"><strong>On screen:</strong> '+escape(c.cue)+'</p>'+c.paragraphs.map(p=>'<p>'+escape(p)+'</p>').join('');prompt.scrollTop=0;document.querySelector('#previous').disabled=current===0;document.querySelector('#next').disabled=current===chapters.length-1;document.title=c.title+' - Teleprompter'}function go(i){location.hash=chapters[Math.max(0,Math.min(chapters.length-1,i))].id}start.onclick=toggle;document.querySelector('#restart').onclick=()=>{pause();prompt.scrollTop=0};document.querySelector('#previous').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);chapter.onchange=()=>go(Number(chapter.value));document.querySelector('#size').oninput=e=>document.documentElement.style.setProperty('--script-size',e.target.value+'px');prompt.addEventListener('wheel',pause,{passive:true});prompt.addEventListener('touchstart',pause,{passive:true});addEventListener('hashchange',show);addEventListener('keydown',e=>{if(/^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Space'||e.key===' '){e.preventDefault();toggle()}if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});show();</script></body></html>
